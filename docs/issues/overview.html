_at` is newer than or equal to the local `updated_at`.\n- [x] Online -\u003e Local sync inserts online beans and roasts that do not exist locally.\n- [x] Online -\u003e Local sync overwrites an existing local bean/roast only when the local `updated_at` is older than the online `updated_at`.\n- [x] Online -\u003e Local sync skips existing local beans/roasts when the local `updated_at` is newer than or equal to the online `updated_at`.\n- [x] Sync responses include skipped/conflict counts in addition to added/updated counts.\n- [x] Missing or invalid `updated_at` values are handled explicitly and do not cause silent data loss.\n- [x] Tests cover older target, newer target, equal timestamp, missing target document, and missing timestamp cases for beans and roasts.\n- [x] Relevant docs updated when implemented: `docs/architecture/api-endpoints.md`, `docs/architecture/data-models.md`, and the database sync feature documentation (`docs/features/database-sync.md` if created, otherwise `docs/features/README.md`).\n\n## Open Questions\n\n- Answered: timestamp-aware comparison applies to both Local -\u003e Online and Online -\u003e Local sync.\n- Answered: when the source document is copied to the target, the target keeps the source `updated_at`; sync time is not written as `updated_at`.\n- Answered: when either existing side has no valid `updated_at`, sync skips the overwrite, increments `conflicts`, and reports the document id in `conflict_ids`.\n- Answered: archived documents continue to be ignored by sync.\n\n## Implementation Notes\n\n- `sync_collection()` now returns `added`, `updated`, `skipped`, `conflicts`, and `conflict_ids`.\n- Existing target documents are replaced only when both `updated_at` values are valid datetimes and the source timestamp is newer.\n- Missing target documents are still inserted, with missing `created_at` or `updated_at` values filled on the copied target document.\n- The Settings modal completion toast now reports skipped and conflict counts.\n\n## Related Files\n\n- `app.py`\n- `templates/base.html`\n- `tests/test_sync_api.py`\n- `docs/architecture/api-endpoints.md`\n- `docs/architecture/data-models.md`\n- `docs/features/database-sync.md`","parent":"","priority":"high","sourcePath":"resolved/RN-0015-timestamp-aware-db-sync.md","status":"resolved","tags":[],"title":"Make Database Sync Timestamp-Aware","type":"bug","unlocksNow":[]},{"area":"design-system","blockedBy":[],"completed":"2026-05-02","created":"2026-05-01","decisions":[],"dependents":[],"downstream":[],"downstreamDecisions":0,"downstreamWork":0,"id":"RN-0016","kind":"ticket","markdown":"# New Design System Rollout \u0026 Full UI Redesign\n\n## Description\n\nAdopt a new design system delivered as an Anthropic design bundle and apply it across every screen of RoastLogger in a single coordinated change. This ticket installs the design tokens, base components, and updated design docs that future work will follow, and restyles every existing template against the new system. After this lands, \"adding a new thing\" should mean composing tokens and component recipes from `docs/design/` rather than authoring ad-hoc CSS.\n\n## Details\n\n- **Source of truth — design bundle**: \u003chttps://api.anthropic.com/v1/design/h/AwN20px-BxgCZwbgYpD2ZA\u003e. The endpoint returns a gzipped tar (~894 KB) containing a README and design assets. Implementer must fetch, unpack, and read the README before any styling work.\n- **Scope**: full app redesign. All eight templates and the entirety of `static/css/style.css` (4,268 lines) are in scope. Rip-and-replace, not progressive.\n- **Anchor screens** (land + review against the system first, before the rest of the app):\n  1. Beans inventory — `templates/beans_list.html`, `templates/beans_detail.html`, `templates/beans_form.html`.\n  2. Roast detail / history — `templates/roast_detail.html`, `templates/index.html` (history table).\n- **Remaining screens** restyled in the same ticket once anchors are validated: `templates/base.html`, `templates/roast_live.html`, `templates/roast_edit.html`, plus the label-creator and sticker-sheet modals embedded in the bean templates.\n- **Design system installation** updates the existing `docs/design/` structure (do not create a parallel folder). Refresh:\n  - `docs/design/principles.md` if any of the five principles (tablet-first, chart dominance, glanceable readings, minimal chrome, dark-mode first-class) is changed or replaced.\n  - `docs/design/foundations/{color,typography,spacing-layout,dark-mode}.md` with new token values.\n  - `docs/design/components/{buttons,cards-surfaces,forms,instrument-displays}.md` with updated recipes.\n  - `docs/design/screens/*.md` with new layouts.\n  - `docs/design/patterns/*.md` if label/sticker patterns are touched.\n  - `docs/design/README.md` navigation if file structure changes.\n- **CSS approach**: rip and replace `static/css/style.css`. New component styles must consume `var(--*)` tokens — no hardcoded hex anywhere. No orphan rules referring to deleted classes.\n- **Dark mode parity**: every new token has paired light + dark values. Dark mode remains first-class, not a tacked-on theme.\n- **Live roasting constraints survive the redesign**: ≥54px touch targets on roasting-critical controls, chart dominance preserved, monospaced numerics for timer/temperature/RoR. If the new system clashes with any of these, raise it in Open Questions before merging — do not silently relax the principle.\n- **Forward-looking convention**: capture in `docs/design/README.md` that all new UI must (a) consume `var(--*)` tokens and (b) link to a component recipe under `docs/design/components/`. Ad-hoc styling is not allowed post-rollout.\n- **Out of scope**: backend behaviour, API contracts, data model, hardware integration, label / sticker template *content* (visual styling of those templates is in scope; the printable layouts they generate are not).\n- please note that i want to keep th ecurrent roast live interaction untouched, this is the key.\n\n## Implementation Notes\n\n- 2026-05-02 refinement pass: edit bean now uses the same `.form-section` design-system panels as edit roast, grouped by Bean Profile, Flavor Notes, and Inventory.\n- Shared form controls now use tokenized inset fields, a section accent rule, and `.form-group-title` for bean/roast names.\n- Beans table now uses a fixed `colgroup`, centered sortable metric columns, and horizontal overflow so Stock, Purchase Date, and Price/kg headers align with their values.\n- Bean and roast record names now use the `--font-display` title role (`Raleway`) in list rows, detail headers, and title inputs.\n- Follow-up: roast list/history tables no longer expose an Actions header/column. Row actions render only as a right-edge hover/focus overlay on a neutral row highlight, edit forms are left-aligned at a wider max width, and empty review panels use a compact Add Review button.\n- Follow-up: sticker sheet modal now uses reduced chrome and viewport-bounded preview sizing so the full sheet stays visible; the selected-image list handles overflow internally.\n- Follow-up: review card hover now uses a neutral grey contour instead of the dark primary outline.\n- Follow-up: review cards no longer use a left color strip; they use a plain neutral border at rest.\n\n## Acceptance Criteria\n\n- [ ] Design bundle fetched, unpacked, and its README summarized in the implementing branch's PR description.\n- [ ] New design tokens (color, typography, spacing, radii, shadows) live as CSS variables in `static/css/style.css` (or a dedicated tokens file imported from it), with full light + dark coverage.\n- [ ] `static/css/style.css` rewritten end-to-end with no orphan rules referring to deleted classes.\n- [ ] All eight templates restyled against the new system: `base.html`, `index.html`, `beans_list.html`, `beans_detail.html`, `beans_form.html`, `roast_detail.html`, `roast_edit.html`, `roast_live.html`.\n- [ ] Beans inventory and roast detail/history screens explicitly called out as the anchor reference for the new system in `docs/design/screens/`.\n- [ ] Live roasting screen re-verified against principles 1–4 (touch targets ≥54px, chart dominance, glanceable monospaced numerics, minimal chrome) under the new tokens.\n- [ ] Dark mode verified on every restyled screen.\n- [ ] All design docs updated: `docs/design/README.md`, `docs/design/principles.md`, every file under `foundations/`, `components/`, `screens/`, and any touched files under `patterns/`.\n- [ ] `docs/design/README.md` documents the post-rollout convention: new UI consumes `var(--*)` tokens and links to a component recipe — no ad-hoc styles.\n- [ ] `uv run pytest` passes.\n- [ ] Manually verified in a browser at tablet width (1024px) and desktop width (1440px), in both light and dark mode.\n- [ ] Relevant docs updated when implemented: `docs/design/README.md`, `docs/design/principles.md`, `docs/design/foundations/*.md`, `docs/design/components/*.md`, `docs/design/screens/*.md`, `docs/design/patterns/*.md` (if touched), and `docs/architecture/tech-stack.md` (only if a new CSS framework, font, or icon dependency is added).\n\n## Open Questions\n\n- What is the design system named in the bundle's README, and what palette / type scale / icon set does it ship? — answer:\n- Does the new system change any of the five existing design principles (especially \"tablet-first\" and \"dark-mode first-class\")? If a principle is replaced, `principles.md` must be rewritten, not appended to. — answer:\n- Should the existing warm-roastery palette (`#0E0D0B` base, `#C9A87A` accent) be preserved, replaced, or layered with a brand accent from the new system? — answer:\n- Are there new components in the bundle that don't map to existing recipes (`buttons`, `cards-surfaces`, `forms`, `instrument-displays`)? If yes, add new files under `docs/design/components/` rather than expanding existing ones. — answer:\n- Does the bundle ship icons or illustrations? If yes, where should they live under `static/img/` and how should templates reference them? — answer:\n- Does the new system specify a CSS framework, utility library, or font CDN that introduces a new dependency? If yes, this ticket also updates `docs/architecture/tech-stack.md`. — answer:\n- Land as one large PR or split into foundations PR + per-screen PRs? Current direction is one merge per the user's \"rip and replace\" choice — confirm before opening the first PR. — answer:\n- Any rollout date or event tied to this work? — answer:\n\n## Related Files\n\n- `static/css/style.css`\n- `static/img/`\n- `templates/base.html`\n- `templates/index.html`\n- `templates/beans_list.html`\n- `templates/beans_detail.html`\n- `templates/beans_form.html`\n- `templates/roast_detail.html`\n- `templates/roast_edit.html`\n- `templates/roast_live.html`\n- `docs/design/README.md`\n- `docs/design/principles.md`\n- `docs/design/foundations/color.md`\n- `docs/design/foundations/typography.md`\n- `docs/design/foundations/spacing-layout.md`\n- `docs/design/foundations/dark-mode.md`\n- `docs/design/components/buttons.md`\n- `docs/design/components/cards-surfaces.md`\n- `docs/design/components/forms.md`\n- `docs/design/components/instrument-displays.md`\n- `docs/design/screens/bean-inventory.md`\n- `docs/design/screens/roast-detail.md`\n- `docs/design/screens/live-roasting.md`\n- `docs/design/screens/label-creator.md`\n- `docs/design/screens/sticker-sheet.md`\n- `docs/design/patterns/label-templates.md`\n- `docs/design/patterns/sticker-templates.md`","parent":"","priority":"high","sourcePath":"resolved/RN-0016-design-system-rollout.md","status":"resolved","tags":[],"title":"New Design System Rollout \u0026 Full UI Redesign","type":"feature","unlocksNow":[]},{"area":"live-roasting","blockedBy":[],"completed":"2026-05-02","created":"2026-05-02","decisions":[],"dependents":[],"downstream":[],"downstreamDecisions":0,"downstreamWork":0,"id":"RN-0017","kind":"ticket","markdown":"# Manually Set Draft Roast to Completed\n\n## Description\n\nUsers need a way to manually finish a draft roast from the live setup page without running the live roast timer. The app should introduce an explicit roast lifecycle status for new data, while preserving timestamp-derived fallback behaviour for older roasts.\n\n## Details\n\n- Add a draft-only manual action on `/roast/live/\u003croast_id\u003e` labeled **Set to Completed**.\n- Introduce a real roast lifecycle/status field for new and updated roasts:\n  - new roast creation sets the lifecycle to draft;\n  - starting a roast sets it to started;\n  - ending a roast sets it to completed;\n  - manually setting a draft to completed sets it to completed.\n- Preserve existing roasts by falling back to the current timestamp-derived lifecycle when the explicit status field is missing:\n  - `roast_end_time` present -\u003e completed;\n  - `roast_start_time` present and no `roast_end_time` -\u003e started/in progress;\n  - neither timestamp present -\u003e draft.\n- Manual completion is only for draft roasts. It should not be shown for active/started roasts or already completed roasts.\n- Manual completion should update lifecycle metadata without fabricating live roast data such as temperature curve points, sensor diagnostics, key timing events, or a Drop event.\n- The action should use confirmation copy that makes the lifecycle change clear before the user commits.\n- Completed-by-status roasts should appear as completed in dashboard and bean-history lifecycle badges/routes even when they do not have live-roast timing data.\n- Old data must remain readable without requiring a one-time migration.\n\n## Acceptance Criteria\n\n- [x] A draft roast on `/roast/live/\u003croast_id\u003e` exposes a clear **Set to Completed** action.\n- [x] Active/started roasts and already completed roasts do not expose the draft-only manual completion action.\n- [x] New roast creation writes an explicit draft lifecycle/status value.\n- [x] Starting a roast writes the started lifecycle/status value.\n- [x] Ending a roast writes the completed lifecycle/status value.\n- [x] Manually setting a draft to completed writes the completed lifecycle/status value and refreshes `updated_at`.\n- [x] Manual completion does not create temperature curve readings, sensor diagnostics, key timing events, or a Drop event by itself.\n- [x] Roasts missing the new lifecycle/status field still derive lifecycle from `roast_start_time` and `roast_end_time` exactly as they do today.\n- [x] Dashboard and bean-detail roast history use the explicit lifecycle/status first, with timestamp fallback for old roasts.\n- [x] Tests cover new roast status defaults, start/end status transitions, manual draft completion, active-roast rejection, completed-roast rejection, and old-roast fallback.\n- [x] Relevant docs updated when implemented: `docs/architecture/data-models.md`, `docs/architecture/api-endpoints.md`, `docs/features/live-roasting.md`, `docs/design/screens/live-roasting.md`.\n\n## Open Questions\n\n- Answered: stored lifecycle values are `draft`, `started`, and `completed`. The UI still labels `started` as **In Progress**.\n- Answered: manual draft completion leaves bean stock unchanged. Stock is deducted only by starting a live roast.\n- Answered: after manual completion succeeds, the user is redirected to the roast edit page for post-roast fields like roasted weight and notes.\n- Answered: manual completion does not require minimum draft fields beyond the roast existing and still being in draft lifecycle.\n\n## Implementation Notes\n\n- New roasts write `lifecycle_status: \"draft\"`.\n- `/api/roast/start/\u003croast_id\u003e` writes `lifecycle_status: \"started\"` and rejects non-draft roasts.\n- `/api/roast/end/\u003croast_id\u003e` writes `lifecycle_status: \"completed\"` and rejects non-started roasts.\n- `/api/roast/complete_draft/\u003croast_id\u003e` is draft-only and only updates `lifecycle_status` plus `updated_at`.\n- Dashboard and bean-history badges/routes use `lifecycle_status` first, with timestamp fallback for old documents.\n\n## Related Files\n\n- `app.py`\n- `templates/roast_live.html`\n- `templates/index.html`\n- `templates/beans_detail.html`\n- `tests/test_roasts_api.py`\n- `docs/architecture/data-models.md`\n- `docs/architecture/api-endpoints.md`\n- `docs/features/live-roasting.md`\n- `docs/design/screens/live-roasting.md`","parent":"","priority":"medium","sourcePath":"resolved/RN-0017-manual-draft-complete.md","status":"resolved","tags":[],"title":"Manually Set Draft Roast to Completed","type":"feature","unlocksNow":[]},{"area":"app-architecture","blockedBy":[],"completed":"","created":"2026-05-02","decisions":[],"dependents":["RN-0003"],"downstream":["RN-0003"],"downstreamDecisions":0,"downstreamWork":1,"id":"RN-0018","kind":"ticket","markdown":"\u003c!-- markdownlint-disable MD025 --\u003e\n\n# Refactor Oversized Source Files into Focused Modules\n\n## Description\n\nSplit every existing human-authored source file above 1,000 physical lines\ninto focused modules, and add an automated repository guard against future\noversized code or documentation. Preserve the application's behavior,\ninterfaces, deployment contract, visual design, data model, and dependency\nset.\n\n## Details\n\n### Current Oversized Source Files\n\nThe implementation must address all three human-authored files currently above\nthe limit:\n\n| File | Baseline | Required boundary |\n| --- | ---: | --- |\n| `app.py` | 1,860 lines | Thin compatibility entry point plus imported application modules |\n| `templates/roast_live.html` | 1,660 lines | Focused template markup plus imported live-roast JavaScript modules |\n| `.claude/skills/ticket-master/scripts/generate_issues_index.py` | 1,017 lines | Thin CLI/orchestrator plus imported tracker modules |\n\nLine counts are the planning baseline and may change before implementation.\nRecount tracked files before starting and include any additional\nhuman-authored file that has crossed the limit.\n\n### Flask Application Boundary\n\n- Keep `app.py` as the stable development and Gunicorn entry point. It must\n  continue to export `app`, support direct execution, and preserve\n  `gunicorn app:app`.\n- Add a `roastlogger` package with\n  `create_app(config_overrides=None)`. `app.py` creates the default instance\n  from that factory.\n- Put configuration and database connection/selection in focused modules.\n  Make the local database name and sensor URL app configuration so tests can\n  override them without changing production defaults.\n- Register page, bean, roast, temperature, settings, and synchronization\n  routes through feature-focused Flask blueprints.\n- Put roast lifecycle/live-sync behavior, temperature sensor access and RoR,\n  and database synchronization in service modules. Route modules may depend on\n  services; services must not import the global `app` instance or blueprints.\n- Keep API request parsing, validation, serialization, status codes, and error\n  behavior auditable at the route/service boundary.\n\n### Live-Roast Template Boundary\n\n- Keep server-rendered live-roast markup in\n  `templates/roast_live.html`, but remove the large inline implementation\n  script.\n- Serialize all Jinja-derived runtime values through one safely encoded\n  `\u003cscript type=\"application/json\" id=\"live-roast-config\"\u003e` bootstrap object.\n- Load a stable JavaScript entry point from `static/js/live-roast/`. Split\n  chart setup, polling/session state, setup and event controls, and fullscreen\n  behavior into focused modules.\n- Preserve existing DOM identifiers, timing cadence, chart datasets and\n  annotations, sensor-state presentation, touch/fullscreen interactions, and\n  visible layout.\n\n### Ticket-Generator Boundary\n\n- Keep `.claude/skills/ticket-master/scripts/generate_issues_index.py` as the\n  supported CLI and import compatibility module.\n- Extract record/config models and parsing, metadata/dependency validation,\n  status filing, and Markdown generation into a small internal tracker\n  package. Keep dashboard rendering in its existing focused module.\n- Preserve both generator commands, deterministic output, canonical filing,\n  validation messages, and callable names imported by the existing tests and\n  compatibility wrapper.\n\n### Repository Line-Limit Guard\n\n- Add a test that counts physical lines in tracked, human-authored\n  `*.py`, `*.js`, `*.html`, `*.css`, `*.cpp`, `*.h`, and `*.md` files.\n- Fail with the path and observed line count when any included file exceeds\n  1,000 lines.\n- Exclude generated files such as `docs/issues/overview.html`, files carrying\n  the tracker generated notice, vendored/minified assets, binaries, fonts,\n  licenses, and lock files.\n- The repository guidance must explain that oversized code is split by\n  responsibility and imported, included, or registered from a stable entry\n  point. Oversized documentation is grouped into aspect-specific files under\n  a named directory with a concise `README.md` index and updated navigation.\n- Do not satisfy the check with arbitrary numbered chunks or by adding a file\n  to the exclusion list.\n\n### Compatibility And Delivery\n\n- Preserve every page/API URL, HTTP method, redirect, template, status code,\n  JSON shape, session behavior, database read/write, timestamp rule, and\n  application configuration default.\n- Do not add dependencies, migrations, UI/CSS changes, or user-facing\n  behavior.\n- Extract one boundary at a time and run focused regression tests after each\n  extraction. Run the full suite before resolution.\n\n## Acceptance Criteria\n\n- [ ] `app.py`, `templates/roast_live.html`, and the ticket generator are each at or below 1,000 physical lines, and every extracted human-authored file also satisfies the limit.\n- [ ] `app.py` remains the direct-run and `gunicorn app:app` compatibility entry point and creates the application through `create_app(config_overrides=None)`.\n- [ ] Existing page routes and API endpoints continue to use the same URLs, HTTP methods, redirects, templates, status codes, and JSON response shapes.\n- [ ] Configuration/database access, route blueprints, roast services, sensor/RoR services, and synchronization services follow the dependency direction described above without circular imports or global-app imports from services.\n- [ ] The live-roast page uses one safely encoded bootstrap object and focused JavaScript modules while preserving charting, polling, controls, sensor states, responsive behavior, and fullscreen behavior.\n- [ ] The ticket generator keeps its CLI/import compatibility, validation, filing, and deterministic generated output after its internal modules are extracted.\n- [ ] An automated repository check rejects oversized human-authored code and documentation and applies only the documented exemptions.\n- [ ] Focused route, service, live-page, and tracker regression coverage protects each extraction boundary, and `uv run pytest` passes.\n- [ ] No database schema changes, new dependencies, visual changes, or user-facing behaviour changes are included.\n- [ ] Documentation Impact reviewed against the implementation diff; every affected document below is updated in this branch.\n\n## Documentation Impact\n\n- `AGENTS.md`\n- `CLAUDE.md`\n- `docs/README.md`\n- `docs/architecture/README.md`\n- `docs/architecture/tech-stack.md`\n- `docs/features/live-roasting.md`\n- `tests/README.md`\n- Conditional: `.claude/skills/ticket-master/SKILL.md` if the supported\n  generator command, import surface, or file references change.\n- Conditional: `docs/design/screens/live-roasting.md` if preserving the\n  existing interaction requires any selector, layout, or interaction change.\n\n## Open Questions\n\n- None. The 1,000-line limit, current scope, module boundaries, compatibility\n  constraints, and exemptions are decided.\n\n## Related Files\n\n- `app.py`\n- `templates/roast_live.html`\n- `static/js/roast-chart.js`\n- `.claude/skills/ticket-master/scripts/generate_issues_index.py`\n- `.claude/skills/ticket-master/scripts/render_dashboard.py`\n- `scripts/generate_issues_index.py`\n- `tests/test_ticket_system.py`\n- `tests/test_beans_api.py`\n- `tests/test_roasts_api.py`\n- `tests/test_temperature_api.py`\n- `tests/test_sync_api.py`\n- `tests/test_reviews_api.py`\n- `AGENTS.md`\n- `CLAUDE.md`\n- `docs/README.md`\n- `docs/architecture/README.md`\n- `docs/architecture/tech-stack.md`\n- `docs/features/live-roasting.md`","parent":"","priority":"high","sourcePath":"pending/RN-0018-refactor-app-py.md","status":"pending","tags":[],"title":"Refactor Oversized Source Files into Focused Modules","type":"refactor","unlocksNow":["RN-0003"]},{"area":"live-roasting","blockedBy":[],"completed":"2026-05-03","created":"2026-05-02","decisions":[],"dependents":[],"downstream":[],"downstreamDecisions":0,"downstreamWork":0,"id":"RN-0019","kind":"ticket","markdown":"# Show Roast Times in Operator Timezone (Not Raw UTC Clock)\n\n## Description\n\nOperators in US Eastern Time see roast timestamps on the roasts index and roast detail screens that read like “2026-05-03 00:40” after an evening roast on May 2, which feels like incorrect data collection even when the underlying instants match reality.\n\n## Details\n\n### Diagnosis (2026-05-02, local `roastlogger` DB sample)\n\nRecent completed roasts (e.g. Kenya, Bishan, Watermelon, Passionfruit, Gucci Washed Dark) have `roast_start_time` values such as:\n\n- `2026-05-02 23:57:30` (Kenya — first roast of the evening)\n- `2026-05-03 00:09–00:41` for subsequent roasts on the same session\n\nAgainst these rows in MongoDB, values are **`datetime` with `tzinfo None`** (PyMongo default for BSON `Date` — stored as milliseconds since Unix epoch in **UTC**).\n\nInterpreting those naïve datetimes as **UTC** and converting to **`America/New_York` (EDT, UTC−4)** yields wall times on **May 2 between ~7:57 PM and ~8:41 PM**, which matches “May 2 ~8 PM East Coast roast night.” So **collection/storage of the instant is consistent with correct behaviour**; the bug is primarily **presentation**.\n\n### Root cause\n\n- `POST /api/roast/start/` sets `roast_start_time` via `get_current_time_with_tz()` (`datetime.now(local_tz)` with `TIMEZONE` default `America/New_York`). PyMongo persists that instant in BSON as UTC.\n- On read, datetimes typically come back as **naïve UTC**.\n- `@app.template_filter(\"format_date\")` documents itself as *“no timezone conversion - shows DB value as-is”* and formats with `%Y-%m-%d %H:%M`. That prints the **UTC clock face**, not the operator-local wall time.\n\nSame filter is used for `roast_date`, `roast_end_time`, reviews, etc., so anywhere it is used without conversion may feel “off” relative to Eastern (or whichever `TIMEZONE` the server is configured for).\n\n### Out of scope (unless product decides otherwise)\n\n- Changing how durations or `elapsed_seconds` are computed (those are deltas; unaffected if start/end share the same representation).\n- Forcing browsers to infer tz from JS without a server-side convention — prefer aligning display with **`TIMEZONE` env / operator expectation** documented in deployment.\n\n### Optional data repair\n\n**Do not blindly subtract hours in Mongo.** For the sampled May 2026 session above, timestamps are correct instants; “fixing” them would corrupt data.\n\nIf historical audit finds documents that were mistakenly written as *local-clock naïve* treated as UTC, remediation would need a **per-document heuristic** — out of scope here unless surfaced by a dedicated audit ticket.\n\n### Verification snippet (read-only — run against a backup or local DB)\n\nUse this to confirm a naïve `roast_start_time` matches Eastern wall time:\n\n```python\n\"\"\"Read-only check: naive Mongo datetimes ↔ Eastern wall clock.\"\"\"\n\nfrom pymongo import MongoClient\nfrom datetime import datetime, timezone\n\nimport pytz\n\nEASTERN = pytz.timezone(\"America/New_York\")\nuri = \"mongodb://localhost:27017/\"\ncol = MongoClient(uri).roastlogger.roasts\n\nfor r in col.find(\n    {\"title\": {\"$in\": [\"Kenya\", \"Gucci Washed Dark\"]}},\n    {\"title\": 1, \"roast_start_time\": 1},\n):\n    naive = r.get(\"roast_start_time\")\n    if naive is None:\n        continue\n    # BSON instant is UTC; naive from PyMongo → interpret as UTC\n    utc_dt = naive.replace(tzinfo=timezone.utc)\n    eastern = utc_dt.astimezone(EASTERN)\n    print(r[\"title\"], \"stored naive:\", naive, \"| Eastern:\", eastern.strftime(\"%Y-%m-%d %H:%M %Z\"))\n```\n\nExpected pattern for correct data: Eastern date stays on May 2 for an ~8 PM session.\n\n### If migration is ever warranted (only after audit — not recommended for reported case)\n\nA future implementer could use the same UTC→`TIMEZONE.astimezone` rule to detect outliers; **any** `$set` of `roast_start_time` / `roast_end_time` should preserve the intended instant (epoch milliseconds), never “shift the clock” without proving the stored epoch is wrong.\n\n## Acceptance Criteria\n\n- [x] Roast list “Date” column shows **wall time in the configured operator timezone** (same semantics as `TIMEZONE` / product decision), not raw UTC digits, OR the UI explicitly labels “UTC” if product chooses UTC display.\n- [x] Roast detail start/end times (and related date fields using the same filter) behave consistently with the chosen rule.\n- [x] Naïve datetimes loaded from Mongo are interpreted consistently (**document** whether they are treated as UTC, matching PyMongo BSON contract).\n- [x] No regression on duration/elapsed computations.\n- [x] Relevant docs updated when implemented: `docs/features/live-roasting.md`, `docs/architecture/data-models.md` (timestamp / display note under Timestamp Policy), and any affected `docs/design/` screen doc for the roast list / detail screens.\n\n## Open Questions\n\n- Should the app always use **`TIMEZONE` env** for display, or should per-user timezone (browser or profile) be supported later? (Default MVP: honour `TIMEZONE` consistently.)\n\n## Related Files\n\n- `app.py`\n- `templates/index.html`\n- `templates/roast_detail.html`\n- `templates/beans_detail.html`\n- `.env.example` (document `TIMEZONE` for deployed vs local parity)","parent":"","priority":"medium","sourcePath":"resolved/RN-0019-roast-datetime-local-display.md","status":"resolved","tags":[],"title":"Show Roast Times in Operator Timezone (Not Raw UTC Clock)","type":"bug","unlocksNow":[]},{"area":"label-creator","blockedBy":[],"completed":"2026-05-04","created":"2026-05-04","decisions":[],"dependents":[],"downstream":[],"downstreamDecisions":0,"downstreamWork":0,"id":"RN-0020","kind":"ticket","markdown":"# Sticker modal image list — remove unused scrollbar and dead space\n\n## Description\n\nIn the **Create Stickers** modal on the beans list, the left column’s image list shows a vertical scrollbar and leaves noticeable empty space below the rows even when all four US-4 sticker rows are visible and nothing overflows. The layout should grow only as tall as the content when it fits, and show scrolling only when the list actually exceeds the available space.\n\n## Details\n\n- **Where:** Beans list → **Create Stickers** → modal; left column under **Select Images**, when four images are listed (e.g. US-4, 4 / 4 images).\n- **Current behaviour:** A scrollbar appears on the image list while extra whitespace sits below the last row — the list region reads as shorter than it needs to be for the content, or the scroll container is taller than the content without needing to scroll.\n- **Desired behaviour:** When every row fits without overflow, there is no scrollbar track and no large unused gap under the last row. When the user adds enough rows or uses a shorter viewport so content cannot fit, scrolling appears as needed (keyboard / touch still work).\n- **Out of scope:** Changing sticker PDF layout, template math, or preview panel behaviour; this ticket is only the left-column list chrome and spacing.\n\n## Acceptance Criteria\n\n- [x] With US-4 and four image rows on a typical desktop viewport, the image list does not show an unnecessary vertical scrollbar.\n- [x] Dead space below the last image row is reduced so the list area does not look like a tall empty box when content fits.\n- [x] If future templates allow more rows or the viewport is short, overflow still scrolls correctly and remains accessible.\n- [x] Relevant docs updated when implemented: `docs/design/screens/sticker-sheet.md`, and `docs/features/sticker-sheet.md` only if layout/behaviour notes need to mention the list region.\n\n## Open Questions\n\n- Should the list use a **minimum** height when there are zero or one rows so the column does not jump wildly, or is strictly content-sized height preferred for all counts?\n\n## Resolution\n\nRaised the image list `max-height` clamp (was capped at 240px, which was shorter than four sticker rows plus gaps, causing an unnecessary scrollbar). Set `.sticker-sheet-controls { height: fit-content }` so the left column does not inherit excess vertical space. Updated `docs/design/screens/sticker-sheet.md`.\n\n## Related Files\n\n- `templates/beans_list.html`\n- `static/css/screens/sticker-sheet.css`\n- `static/js/sticker-sheet.js`","parent":"","priority":"low","sourcePath":"resolved/RN-0020-sticker-modal-image-list-layout.md","status":"resolved","tags":[],"title":"Sticker modal image list — remove unused scrollbar and dead space","type":"bug","unlocksNow":[]},{"area":"label-creator","blockedBy":[],"completed":"2026-05-05","created":"2026-05-05","decisions":[],"dependents":[],"downstream":[],"downstreamDecisions":0,"downstreamWork":0,"id":"RN-0021","kind":"ticket","markdown":"# Label PNG Export Prints With Incorrect Colors\n\n## Description\n\nThe bean label creator preview appears to show the expected colors on screen, but the downloaded PNG can print with noticeably different colors. This makes the printable label output unreliable even when the in-browser design looks correct.\n\n## Details\n\n- Trigger: open a bean detail page, use **Create Label**, download the PNG export, then print the downloaded label.\n- Reported current behavior: the modal preview colors look right, but printed output colors are \"way off.\"\n- The downloaded PNG looks correct when opened before printing, so the first confirmed failure point is the print path rather than the canvas preview or saved PNG appearance.\n- Confirmed print path: macOS Preview print.\n- Observed print failure: output is too light, and black/dark areas do not print as true black.\n- Printer and paper variability is unknown because this has not been tested on another printer or paper stock yet.\n- Desired behavior: the downloaded PNG should print materially closer to the on-screen preview for the same template, accent color, image, and export size.\n- Initial code read: `static/js/label-creator.js` paints directly to canvas with CSS hex and `rgba(...)` values; no obvious template-level color conversion is happening before export.\n- Initial code read: `templates/beans_detail.html` exports via `canvas.toBlob(..., 'image/png')`, then injects a `pHYs` chunk to preserve the selected physical print size.\n- Investigation should check whether the exported PNG lacks explicit color-profile metadata, such as `sRGB`, `gAMA`, `cHRM`, or ICC profile data, causing print apps or printer drivers to interpret colors differently.\n- Investigation should also check whether browser-generated PNG metadata already contains a `pHYs` chunk before injection. If so, the current injection path may create duplicate physical-size metadata.\n- Preserve the exact physical-size behavior of the PNG export. The fix should not regress the current ability to insert a 12.7 x 10.16 cm label at the intended size.\n- Include both standard and rotated 90 degree PNG exports in the investigation, since both use the same canvas export path.\n- Recommended plan:\n  1. Export a failing label PNG and inspect its chunks with a metadata tool to confirm `pHYs`, `sRGB`, `gAMA`, `cHRM`, and ICC/profile state.\n  2. Create a controlled test label with black, near-black, white, mid-gray, and the selected accent color so print output can be compared without photo/image noise.\n  3. Print the same PNG through macOS Preview and one alternate path, such as browser print, Pages, or PDF conversion, to isolate Preview-specific color handling.\n  4. If metadata is ambiguous, update PNG export to write a predictable profile/signaling strategy while preserving the existing `pHYs` physical-size chunk.\n  5. If metadata is correct but macOS Preview still prints too light, document a recommended print workflow or add an app-side \"print test / export for print\" path with stronger dark values.\n\n## Acceptance Criteria\n\n- [ ] Reproduce and document at least one concrete color-shift case, including template, accent color, optional image, print app, printer, and paper type when available.\n- [ ] Confirm whether the issue is specific to macOS Preview print by testing one alternate print path.\n- [ ] Add or manually use a controlled test label containing black, near-black, white, mid-gray, and the selected accent color.\n- [ ] Inspect the exported PNG metadata and document whether it contains duplicate `pHYs` chunks or missing / ambiguous color-profile chunks.\n- [ ] Identify whether the color shift happens in print preview, only on physical print, or both.\n- [ ] Implement a fix or explicit product guidance that makes label PNG print color predictable enough for normal use.\n- [ ] Verify standard PNG and rotated PNG exports after the change.\n- [ ] Verify the exported PNG still opens or inserts at the selected physical size.\n- [ ] Relevant docs updated when implemented: `docs/features/bean-label-creator.md`, `docs/design/patterns/label-templates.md`, `docs/design/screens/label-creator.md`.\n\n## Open Questions\n\n- Which template, accent color, image, and font preset produced the bad print?\n- Does macOS Preview's print preview already look too light, or does it only become too light on physical paper?\n- Does the same PNG print closer to expected colors from browser print, Pages, Word, or PDF conversion?\n\n## Related Files\n\n- `static/js/label-creator.js`\n- `templates/beans_detail.html`\n- `docs/features/bean-label-creator.md`\n- `docs/design/patterns/label-templates.md`\n- `docs/design/screens/label-creator.md`\n\n## Resolution\n\nClosed without product changes. The print color issue was caused by the printer running low on ink, not by the label canvas renderer, PNG export path, or macOS Preview print handling.","parent":"","priority":"medium","sourcePath":"wont_fix/RN-0021-label-png-print-color-shift.md","status":"wont_fix","tags":[],"title":"Label PNG Export Prints With Incorrect Colors","type":"bug","unlocksNow":[]},{"area":"database-sync","blockedBy":[],"completed":"","created":"2026-07-29","decisions":[],"dependents":[],"downstream":[],"downstreamDecisions":0,"downstreamWork":0,"id":"RN-0022","kind":"ticket","markdown":"# Add Guarded, Audited Bidirectional Database Sync\n\n## Description\n\nReplace unguarded operational database-sync writes with a maintained,\ndevice-attributed workflow modeled on\n`econ_experiment_agents` ticket `EEA-0012`. The workflow must preview the\noperation, back up the complete destination, require two exact confirmations,\npreserve RoastLogger's timestamp-aware merge rules, and record each applied\nattempt in an append-only audit history.\n\nThe guarded CLI is the primary applied-sync entry point. The Settings modal\nretains direction buttons as audited, non-mutating preflight actions, while the\nexisting sync API routes must no longer provide a way to bypass the backup,\nconfirmation, and audit guarantees.\n\n## Details\n\n### Current Behavior\n\n- The Settings modal immediately calls `POST /api/sync/online-to-local` or\n  `POST /api/sync/local-to-online`.\n- The endpoints synchronize the `beans` and `roasts` collections directly.\n  They preserve the timestamp-aware conflict behavior delivered by `RN-0015`,\n  but they do not provide a dry run, create a destination backup, attribute the\n  run to a device, require typed confirmations, or write an audit record.\n- `.env.example` documents the database endpoints but not the stable machine\n  identity needed to distinguish local backup origins and audit records.\n- The operator's untracked `.env` already uses\n  `DEVICE=howie-macbook-air`. That local value must remain untracked and must\n  not be copied into application logs or committed configuration.\n\n### Proposed Operator Flow\n\nAdd `scripts/sync_database.py` as the supported operational entry point:\n\n```bash\n# Preview online -\u003e local\nuv run python scripts/sync_database.py \\\n  --direction online-to-local \\\n  --dry-run\n\n# Apply online -\u003e local with two confirmations\nuv run python scripts/sync_database.py \\\n  --direction online-to-local\n\n# Preview local -\u003e online\nuv run python scripts/sync_database.py \\\n  --direction local-to-online \\\n  --dry-run\n\n# Apply local -\u003e online with two confirmations\nuv run python scripts/sync_database.py \\\n  --direction local-to-online\n\n# Restrict sync scope; the complete destination is still backed up\nuv run python scripts/sync_database.py \\\n  --direction online-to-local \\\n  --collection beans\n```\n\nThe CLI must support:\n\n- required `--direction {online-to-local,local-to-online}`;\n- repeatable `--collection`, limited to known source collections and defaulting\n  to `beans` and `roasts`;\n- a positive `--batch-size`; and\n- `--dry-run`.\n\nUse the existing endpoint names and database name:\n\n| Direction | Source | Destination | Required destination backup |\n| --- | --- | --- | --- |\n| `online-to-local` | `MONGO_URI` / `roastlogger` | `MONGO_URI_LOCAL` / `roastlogger` | Complete local database |\n| `local-to-online` | `MONGO_URI_LOCAL` / `roastlogger` | `MONGO_URI` / `roastlogger` | Complete online database |\n\nReject a missing or blank `DEVICE`, unsafe device/path characters, an invalid\nbatch size, unknown collections, unavailable endpoints, and configurations\nwhose source and destination resolve to the same endpoint and database.\nConsole output and audit records may show only sanitized roles, host labels,\ndatabase names, and the stable device name; they must never expose a MongoDB\nURI or credentials.\n\n### Timestamp-Aware Sync Contract\n\nMove the existing synchronization behavior behind focused, reusable services\nso the CLI and any retained route adapter cannot drift:\n\n- Synchronize non-archived source documents from `beans` and `roasts`.\n- Insert a source document when its `_id` is absent from the destination.\n- Update an existing destination document only when both `updated_at` values\n  are valid and the source is newer.\n- Skip a destination document that is newer than or equal to the source.\n- Report a conflict, without overwriting, when timestamps cannot be compared.\n- Preserve the source timestamps for copied documents and keep the existing\n  legacy-timestamp fill behavior for new destination documents.\n- Retain destination-only documents; synchronization must never delete data.\n- Process collections sequentially and stop on the first failed collection.\n\nThis ticket adds operational safeguards around the behavior from `RN-0015`; it\ndoes not replace it with unconditional `_id` upserts.\n\n### Dry Run And Applied Run\n\nA dry run must check connectivity and print the complete plan: run ID, device,\ndirection, sanitized endpoints, resolved sync collections, source and\ndestination counts, full destination-backup scope and path, and planned audit\npath. It must not create a backup, prompt for confirmation, write an audit\nrecord, or write to either database.\n\nAn applied run must:\n\n1. Generate a stable run ID and print the complete preflight plan.\n2. Require the exact token `BACKUP \u003crun-id\u003e`. A mismatch or end-of-input\n   cancels before backup work and creates no audit record.\n3. Back up the complete destination database. Abort before sync if any\n   collection or manifest step is incomplete.\n4. Require the exact token `APPLY \u003cdirection\u003e \u003crun-id\u003e`. There is no `--yes`,\n   environment flag, or other confirmation bypass.\n5. Synchronize resolved collections sequentially and stop on the first\n   failure.\n6. Print per-collection and aggregate added, updated, skipped, conflict, and\n   post-run count summaries.\n\nNo synchronization write may occur before both exact tokens have been\naccepted. Backup filesystem writes happen after the first token and before the\nsecond by design.\n\n### Restorable Destination Backup\n\nEvery applied run must back up every collection and document in the destination\ndatabase, including archived documents and collections excluded by\n`--collection`.\n\n- Preserve `_id`, BSON dates, `ObjectId`, `Decimal128`, nested values, and other\n  supported BSON values using documented MongoDB Extended JSON.\n- Stream one document per line to an encoded per-collection `.jsonl` file\n  without loading a full collection into memory.\n- Record the source collection name and use collision-safe reversible\n  filenames.\n- Record document counts, byte sizes, and SHA-256 checksums.\n- Write collection files and the manifest atomically.\n- Build under a clearly named partial directory and finalize only after every\n  destination collection succeeds.\n- Retain incomplete backups for diagnosis, with sanitized failure metadata,\n  without allowing them to look restorable.\n\nUse ignored, origin-specific paths under the repository-root `db_backup/`\ndirectory:\n\n```text\ndb_backup/database_mirrors/local--\u003cDEVICE\u003e/roastlogger/\n  \u003cUTC timestamp\u003e__\u003crun-id\u003e/\ndb_backup/database_mirrors/online/roastlogger/\n  \u003cUTC timestamp\u003e__\u003crun-id\u003e/\n```\n\nThe completed manifest must include a schema version, Extended JSON mode, run\nID, backup reason, destination role and database name, initiating device, UTC\ntimestamps, completion status, collection entries with filenames/counts/bytes/\nchecksums, and aggregate collection/document counts. Backup payloads and\nmanifests must remain ignored and must never be staged or committed.\n\n### Append-Only Audit History\n\nDocument the audit contract at\n`docs/audit_history/database_mirrors/README.md` and write one atomic JSON record\nper applied attempt at:\n\n```text\ndocs/audit_history/database_mirrors/YYYY/MM/\n  YYYYMMDDTHHMMSSZ__\u003cDEVICE\u003e__\u003cdirection\u003e__\u003crun-id\u003e.json\n```\n\nEach record must include:\n\n- schema version, run ID, status, UTC start/end timestamps, and duration;\n- `DEVICE`, direction, sanitized source/destination descriptors, and database\n  names;\n- timestamp-aware mode, batch size, requested/resolved collections, and\n  preflight counts;\n- destination-backup path, manifest SHA-256, completion state, and counts;\n- per-collection added, updated, skipped, conflict, and post-run counts;\n- post-run verification and aggregate totals;\n- sanitized failure or cancellation details; and\n- the Git commit, branch, and dirty-worktree state of the code that performed\n  the operation.\n\nCreate an applied-attempt audit record for success, backup failure after the\nfirst confirmation, partial sync failure, and cancellation after backup. CLI\ndry runs and CLI cancellation before backup starts do not create an\napplied-attempt record.\n\nEvery Settings-modal sync direction button click is an explicit audit event,\neven though the button is non-mutating. Write a separate terminal UI-intent\nrecord containing `trigger: settings_ui`, `event: sync_button_clicked`, the\ndirection, `DEVICE`, run ID, UTC timestamp, sanitized endpoint/database\ndescriptors, Git provenance when available, and the preflight outcome. Record\nboth successful and failed preflight outcomes, including sanitized failures.\nDo not include raw session identifiers, IP addresses, credentials, MongoDB\nURIs, raw documents, tasting/roast content, or backup payloads.\n\nIf the tracked audit write fails after backup or database activity, write the\nsame sanitized record into the untracked backup directory, exit nonzero, and\nprint the recovery path prominently. The CLI must never stage, commit, or push;\nafter a tracked record is written it prints Git commands scoped to that one\nrecord.\n\nDo not fabricate historical audit records for existing UI syncs because their\ndevice, backup, confirmation, and timing evidence is unavailable.\n\n### Settings Modal And API Safety\n\nApplied sync is CLI-only in this ticket. Keep the Settings modal's two\ndirection buttons, but change them into audited, non-mutating preflight\nactions:\n\n1. A click requests a server-generated run ID and sanitized plan for the chosen\n   direction.\n2. The backend writes one `sync_button_clicked` UI-intent audit record with the\n   preflight outcome.\n3. The modal displays source/destination roles, collection counts, backup\n   scope, the required CLI command, and any sanitized preflight error.\n4. The click must not create a backup, prompt for apply confirmation, or write\n   to either database.\n\nDisable repeated clicks while the preflight request is active and restore both\nbutton states after completion. Display audit-record failure prominently; the\nUI must not report a fully recorded preflight when the record was not\npersisted.\n\nReplace or repurpose the existing mutating POST routes. Any route retained at\nthe old URLs must fail closed with migration guidance and perform no backup,\naudit, or database writes. A dedicated read-only preflight route may serve the\nnew button behavior.\n\nA future browser-applied workflow may be proposed separately, but it must use\nthe same complete-backup, two-confirmation, sync, redaction, and audit services.\nIt must not reintroduce a one-click sync or another shortcut around the guarded\nflow.\n\n### Environment Example\n\nUpdate `.env.example` with a required but intentionally blank device field and\na commented example:\n\n```dotenv\n# Required for applied database sync. Use a unique, stable value per machine.\n# Example: DEVICE=howie-macbook-air\nDEVICE=\n```\n\nThe blank default prevents cloned environments from silently sharing one\ndevice identity. Applied sync must reject the blank value.\n\n### Standard Agent Workflow For Database Work\n\nMake the guarded database workflow part of the repository's durable agent and\nticket policies. This policy applies when a ticket changes a MongoDB document\nshape, persistence behavior, database route/service, migration/backfill,\ndatabase configuration, or synchronization behavior.\n\nUpdate `AGENTS.md`, `CLAUDE.md`, the ticket-master skill and workflow, and the\nactive ticket template to require the following:\n\n1. A new or refined database-impacting ticket includes a\n   `## Database Operations Impact` section. It identifies affected\n   collections, local/online effects, migration or backfill needs, expected\n   sync direction, whether an applied mirror is part of delivery, and the\n   backup/audit evidence required for resolution. Use `None` only after focused\n   repository reads establish that no live database operation is needed.\n2. Before implementing database-impacting work, the agent reads\n   `docs/features/database-sync.md` and runs the guarded CLI in `--dry-run`\n   mode when configured endpoints are available. An unavailable endpoint is\n   reported as an environment limitation; it is a blocker only when the ticket\n   requires live-data evidence.\n3. Implementation and automated verification use mocks, fixtures, or an\n   isolated local database. An applied online/local mirror is never an implicit\n   test, startup step, cleanup step, or ordinary consequence of selecting a\n   database ticket.\n4. An applied mirror requires a separate, explicit user request after the\n   preflight plan is visible, followed by both run-specific confirmation\n   tokens. Agents must not infer approval, automate input, add a bypass, or\n   reuse consent from an earlier run.\n5. After an applied mirror, the operator reviews the result and manually\n   publishes only the generated audit record. Backup contents and manifests\n   stay under ignored `db_backup/` and are never staged.\n6. Before resolving a database-impacting ticket, record the dry-run result or\n   applied run ID/audit path in `## Resolution`, verify the required docs, and\n   confirm that `git ls-files db_backup 'db_backup/**'` returns no files.\n\nThe ticket-master skill remains planning and tracker maintenance only. It adds\nthe database-operations requirements to relevant records and verifies the\nrecorded evidence at resolution; it must not perform an applied database sync\nduring a ticketing turn.\n\nAdd `/db_backup/` to `.gitignore`. Verification must cover both\n`git check-ignore db_backup/...` and an empty tracked-file query so an existing\nfile cannot remain tracked merely because a later ignore rule was added.\n\n## Acceptance Criteria\n\n- [ ] `scripts/sync_database.py` supports both directions, repeatable\n  collection filters, a positive batch size, and dry-run mode.\n- [ ] Missing/blank/unsafe `DEVICE`, same endpoint/database identities, invalid\n  batch sizes, unavailable endpoints, and unknown requested collections fail\n  safely with credential-free messages.\n- [ ] Dry run checks connectivity and prints the complete plan without backup\n  writes, audit writes, prompts, or database writes.\n- [ ] Applied runs require exact `BACKUP \u003crun-id\u003e` and\n  `APPLY \u003cdirection\u003e \u003crun-id\u003e` tokens, with no bypass and no sync write before\n  both tokens.\n- [ ] Both directions preserve `RN-0015` timestamp-aware insert, update, skip,\n  conflict, timestamp, archived-source, and destination-only retention rules.\n- [ ] Resolved collections run sequentially and processing stops on the first\n  failure.\n- [ ] Every applied run backs up the complete destination database before the\n  second confirmation, regardless of collection filters.\n- [ ] Backups stream Extended JSON Lines, preserve tested BSON types, use\n  atomic partial/final paths, and include restorable manifests with counts,\n  byte sizes, and SHA-256 checksums.\n- [ ] Backup paths under `db_backup/database_mirrors/` distinguish\n  `local--\u003cDEVICE\u003e` from `online` and are never included in commits.\n- [ ] `.gitignore` contains a repository-root `/db_backup/` rule,\n  `git check-ignore` recognizes representative backup content, and\n  `git ls-files db_backup 'db_backup/**'` returns no tracked files.\n- [ ] Successful, backup-failed, partially failed, and\n  cancelled-after-backup applied attempts create one atomic, sanitized audit\n  JSON record; CLI dry runs and CLI pre-backup cancellations create no\n  applied-attempt record.\n- [ ] Every Settings sync-button click creates one atomic, sanitized\n  `sync_button_clicked` UI-intent audit record with trigger, direction, device,\n  run ID, time, Git provenance, and successful or failed preflight outcome.\n- [ ] Audit-write failure retains the same sanitized record inside the\n  untracked backup and exits with a visible recovery message.\n- [ ] The CLI never stages, commits, or pushes and prints publication commands\n  scoped to only the new audit record.\n- [ ] The Settings modal buttons run audited read-only preflight, show the\n  sanitized plan and CLI handoff, prevent overlapping clicks, and never create\n  a backup or database write.\n- [ ] Existing mutating sync routes cannot perform an unguarded database write;\n  any retained old route fails closed with CLI migration guidance.\n- [ ] `.env.example` includes the required blank `DEVICE` setting, explains\n  stable per-machine naming, and shows `howie-macbook-air` only as a comment.\n- [ ] `AGENTS.md` and `CLAUDE.md` define the standard database-ticket workflow:\n  read-only dry run by default, isolated automated tests, and separately\n  authorized applied mirrors with both run-specific confirmations.\n- [ ] `.claude/skills/ticket-master/SKILL.md`,\n  `.claude/skills/ticket-master/DOCUMENTATION_WORKFLOW.md`, and\n  `.agents/skills/ticket-master/SKILL.md` require database-impacting tickets to\n  record database operations, backup/audit evidence, and resolution\n  verification without performing application work during ticketing.\n- [ ] `docs/issues/templates/TICKET.md` contains a conditional\n  `## Database Operations Impact` prompt, and tracker tests protect the\n  database-workflow guidance and template contract.\n- [ ] Automated tests cover preflight validation, both directions, dry-run\n  side effects, both confirmations, timestamp-aware sync parity, complete\n  destination backups, BSON round trips, checksums, audit event policy,\n  redaction, one-record-per-button-click behavior, overlapping-click\n  prevention, UI/API fail-closed behavior, and partial failures.\n- [ ] Focused database-sync tests and `uv run pytest` pass without making an\n  applied live-database write.\n- [ ] A configured live check, if performed, is read-only via `--dry-run`; an\n  applied run requires a separate deliberate human operation.\n- [ ] Documentation Impact reviewed against the implementation diff; every affected document below is updated in this branch.\n\n## Documentation Impact\n\n- `README.md`\n- `docs/features/database-sync.md`\n- `docs/architecture/api-endpoints.md`\n- `docs/architecture/tech-stack.md`\n- `docs/deployment/README.md`\n- `tests/README.md`\n- `docs/audit_history/database_mirrors/README.md`\n- `docs/design/screens/settings.md`\n- `docs/design/README.md`\n- `docs/README.md`\n- `AGENTS.md`\n- `CLAUDE.md`\n- `.agents/skills/ticket-master/SKILL.md`\n- `.claude/skills/ticket-master/SKILL.md`\n- `.claude/skills/ticket-master/DOCUMENTATION_WORKFLOW.md`\n- `docs/issues/templates/TICKET.md`\n- Conditional: `docs/architecture/data-models.md` if implementation changes the\n  timestamp or document-shape contract instead of preserving `RN-0015`.\n\n## Open Questions\n\n- None. The proposed first implementation uses a guarded CLI for applied sync\n  and audited Settings buttons for read-only preflight. A browser-applied\n  workflow can be ticketed separately if command-line operation proves\n  inconvenient.\n\n## Related Files\n\n- `app.py`\n- `scripts/sync_database.py`\n- `.env.example`\n- `.gitignore`\n- `AGENTS.md`\n- `CLAUDE.md`\n- `.agents/skills/ticket-master/SKILL.md`\n- `.claude/skills/ticket-master/SKILL.md`\n- `.claude/skills/ticket-master/DOCUMENTATION_WORKFLOW.md`\n- `docs/issues/templates/TICKET.md`\n- `templates/base.html`\n- `static/css/components/modals.css`\n- `tests/test_ticket_system.py`\n- `tests/test_sync_api.py`\n- `tests/test_database_sync.py`\n- `tests/test_database_backup.py`\n- `tests/test_database_sync_cli.py`\n- `docs/audit_history/database_mirrors/README.md`\n- `docs/features/database-sync.md`\n- `docs/architecture/api-endpoints.md`\n- `docs/architecture/tech-stack.md`\n- `docs/deployment/README.md`\n- `docs/design/screens/settings.md`\n- `docs/design/README.md`\n- `README.md`\n\n## Related Records\n\n- `RN-0015` defines the timestamp-aware merge behavior that this ticket must\n  preserve.\n- `RN-0018` plans the broader application-module refactor. This ticket may\n  extract focused sync, backup, and audit services independently, but must not\n  broaden into the rest of that refactor.","parent":"","priority":"high","sourcePath":"pending/RN-0022-guarded-audited-database-sync.md","status":"pending","tags":[],"title":"Add Guarded, Audited Bidirectional Database Sync","type":"improvement","unlocksNow":[]}],"sourceDigest":"3de34d02e8d0","summary":{"activeTickets":3,"blockedTickets":1,"decisions":0,"readyDecisions":0,"tickets":22,"waitingDecisions":0}}</script>
