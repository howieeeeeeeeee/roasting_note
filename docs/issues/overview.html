nswer:\n- Does the bundle ship icons or illustrations? If yes, where should they live under `static/img/` and how should templates reference them? — answer:\n- Does the new system specify a CSS framework, utility library, or font CDN that introduces a new dependency? If yes, this ticket also updates `docs/architecture/tech-stack.md`. — answer:\n- Land as one large PR or split into foundations PR + per-screen PRs? Current direction is one merge per the user's \"rip and replace\" choice — confirm before opening the first PR. — answer:\n- Any rollout date or event tied to this work? — answer:\n\n## Related Files\n\n- `static/css/style.css`\n- `static/img/`\n- `templates/base.html`\n- `templates/index.html`\n- `templates/beans_list.html`\n- `templates/beans_detail.html`\n- `templates/beans_form.html`\n- `templates/roast_detail.html`\n- `templates/roast_edit.html`\n- `templates/roast_live.html`\n- `docs/design/README.md`\n- `docs/design/principles.md`\n- `docs/design/foundations/color.md`\n- `docs/design/foundations/typography.md`\n- `docs/design/foundations/spacing-layout.md`\n- `docs/design/foundations/dark-mode.md`\n- `docs/design/components/buttons.md`\n- `docs/design/components/cards-surfaces.md`\n- `docs/design/components/forms.md`\n- `docs/design/components/instrument-displays.md`\n- `docs/design/screens/bean-inventory.md`\n- `docs/design/screens/roast-detail.md`\n- `docs/design/screens/live-roasting.md`\n- `docs/design/screens/label-creator.md`\n- `docs/design/screens/sticker-sheet.md`\n- `docs/design/patterns/label-templates.md`\n- `docs/design/patterns/sticker-templates.md`","parent":"","priority":"high","sourcePath":"resolved/RN-0016-design-system-rollout.md","status":"resolved","tags":[],"title":"New Design System Rollout \u0026 Full UI Redesign","type":"feature","unlocksNow":[]},{"area":"live-roasting","blockedBy":[],"completed":"2026-05-02","created":"2026-05-02","decisions":[],"dependents":[],"downstream":[],"downstreamWork":0,"id":"RN-0017","kind":"ticket","markdown":"# Manually Set Draft Roast to Completed\n\n## Description\n\nUsers need a way to manually finish a draft roast from the live setup page without running the live roast timer. The app should introduce an explicit roast lifecycle status for new data, while preserving timestamp-derived fallback behaviour for older roasts.\n\n## Details\n\n- Add a draft-only manual action on `/roast/live/\u003croast_id\u003e` labeled **Set to Completed**.\n- Introduce a real roast lifecycle/status field for new and updated roasts:\n  - new roast creation sets the lifecycle to draft;\n  - starting a roast sets it to started;\n  - ending a roast sets it to completed;\n  - manually setting a draft to completed sets it to completed.\n- Preserve existing roasts by falling back to the current timestamp-derived lifecycle when the explicit status field is missing:\n  - `roast_end_time` present -\u003e completed;\n  - `roast_start_time` present and no `roast_end_time` -\u003e started/in progress;\n  - neither timestamp present -\u003e draft.\n- Manual completion is only for draft roasts. It should not be shown for active/started roasts or already completed roasts.\n- Manual completion should update lifecycle metadata without fabricating live roast data such as temperature curve points, sensor diagnostics, key timing events, or a Drop event.\n- The action should use confirmation copy that makes the lifecycle change clear before the user commits.\n- Completed-by-status roasts should appear as completed in dashboard and bean-history lifecycle badges/routes even when they do not have live-roast timing data.\n- Old data must remain readable without requiring a one-time migration.\n\n## Acceptance Criteria\n\n- [x] A draft roast on `/roast/live/\u003croast_id\u003e` exposes a clear **Set to Completed** action.\n- [x] Active/started roasts and already completed roasts do not expose the draft-only manual completion action.\n- [x] New roast creation writes an explicit draft lifecycle/status value.\n- [x] Starting a roast writes the started lifecycle/status value.\n- [x] Ending a roast writes the completed lifecycle/status value.\n- [x] Manually setting a draft to completed writes the completed lifecycle/status value and refreshes `updated_at`.\n- [x] Manual completion does not create temperature curve readings, sensor diagnostics, key timing events, or a Drop event by itself.\n- [x] Roasts missing the new lifecycle/status field still derive lifecycle from `roast_start_time` and `roast_end_time` exactly as they do today.\n- [x] Dashboard and bean-detail roast history use the explicit lifecycle/status first, with timestamp fallback for old roasts.\n- [x] Tests cover new roast status defaults, start/end status transitions, manual draft completion, active-roast rejection, completed-roast rejection, and old-roast fallback.\n- [x] Relevant docs updated when implemented: `docs/architecture/data-models.md`, `docs/architecture/api-endpoints.md`, `docs/features/live-roasting.md`, `docs/design/screens/live-roasting.md`.\n\n## Open Questions\n\n- Answered: stored lifecycle values are `draft`, `started`, and `completed`. The UI still labels `started` as **In Progress**.\n- Answered: manual draft completion leaves bean stock unchanged. Stock is deducted only by starting a live roast.\n- Answered: after manual completion succeeds, the user is redirected to the roast edit page for post-roast fields like roasted weight and notes.\n- Answered: manual completion does not require minimum draft fields beyond the roast existing and still being in draft lifecycle.\n\n## Implementation Notes\n\n- New roasts write `lifecycle_status: \"draft\"`.\n- `/api/roast/start/\u003croast_id\u003e` writes `lifecycle_status: \"started\"` and rejects non-draft roasts.\n- `/api/roast/end/\u003croast_id\u003e` writes `lifecycle_status: \"completed\"` and rejects non-started roasts.\n- `/api/roast/complete_draft/\u003croast_id\u003e` is draft-only and only updates `lifecycle_status` plus `updated_at`.\n- Dashboard and bean-history badges/routes use `lifecycle_status` first, with timestamp fallback for old documents.\n\n## Related Files\n\n- `app.py`\n- `templates/roast_live.html`\n- `templates/index.html`\n- `templates/beans_detail.html`\n- `tests/test_roasts_api.py`\n- `docs/architecture/data-models.md`\n- `docs/architecture/api-endpoints.md`\n- `docs/features/live-roasting.md`\n- `docs/design/screens/live-roasting.md`","parent":"","priority":"medium","sourcePath":"resolved/RN-0017-manual-draft-complete.md","status":"resolved","tags":[],"title":"Manually Set Draft Roast to Completed","type":"feature","unlocksNow":[]},{"area":"app-architecture","blockedBy":[],"completed":"","created":"2026-05-02","decisions":[],"dependents":[],"downstream":[],"downstreamWork":0,"id":"RN-0018","kind":"ticket","markdown":"\u003c!-- markdownlint-disable MD025 --\u003e\n\n# Refactor Flask App into Smaller Modules\n\n## Description\n\n`app.py` has grown into a large, mixed-responsibility Flask module, making it harder for future agents and maintainers to reason about changes safely. Split the backend into smaller modules while preserving the existing user-facing behaviour, API contracts, database schema, visual design, and dependency set.\n\n## Details\n\n- Keep `app.py` as the Flask entry point unless there is a compelling reason to change the deployment contract.\n- Split page routes and API routes into feature-focused modules or Flask blueprints.\n- Move database connection setup, database mode selection, and collection helpers out of the main application module.\n- Move roast lifecycle, live roast, temperature, and rate-of-rise helper logic into focused backend modules.\n- Move API serialization, request parsing, validation, and response helper logic out of route handlers where doing so makes the route behaviour easier to audit.\n- Preserve all existing endpoint URLs, HTTP methods, response shapes, template names, session semantics, and database reads/writes.\n- Do not introduce new dependencies, migrations, UI redesign, CSS changes, or user-facing behaviour changes as part of this refactor.\n- Prefer small, reviewable extraction steps with tests after each meaningful module boundary.\n\n## Acceptance Criteria\n\n- [ ] `app.py` is substantially shorter and primarily responsible for app creation, configuration, extension setup, and route/module registration.\n- [ ] Existing page routes and API endpoints continue to use the same URLs, HTTP methods, redirects, templates, status codes, and JSON response shapes.\n- [ ] Database selection, collection access, sync helpers, roast lifecycle helpers, temperature sensor helpers, and route handlers live in clearly named modules with minimal circular imports.\n- [ ] Existing API tests pass, with additional focused regression coverage added where extraction risk is high.\n- [ ] No database schema changes, new dependencies, visual changes, or user-facing behaviour changes are included.\n- [ ] Relevant docs updated when implemented: `docs/README.md`, `docs/architecture/README.md`, `docs/architecture/tech-stack.md`, and any feature docs that reference moved constants or helper locations such as `docs/features/live-roasting.md`.\n\n## Open Questions\n\n- What target module layout should the implementer use: feature blueprints, service modules grouped by domain, or a minimal first pass that only extracts database and helper code?\n- Should this be completed in one refactor ticket, or split into follow-up tickets after the first safe extraction proves the pattern?\n- Is there a desired maximum size for `app.py` after the refactor, or is \"small enough to navigate safely\" sufficient?\n\n## Related Files\n\n- `app.py`\n- `tests/test_beans_api.py`\n- `tests/test_roasts_api.py`\n- `tests/test_temperature_api.py`\n- `tests/test_sync_api.py`\n- `tests/test_reviews_api.py`\n- `docs/README.md`\n- `docs/architecture/README.md`\n- `docs/architecture/tech-stack.md`\n- `docs/features/live-roasting.md`","parent":"","priority":"high","sourcePath":"pending/RN-0018-refactor-app-py.md","status":"pending","tags":[],"title":"Refactor Flask App into Smaller Modules","type":"refactor","unlocksNow":[]},{"area":"live-roasting","blockedBy":[],"completed":"2026-05-03","created":"2026-05-02","decisions":[],"dependents":[],"downstream":[],"downstreamWork":0,"id":"RN-0019","kind":"ticket","markdown":"# Show Roast Times in Operator Timezone (Not Raw UTC Clock)\n\n## Description\n\nOperators in US Eastern Time see roast timestamps on the roasts index and roast detail screens that read like “2026-05-03 00:40” after an evening roast on May 2, which feels like incorrect data collection even when the underlying instants match reality.\n\n## Details\n\n### Diagnosis (2026-05-02, local `roastlogger` DB sample)\n\nRecent completed roasts (e.g. Kenya, Bishan, Watermelon, Passionfruit, Gucci Washed Dark) have `roast_start_time` values such as:\n\n- `2026-05-02 23:57:30` (Kenya — first roast of the evening)\n- `2026-05-03 00:09–00:41` for subsequent roasts on the same session\n\nAgainst these rows in MongoDB, values are **`datetime` with `tzinfo None`** (PyMongo default for BSON `Date` — stored as milliseconds since Unix epoch in **UTC**).\n\nInterpreting those naïve datetimes as **UTC** and converting to **`America/New_York` (EDT, UTC−4)** yields wall times on **May 2 between ~7:57 PM and ~8:41 PM**, which matches “May 2 ~8 PM East Coast roast night.” So **collection/storage of the instant is consistent with correct behaviour**; the bug is primarily **presentation**.\n\n### Root cause\n\n- `POST /api/roast/start/` sets `roast_start_time` via `get_current_time_with_tz()` (`datetime.now(local_tz)` with `TIMEZONE` default `America/New_York`). PyMongo persists that instant in BSON as UTC.\n- On read, datetimes typically come back as **naïve UTC**.\n- `@app.template_filter(\"format_date\")` documents itself as *“no timezone conversion - shows DB value as-is”* and formats with `%Y-%m-%d %H:%M`. That prints the **UTC clock face**, not the operator-local wall time.\n\nSame filter is used for `roast_date`, `roast_end_time`, reviews, etc., so anywhere it is used without conversion may feel “off” relative to Eastern (or whichever `TIMEZONE` the server is configured for).\n\n### Out of scope (unless product decides otherwise)\n\n- Changing how durations or `elapsed_seconds` are computed (those are deltas; unaffected if start/end share the same representation).\n- Forcing browsers to infer tz from JS without a server-side convention — prefer aligning display with **`TIMEZONE` env / operator expectation** documented in deployment.\n\n### Optional data repair\n\n**Do not blindly subtract hours in Mongo.** For the sampled May 2026 session above, timestamps are correct instants; “fixing” them would corrupt data.\n\nIf historical audit finds documents that were mistakenly written as *local-clock naïve* treated as UTC, remediation would need a **per-document heuristic** — out of scope here unless surfaced by a dedicated audit ticket.\n\n### Verification snippet (read-only — run against a backup or local DB)\n\nUse this to confirm a naïve `roast_start_time` matches Eastern wall time:\n\n```python\n\"\"\"Read-only check: naive Mongo datetimes ↔ Eastern wall clock.\"\"\"\n\nfrom pymongo import MongoClient\nfrom datetime import datetime, timezone\n\nimport pytz\n\nEASTERN = pytz.timezone(\"America/New_York\")\nuri = \"mongodb://localhost:27017/\"\ncol = MongoClient(uri).roastlogger.roasts\n\nfor r in col.find(\n    {\"title\": {\"$in\": [\"Kenya\", \"Gucci Washed Dark\"]}},\n    {\"title\": 1, \"roast_start_time\": 1},\n):\n    naive = r.get(\"roast_start_time\")\n    if naive is None:\n        continue\n    # BSON instant is UTC; naive from PyMongo → interpret as UTC\n    utc_dt = naive.replace(tzinfo=timezone.utc)\n    eastern = utc_dt.astimezone(EASTERN)\n    print(r[\"title\"], \"stored naive:\", naive, \"| Eastern:\", eastern.strftime(\"%Y-%m-%d %H:%M %Z\"))\n```\n\nExpected pattern for correct data: Eastern date stays on May 2 for an ~8 PM session.\n\n### If migration is ever warranted (only after audit — not recommended for reported case)\n\nA future implementer could use the same UTC→`TIMEZONE.astimezone` rule to detect outliers; **any** `$set` of `roast_start_time` / `roast_end_time` should preserve the intended instant (epoch milliseconds), never “shift the clock” without proving the stored epoch is wrong.\n\n## Acceptance Criteria\n\n- [x] Roast list “Date” column shows **wall time in the configured operator timezone** (same semantics as `TIMEZONE` / product decision), not raw UTC digits, OR the UI explicitly labels “UTC” if product chooses UTC display.\n- [x] Roast detail start/end times (and related date fields using the same filter) behave consistently with the chosen rule.\n- [x] Naïve datetimes loaded from Mongo are interpreted consistently (**document** whether they are treated as UTC, matching PyMongo BSON contract).\n- [x] No regression on duration/elapsed computations.\n- [x] Relevant docs updated when implemented: `docs/features/live-roasting.md`, `docs/architecture/data-models.md` (timestamp / display note under Timestamp Policy), and any affected `docs/design/` screen doc for the roast list / detail screens.\n\n## Open Questions\n\n- Should the app always use **`TIMEZONE` env** for display, or should per-user timezone (browser or profile) be supported later? (Default MVP: honour `TIMEZONE` consistently.)\n\n## Related Files\n\n- `app.py`\n- `templates/index.html`\n- `templates/roast_detail.html`\n- `templates/beans_detail.html`\n- `.env.example` (document `TIMEZONE` for deployed vs local parity)","parent":"","priority":"medium","sourcePath":"resolved/RN-0019-roast-datetime-local-display.md","status":"resolved","tags":[],"title":"Show Roast Times in Operator Timezone (Not Raw UTC Clock)","type":"bug","unlocksNow":[]},{"area":"label-creator","blockedBy":[],"completed":"2026-05-04","created":"2026-05-04","decisions":[],"dependents":[],"downstream":[],"downstreamWork":0,"id":"RN-0020","kind":"ticket","markdown":"# Sticker modal image list — remove unused scrollbar and dead space\n\n## Description\n\nIn the **Create Stickers** modal on the beans list, the left column’s image list shows a vertical scrollbar and leaves noticeable empty space below the rows even when all four US-4 sticker rows are visible and nothing overflows. The layout should grow only as tall as the content when it fits, and show scrolling only when the list actually exceeds the available space.\n\n## Details\n\n- **Where:** Beans list → **Create Stickers** → modal; left column under **Select Images**, when four images are listed (e.g. US-4, 4 / 4 images).\n- **Current behaviour:** A scrollbar appears on the image list while extra whitespace sits below the last row — the list region reads as shorter than it needs to be for the content, or the scroll container is taller than the content without needing to scroll.\n- **Desired behaviour:** When every row fits without overflow, there is no scrollbar track and no large unused gap under the last row. When the user adds enough rows or uses a shorter viewport so content cannot fit, scrolling appears as needed (keyboard / touch still work).\n- **Out of scope:** Changing sticker PDF layout, template math, or preview panel behaviour; this ticket is only the left-column list chrome and spacing.\n\n## Acceptance Criteria\n\n- [x] With US-4 and four image rows on a typical desktop viewport, the image list does not show an unnecessary vertical scrollbar.\n- [x] Dead space below the last image row is reduced so the list area does not look like a tall empty box when content fits.\n- [x] If future templates allow more rows or the viewport is short, overflow still scrolls correctly and remains accessible.\n- [x] Relevant docs updated when implemented: `docs/design/screens/sticker-sheet.md`, and `docs/features/sticker-sheet.md` only if layout/behaviour notes need to mention the list region.\n\n## Open Questions\n\n- Should the list use a **minimum** height when there are zero or one rows so the column does not jump wildly, or is strictly content-sized height preferred for all counts?\n\n## Resolution\n\nRaised the image list `max-height` clamp (was capped at 240px, which was shorter than four sticker rows plus gaps, causing an unnecessary scrollbar). Set `.sticker-sheet-controls { height: fit-content }` so the left column does not inherit excess vertical space. Updated `docs/design/screens/sticker-sheet.md`.\n\n## Related Files\n\n- `templates/beans_list.html`\n- `static/css/screens/sticker-sheet.css`\n- `static/js/sticker-sheet.js`","parent":"","priority":"low","sourcePath":"resolved/RN-0020-sticker-modal-image-list-layout.md","status":"resolved","tags":[],"title":"Sticker modal image list — remove unused scrollbar and dead space","type":"bug","unlocksNow":[]},{"area":"label-creator","blockedBy":[],"completed":"2026-05-05","created":"2026-05-05","decisions":[],"dependents":[],"downstream":[],"downstreamWork":0,"id":"RN-0021","kind":"ticket","markdown":"# Label PNG Export Prints With Incorrect Colors\n\n## Description\n\nThe bean label creator preview appears to show the expected colors on screen, but the downloaded PNG can print with noticeably different colors. This makes the printable label output unreliable even when the in-browser design looks correct.\n\n## Details\n\n- Trigger: open a bean detail page, use **Create Label**, download the PNG export, then print the downloaded label.\n- Reported current behavior: the modal preview colors look right, but printed output colors are \"way off.\"\n- The downloaded PNG looks correct when opened before printing, so the first confirmed failure point is the print path rather than the canvas preview or saved PNG appearance.\n- Confirmed print path: macOS Preview print.\n- Observed print failure: output is too light, and black/dark areas do not print as true black.\n- Printer and paper variability is unknown because this has not been tested on another printer or paper stock yet.\n- Desired behavior: the downloaded PNG should print materially closer to the on-screen preview for the same template, accent color, image, and export size.\n- Initial code read: `static/js/label-creator.js` paints directly to canvas with CSS hex and `rgba(...)` values; no obvious template-level color conversion is happening before export.\n- Initial code read: `templates/beans_detail.html` exports via `canvas.toBlob(..., 'image/png')`, then injects a `pHYs` chunk to preserve the selected physical print size.\n- Investigation should check whether the exported PNG lacks explicit color-profile metadata, such as `sRGB`, `gAMA`, `cHRM`, or ICC profile data, causing print apps or printer drivers to interpret colors differently.\n- Investigation should also check whether browser-generated PNG metadata already contains a `pHYs` chunk before injection. If so, the current injection path may create duplicate physical-size metadata.\n- Preserve the exact physical-size behavior of the PNG export. The fix should not regress the current ability to insert a 12.7 x 10.16 cm label at the intended size.\n- Include both standard and rotated 90 degree PNG exports in the investigation, since both use the same canvas export path.\n- Recommended plan:\n  1. Export a failing label PNG and inspect its chunks with a metadata tool to confirm `pHYs`, `sRGB`, `gAMA`, `cHRM`, and ICC/profile state.\n  2. Create a controlled test label with black, near-black, white, mid-gray, and the selected accent color so print output can be compared without photo/image noise.\n  3. Print the same PNG through macOS Preview and one alternate path, such as browser print, Pages, or PDF conversion, to isolate Preview-specific color handling.\n  4. If metadata is ambiguous, update PNG export to write a predictable profile/signaling strategy while preserving the existing `pHYs` physical-size chunk.\n  5. If metadata is correct but macOS Preview still prints too light, document a recommended print workflow or add an app-side \"print test / export for print\" path with stronger dark values.\n\n## Acceptance Criteria\n\n- [ ] Reproduce and document at least one concrete color-shift case, including template, accent color, optional image, print app, printer, and paper type when available.\n- [ ] Confirm whether the issue is specific to macOS Preview print by testing one alternate print path.\n- [ ] Add or manually use a controlled test label containing black, near-black, white, mid-gray, and the selected accent color.\n- [ ] Inspect the exported PNG metadata and document whether it contains duplicate `pHYs` chunks or missing / ambiguous color-profile chunks.\n- [ ] Identify whether the color shift happens in print preview, only on physical print, or both.\n- [ ] Implement a fix or explicit product guidance that makes label PNG print color predictable enough for normal use.\n- [ ] Verify standard PNG and rotated PNG exports after the change.\n- [ ] Verify the exported PNG still opens or inserts at the selected physical size.\n- [ ] Relevant docs updated when implemented: `docs/features/bean-label-creator.md`, `docs/design/patterns/label-templates.md`, `docs/design/screens/label-creator.md`.\n\n## Open Questions\n\n- Which template, accent color, image, and font preset produced the bad print?\n- Does macOS Preview's print preview already look too light, or does it only become too light on physical paper?\n- Does the same PNG print closer to expected colors from browser print, Pages, Word, or PDF conversion?\n\n## Related Files\n\n- `static/js/label-creator.js`\n- `templates/beans_detail.html`\n- `docs/features/bean-label-creator.md`\n- `docs/design/patterns/label-templates.md`\n- `docs/design/screens/label-creator.md`\n\n## Resolution\n\nClosed without product changes. The print color issue was caused by the printer running low on ink, not by the label canvas renderer, PNG export path, or macOS Preview print handling.","parent":"","priority":"medium","sourcePath":"wont_fix/RN-0021-label-png-print-color-shift.md","status":"wont_fix","tags":[],"title":"Label PNG Export Prints With Incorrect Colors","type":"bug","unlocksNow":[]}],"sourceDigest":"a426016d7113","summary":{"activeTickets":2,"blockedTickets":0,"decisions":0,"readyDecisions":0,"tickets":21}};
    const byId = new Map(data.records.map(record => [record.id, record]));

    const priorityOrder = new Map(data.project.priorities.map((value, index) => [value, index]));

      .replaceAll("'", "&#039;");

    const sortRecords = records => [...records].sort((left, right) =>

    function renderNext() {

          <button class="dependency-title" type="button" data-record="${escapeHtml(record.id)}"><span class="record-id">${escapeHtml(record.id)}</span><br><strong>${escapeHtml(record.title)}</strong></button>
          <div><span class="meta">Needs</span>${chips(record.blockedBy)}</div>
          <div><span class="meta">Directly blocks</span>${chips(record.dependents)}</div>
        </div>`).join("") : `<div class="empty">No dependency relationships match.</div>`}</section>`;
    }

    function render() {
      document.querySelectorAll("[data-view]").forEach(button => {
        button.setAttribute("aria-pressed", String(button.dataset.view === state.view));
      });
      ({ next: renderNext, board: renderBoard, directory: renderDirectory, dependencies: renderDependencies })[state.view]();
    }

    function openDetail(recordId) {
      const record = byId.get(recordId);
      if (!record) return;
      const epic = record.parent ? byId.get(record.parent) : null;
      detail.innerHTML = `<button class="detail-close" type="button" aria-label="Close details">Close</button>
        <span class="record-id">${escapeHtml(record.id)} · ${escapeHtml(label(record.type))}</span>
        <h2>${escapeHtml(record.title)}</h2>
        <span class="status ${tone(record)}">${escapeHtml(label(displayStatus(record)))}</span>
        <div class="detail-meta">
          <div class="meta-box"><span>Status</span><br>${escapeHtml(label(record.status))}</div>
          <div class="meta-box"><span>Priority</span><br>${escapeHtml(label(record.priority || "—"))}</div>
          <div class="meta-box"><span>Area</span><br>${escapeHtml(record.area)}</div>
          <div class="meta-box"><span>Epic</span><br>${epic ? escapeHtml(epic.id) : "Standalone"}</div>
        </div>
        ${record.blockedBy.length ? `<div><strong>Blocked by</strong>${chips(record.blockedBy)}</div>` : ""}
        ${record.dependents.length ? `<div><strong>Direct dependents</strong>${chips(record.dependents)}</div>` : ""}
        <div class="record-body"><pre>${escapeHtml(record.markdown)}</pre></div>
        <a class="source-link" href="${encodeURI(record.sourcePath)}">Open Markdown source</a>`;
      document.body.classList.add("detail-open");
      detail.scrollTop = 0;
    }
    function closeDetail() {
      document.body.classList.remove("detail-open");
      detail.innerHTML = "";
    }
    function fillSelect(selector, values, allLabel) {
      document.querySelector(selector).innerHTML = `<option value="all">${escapeHtml(allLabel)}</option>`
        + values.map(value => `<option value="${escapeHtml(value)}">${escapeHtml(label(value))}</option>`).join("");
    }

    document.querySelector("#summary").innerHTML = [
      [data.summary.activeTickets, "Active tickets"],
      [data.summary.blockedTickets, "Blocked"],
      [data.summary.readyDecisions, "Ready decisions"],
      [data.summary.tickets + data.summary.decisions, "All records"]
    ].map(([value, name]) => `<div class="metric"><strong>${value}</strong><span>${name}</span></div>`).join("");
    fillSelect("#status-filter", ["ready", "in_progress", "blocked", "resolved", "wont_fix", "waiting", "finalized"], "All statuses");
    fillSelect("#area-filter", [...new Set(data.records.map(record => record.area))].sort(), "All areas");
    fillSelect("#priority-filter", data.project.priorities, "All priorities");

    document.addEventListener("click", event => {
      const viewButton = event.target.closest("[data-view]");
      if (viewButton) {
        state.view = viewButton.dataset.view;
        render();
        return;
      }
      const recordButton = event.target.closest("[data-record]");
      if (recordButton) {
        openDetail(recordButton.dataset.record);
        return;
      }
      if (event.target.closest(".detail-close")) closeDetail();
    });
    document.querySelector("#search").addEventListener("input", event => {
      state.query = event.target.value.trim().toLowerCase();
      render();
    });
    [["#status-filter", "status"], ["#area-filter", "area"], ["#priority-filter", "priority"]].forEach(([selector, key]) => {
      document.querySelector(selector).addEventListener("change", event => {
        state[key] = event.target.value;
        render();
      });
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeDetail();
    });

    const root = document.documentElement;
    const storedTheme = localStorage.getItem("roastlogger-ticket-theme");
    if (storedTheme) root.dataset.theme = storedTheme;
    document.querySelector("#theme-toggle").addEventListener("click", () => {
      const next = root.dataset.theme === "dark" ? "light" : "dark";
      root.dataset.theme = next;
      localStorage.setItem("roastlogger-ticket-theme", next);
    });
    render();
  </script>
</body>
</html>
