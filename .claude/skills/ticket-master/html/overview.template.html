<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>__PROJECT_NAME__ · Tickets</title>
  <style>
    @font-face {
      font-family: "Courier Prime";
      src: url(data:font/ttf;base64,__COURIER_PRIME_REGULAR__) format("truetype");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }
    @font-face {
      font-family: "Courier Prime";
      src: url(data:font/ttf;base64,__COURIER_PRIME_BOLD__) format("truetype");
      font-style: normal;
      font-weight: 700;
      font-display: swap;
    }
    :root {
      --paper: #eef1ec;
      --paper-raised: #f8faf6;
      --ink: #1e2522;
      --muted: #606a64;
      --rule: #bfc8c0;
      --rule-strong: #8f9b92;
      --progress: #2d6676;
      --ready: #3e704d;
      --decision: #b86822;
      --blocked: #a64b42;
      --focus: #175fbb;
      --radius-card: 16px;
      --radius-control: 12px;
      --radius-pill: 999px;
      --detail-width: clamp(460px, 42vw, 680px);
      --page-gutter: 48px;
    }
    :root[data-theme="dark"] {
      --paper: #191d1a;
      --paper-raised: #232824;
      --ink: #f2f2eb;
      --muted: #bdc1ba;
      --rule: #4c514c;
      --rule-strong: #7c827b;
      --progress: #d7ddd6;
      --ready: #d1dbcf;
      --decision: #e6ddcd;
      --blocked: #d6aaa4;
      --focus: #f4f2e8;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) {
        --paper: #191d1a;
        --paper-raised: #232824;
        --ink: #f2f2eb;
        --muted: #bdc1ba;
        --rule: #4c514c;
        --rule-strong: #7c827b;
        --progress: #d7ddd6;
        --ready: #d1dbcf;
        --decision: #e6ddcd;
        --blocked: #d6aaa4;
        --focus: #f4f2e8;
      }
    }
    * { box-sizing: border-box; }
    html { background: var(--paper); color: var(--ink); }
    body {
      margin: 0;
      min-width: 320px;
      font-family: "Courier Prime", "American Typewriter", "Courier New", monospace;
      font-size: 16px;
      line-height: 1.45;
      background: var(--paper);
    }
    button, input, select { font: inherit; color: inherit; }
    button, select { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible, summary:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
    }
    a { color: var(--progress); text-underline-offset: 3px; }
    .shell { width: min(1440px, calc(100% - 96px)); margin: 0 auto; }
    .masthead {
      padding: 42px 0 26px;
      border-bottom: 1px solid var(--rule);
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 24px;
      align-items: end;
    }
    .eyebrow, .label, .record-id, .meta, .stamp-label {
      text-transform: uppercase;
      letter-spacing: .08em;
      font-size: .76rem;
      font-weight: 700;
    }
    .eyebrow { color: var(--decision); margin: 0 0 4px; }
    h1 { margin: 0; font-size: clamp(1.55rem, 3vw, 2.8rem); line-height: 1.04; letter-spacing: -.04em; }
    .masthead p { color: var(--muted); margin: 8px 0 0; max-width: 70ch; }
    .mast-tools { display: flex; gap: 8px; align-items: center; }
    .tool-button, .nav-button, .chip, .record-link {
      border: 1px solid var(--rule-strong);
      background: var(--paper-raised);
      border-radius: var(--radius-pill);
    }
    .tool-button { padding: 10px 15px; white-space: nowrap; }
    .theme-toggle {
      display: inline-grid;
      place-items: center;
      width: 42px;
      height: 42px;
      padding: 0;
      line-height: 0;
    }
    .theme-toggle svg { display: block; width: 18px; height: 18px; }
    .nav-wrap {
      position: sticky;
      top: 0;
      z-index: 20;
      background: color-mix(in srgb, var(--paper) 93%, transparent);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--rule);
    }
    .nav-row { display: flex; gap: 6px; overflow-x: auto; padding: 12px 0; }
    .nav-button {
      padding: 9px 15px;
      border-color: transparent;
      background: transparent;
      white-space: nowrap;
      color: var(--muted);
    }
    .nav-button[aria-current="page"] {
      color: var(--ink);
      border-color: var(--progress);
      background: color-mix(in srgb, var(--progress) 11%, var(--paper-raised));
    }
    main {
      padding: 40px 0 96px;
      container-name: workbench;
      container-type: inline-size;
    }
    .view-heading {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: start;
      margin-bottom: 34px;
    }
    .view-heading h2, .section-heading h3 { margin: 0; line-height: 1.1; }
    .view-heading p, .section-heading p { margin: 6px 0 0; color: var(--muted); max-width: 74ch; }
    .snapshot { color: var(--muted); font-size: .78rem; white-space: nowrap; }
    .section { margin-top: 46px; }
    .section-heading {
      border-bottom: 1px solid var(--rule);
      padding: 0 4px 14px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: end;
    }
    .count { color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 20px; }
    .standalone-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 30px 24px;
    }
    .record-card {
      position: relative;
      border: 1px solid var(--rule);
      border-radius: var(--radius-card);
      background: var(--paper-raised);
      padding: 22px;
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    .card-top { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
    .card-key { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; min-width: 0; }
    .record-id { color: var(--muted); }
    .status {
      padding: 3px 8px;
      border: 1px solid currentColor;
      border-radius: var(--radius-pill);
      font-size: .7rem;
      text-transform: uppercase;
      letter-spacing: .06em;
      white-space: nowrap;
    }
    .status.decision { color: var(--decision); }
    .status.progress {
      color: var(--paper-raised);
      border-color: var(--progress);
      background: var(--progress);
    }
    .status.progress::before { content: "●"; margin-right: 5px; font-size: .56rem; }
    .status.ready { color: var(--ready); }
    .status.resolved {
      color: var(--ready);
      background: color-mix(in srgb, var(--ready) 10%, transparent);
    }
    .status.resolved::before { content: "✓"; margin-right: 4px; }
    .status.blocked, .status.waiting { color: var(--blocked); }
    .record-title {
      appearance: none;
      display: block;
      border: 0;
      background: transparent;
      padding: 0;
      margin: 14px 0 10px;
      text-align: left;
      font-weight: 700;
      font-size: 1.04rem;
      line-height: 1.25;
      width: 100%;
    }
    .record-title:hover { color: var(--progress); text-decoration: underline; text-underline-offset: 3px; }
    .meta { color: var(--muted); line-height: 1.6; overflow-wrap: anywhere; }
    .epic-tag {
      display: inline-flex;
      align-items: center;
      color: var(--progress);
      border: 1px solid color-mix(in srgb, var(--progress) 55%, var(--rule));
      border-radius: var(--radius-pill);
      background: color-mix(in srgb, var(--progress) 7%, var(--paper-raised));
      padding: 3px 8px;
      font-size: .68rem;
      font-weight: 700;
      letter-spacing: .04em;
      white-space: nowrap;
    }
    .epic-tag:hover { border-color: var(--progress); background: color-mix(in srgb, var(--progress) 13%, var(--paper-raised)); }
    .card-blockers { margin-top: 15px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .chip {
      display: inline-flex;
      padding: 5px 9px;
      font-size: .72rem;
      text-decoration: none;
      color: var(--muted);
    }
    button.chip:hover { color: var(--ink); border-color: var(--ink); }
    .impact-wrap { margin-top: auto; padding-top: 18px; }
    .impact-stamp {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border: 1px solid color-mix(in srgb, var(--decision) 55%, var(--rule));
      border-radius: var(--radius-control);
      background: color-mix(in srgb, var(--decision) 7%, var(--paper-raised));
      color: var(--decision);
      margin-top: 0;
      overflow: hidden;
    }
    .stamp-cell { padding: 10px 12px; text-align: center; }
    .stamp-cell + .stamp-cell { border-left: 1px solid color-mix(in srgb, var(--decision) 35%, var(--rule)); }
    .stamp-value { display: block; font-weight: 700; font-size: 1.2rem; line-height: 1; }
    .stamp-label { display: block; margin-top: 3px; font-size: .62rem; }
    .empty {
      border: 1px dashed var(--rule-strong);
      border-radius: var(--radius-card);
      padding: 24px;
      color: var(--muted);
      background: color-mix(in srgb, var(--paper-raised) 55%, transparent);
    }
    .filter-bar {
      display: grid;
      grid-template-columns: minmax(220px, 2fr) repeat(5, minmax(130px, 1fr));
      gap: 12px;
      margin-bottom: 28px;
    }
    .filter-bar input, .filter-bar select, .focus-select {
      width: 100%;
      border: 1px solid var(--rule-strong);
      background: var(--paper-raised);
      padding: 11px 13px;
      border-radius: var(--radius-control);
    }
    .directory-status-box {
      grid-column: 1 / -1;
      display: flex;
      flex-wrap: wrap;
      gap: 7px 16px;
      align-items: center;
      margin: 0;
      border: 1px solid var(--rule-strong);
      border-radius: var(--radius-control);
      background: var(--paper-raised);
      padding: 9px 13px;
    }
    .directory-status-option { display: inline-flex; gap: 7px; align-items: center; white-space: nowrap; }
    .filter-bar .directory-status-option input { width: auto; margin: 0; border: 0; border-radius: 0; background: transparent; padding: 0; accent-color: var(--progress); }
    .board {
      display: grid;
      grid-template-columns: repeat(4, minmax(280px, 1fr));
      gap: 18px;
      overflow-x: auto;
      padding-bottom: 10px;
    }
    .board-column {
      min-width: 280px;
      border: 1px solid var(--rule);
      border-radius: 18px;
      background: color-mix(in srgb, var(--paper-raised) 58%, transparent);
      padding: 14px;
    }
    .column-heading {
      display: flex;
      justify-content: space-between;
      padding: 3px 4px 15px;
      font-weight: 700;
    }
    .column-stack { display: grid; gap: 14px; }
    .epic-strip { display: flex; gap: 12px; overflow-x: auto; padding: 0 0 20px; margin-bottom: 22px; }
    .epic-button {
      flex: 0 0 min(360px, 80vw);
      border: 1px solid var(--rule-strong);
      background: var(--paper-raised);
      border-radius: var(--radius-card);
      text-align: left;
      padding: 16px;
    }
    .epic-button[aria-pressed="true"] {
      border-color: var(--progress);
      background: color-mix(in srgb, var(--progress) 9%, var(--paper-raised));
    }
    .progress-line { display: flex; gap: 3px; margin-top: 12px; height: 6px; }
    .progress-line span { flex: 1; background: var(--rule); border-radius: var(--radius-pill); }
    .progress-line .resolved { background: var(--ready); }
    .progress-line .in_progress { background: var(--progress); }
    .progress-line .blocked { background: var(--blocked); }
    .progress-line .pending { background: var(--decision); }
    .directory { display: grid; gap: 30px; }
    .directory-controls {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 240px);
      justify-content: end;
      gap: 12px;
      margin: 0 0 28px;
    }
    .directory-group-box {
      display: flex;
      flex-wrap: wrap;
      gap: 7px 14px;
      align-items: center;
      min-width: 0;
      margin: 0;
      border: 1px solid var(--rule-strong);
      border-radius: var(--radius-control);
      background: var(--paper-raised);
      padding: 8px 12px;
    }
    .directory-group-option { display: inline-flex; gap: 7px; align-items: center; white-space: nowrap; }
    .directory-group-option input { margin: 0; accent-color: var(--progress); }
    .directory-section + .directory-section { margin-top: 56px; }
    .directory-section > .section-heading { margin-bottom: 28px; }
    .epic-group { border: 1px solid var(--rule); border-radius: 18px; background: var(--paper-raised); overflow: hidden; }
    .epic-group + .epic-group { margin-top: 24px; }
    .epic-group > summary { list-style: none; padding: 24px; cursor: pointer; }
    .epic-group > summary::-webkit-details-marker { display: none; }
    .epic-summary { display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; }
    .epic-summary strong::before { content: "▸ "; color: var(--progress); }
    .epic-group[open] .epic-summary strong::before { content: "▾ "; }
    .epic-children { display: grid; gap: 18px; padding: 26px 24px 30px 42px; border-top: 1px solid var(--rule); }
    .dependency-stage {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 60px minmax(0, 1.15fr) 60px minmax(0, 1fr);
      align-items: start;
      gap: 16px;
      margin-top: 30px;
    }
    .dependency-column h3 { font-size: .82rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
    .dependency-stack { display: grid; gap: 14px; }
    .dependency-summary { margin: 10px 0 0; color: var(--muted); font-size: .84rem; }
    .flow-arrow { align-self: center; color: var(--rule-strong); font-size: 2rem; text-align: center; }
    .focus-card { outline: 2px solid var(--progress); outline-offset: 4px; }
    .provenance { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--rule); }
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      z-index: 49;
      background: rgba(0, 0, 0, .35);
      opacity: 0;
      pointer-events: none;
      transition: opacity .16s ease;
    }
    .drawer-backdrop.open { opacity: 1; pointer-events: auto; }
    .drawer {
      position: fixed;
      inset: 0 0 0 auto;
      z-index: 50;
      width: min(720px, 92vw);
      transform: translateX(102%);
      transition: transform .2s ease;
      background: var(--paper-raised);
      border-left: 1px solid var(--rule-strong);
      border-radius: 0;
      overflow-y: auto;
    }
    .drawer.open { transform: translateX(0); }
    .drawer-header { position: sticky; top: 0; z-index: 2; background: var(--paper-raised); border-bottom: 1px solid var(--rule); padding: 18px 24px; display: flex; justify-content: space-between; gap: 12px; }
    .drawer-body { padding: 30px clamp(22px, 5vw, 58px) 72px; }
    .drawer h2 { margin: 8px 0 14px; font-size: clamp(1.35rem, 3vw, 2rem); line-height: 1.15; }
    .drawer-meta { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 26px; }
    .meta-box { border: 1px solid var(--rule); border-radius: var(--radius-control); padding: 12px; min-width: 0; overflow-wrap: anywhere; }
    .markdown { border-top: 1px solid var(--rule); padding-top: 24px; overflow-wrap: anywhere; }
    .markdown h1 { display: none; }
    .markdown h2 { margin-top: 2rem; font-size: 1.25rem; }
    .markdown h3 { margin-top: 1.5rem; font-size: 1.08rem; }
    .markdown table { display: block; width: 100%; overflow-x: auto; border-collapse: collapse; font-size: .86rem; }
    .markdown th, .markdown td { border: 1px solid var(--rule); padding: 6px 8px; text-align: left; vertical-align: top; }
    .markdown th { background: color-mix(in srgb, var(--rule) 28%, transparent); }
    .markdown pre { overflow-x: auto; border: 1px solid var(--rule); border-radius: var(--radius-control); padding: 14px; background: var(--paper); }
    .markdown code { background: color-mix(in srgb, var(--rule) 28%, transparent); border-radius: 4px; padding: 1px 3px; }
    .markdown pre code { background: transparent; padding: 0; }
    .close-button { display: inline-grid; place-items: center; border: 1px solid var(--rule-strong); border-radius: var(--radius-pill); background: transparent; width: 38px; height: 38px; padding: 0; line-height: 0; }
    .close-button svg { display: block; width: 16px; height: 16px; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); border: 0; }
    @media (min-width: 1100px) {
      body.detail-open .shell {
        width: auto;
        max-width: 1440px;
        margin-left: var(--page-gutter);
        margin-right: calc(var(--detail-width) + var(--page-gutter));
      }
      body.detail-open .masthead {
        grid-template-columns: minmax(0, 1fr);
        align-items: start;
      }
      body.detail-open .mast-tools { justify-content: space-between; }
      .drawer { width: var(--detail-width); }
      .drawer-backdrop.open { opacity: 0; pointer-events: none; }
    }
    @container workbench (max-width: 980px) {
      .filter-bar { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .filter-bar input { grid-column: 1 / -1; }
      .dependency-stage { grid-template-columns: 1fr; }
      .flow-arrow { transform: rotate(90deg); }
      .directory-controls { grid-template-columns: 1fr; }
    }
    @container workbench (max-width: 720px) {
      .view-heading, .section-heading { display: block; }
      .snapshot, .count { display: block; margin-top: 8px; }
      .filter-bar { grid-template-columns: 1fr 1fr; }
      .filter-bar input { grid-column: 1 / -1; }
      .grid { grid-template-columns: 1fr; }
      .epic-group > summary { padding: 20px; }
      .epic-children { padding: 22px 20px 26px; }
    }
    @media (max-width: 1050px) {
      .filter-bar { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .filter-bar input { grid-column: 1 / -1; }
      .dependency-stage { grid-template-columns: 1fr; }
      .flow-arrow { transform: rotate(90deg); }
    }
    @media (max-width: 700px) {
      body { background: var(--paper); }
      .shell { width: min(100% - 32px, 1440px); }
      .masthead { grid-template-columns: 1fr; padding-top: 18px; }
      .mast-tools { justify-content: space-between; }
      .view-heading, .section-heading { display: block; }
      .snapshot { display: block; margin-top: 8px; }
      .filter-bar { grid-template-columns: 1fr 1fr; }
      .filter-bar input { grid-column: 1 / -1; }
      .directory-controls { grid-template-columns: 1fr; }
      .drawer { width: 100vw; border-left: 0; border-radius: 0; }
      .drawer-meta { grid-template-columns: 1fr; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <header class="shell masthead">
    <div>
      <p class="eyebrow">Ticket workbench</p>
      <h1 id="project-title">__PROJECT_NAME__</h1>
      <p id="project-description"></p>
    </div>
    <div class="mast-tools">
      <span class="snapshot" id="summary-line"></span>
      <button class="tool-button theme-toggle" id="theme-toggle" type="button" aria-label="Switch color theme" title="Switch color theme"></button>
    </div>
  </header>
  <div class="nav-wrap">
    <nav class="shell nav-row" aria-label="Workbench views" id="navigation"></nav>
  </div>
  <main class="shell" id="app"></main>
  <div class="drawer-backdrop" id="drawer-backdrop"></div>
  <aside class="drawer" id="drawer" aria-labelledby="drawer-title" aria-modal="false" role="dialog"></aside>
  <script type="application/json" id="tracker-data">__TRACKER_DATA__</script>
  <script>__MARKED_JS__</script>
  <script>__DOMPURIFY_JS__</script>
  <script>
    (() => {
      "use strict";
      const data = JSON.parse(document.getElementById("tracker-data").textContent);
      const byId = new Map(data.records.map(record => [record.id, record]));
      const views = [
        ["next", "Next"],
        ["board", "Board"],
        ["directory", "Directory"],
        ["dependencies", "Dependencies"]
      ];
      const state = {
        view: "next",
        lastView: "next",
        selected: "",
        focus: "",
        query: "",
        epic: "all",
        kind: "all",
        status: "all",
        // Directory uses canonical persisted statuses. Empty means "All";
        // otherwise records match any selected value (OR semantics).
        directoryStatuses: [],
        area: "all",
        priority: "all",
        directoryGroups: ["decisions", "epics", "standalone"],
        sort: "created-desc"
      };
      const app = document.getElementById("app");
      const navigation = document.getElementById("navigation");
      const drawer = document.getElementById("drawer");
      const backdrop = document.getElementById("drawer-backdrop");
      const compactDrawer = window.matchMedia("(max-width: 1099px)");
      const priorityOrder = Object.fromEntries(
        data.project.priorities.map((priority, index) => [priority, index])
      );
      const fallbackPriority = data.project.priorities.length;
      const directoryStatusChoices = ["pending", "in_progress", "blocked", "resolved", "wont_fix", "finalized"];
      let renderedDrawerId = "";
      const escapeHtml = value => String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      })[char]);
      const label = value => String(value || "—").replaceAll("_", " ");
      const isActiveTicket = record => record.kind === "ticket" && ["pending", "in_progress", "blocked"].includes(record.status);
      const isComplete = record => record.kind === "ticket"
        ? ["resolved", "wont_fix"].includes(record.status)
        : record.status === "finalized";
      const epicOf = record => record.parent ? byId.get(record.parent) : null;
      const tone = record => {
        if (record.kind === "decision") return record.readiness === "waiting" ? "blocked" : "decision";
        return ({ in_progress: "progress", pending: "ready", blocked: "blocked", resolved: "resolved", wont_fix: "blocked" })[record.status] || "";
      };
      // "Ready" is a display/readiness label, not a persisted ticket status.
      // An unblocked, non-epic ticket stored as `pending` is shown as "Ready".
      const statusText = record => record.kind === "decision"
        ? record.readiness
        : record.status === "pending" && record.type !== "epic" ? "ready" : record.status;

            if (view === "dependencies") state.focus = focus;
          }
        }
        renderView();
      }
      document.addEventListener("click", event => {
        const viewButton = event.target.closest("[data-view]");
        if (viewButton) return navigate(viewButton.dataset.view);
        const focusButton = event.target.closest("[data-focus]");
        if (focusButton) return navigate(`dependencies/${focusButton.dataset.focus}`);
        const recordButton = event.target.closest("[data-record]");
        if (recordButton) {
          event.preventDefault();
          return navigate(`record/${recordButton.dataset.record}`);
        }
        const epicButton = event.target.closest("[data-epic]");
        if (epicButton) {
          const epicId = epicButton.dataset.epic;
          // Epic clicks are contextual: Board/Directory filter in place.
          // Other views open the epic detail drawer; never force Directory.
          if (!["board", "directory"].includes(state.view)) {
            return navigate(`record/${epicId}`);
          }
          state.epic = epicId;
          if (state.selected) return navigate(state.lastView);
          renderView();
          return;
        }
        if (event.target.closest("[data-close]") || event.target === backdrop) {
          return navigate(state.lastView);
        }
      });
      document.addEventListener("keydown", event => {
        if (event.key === "Escape" && state.selected) navigate(state.lastView);
      });
      window.addEventListener("hashchange", applyRoute);
      compactDrawer.addEventListener("change", event => {
        if (drawer.classList.contains("open")) {
          drawer.setAttribute("aria-modal", event.matches ? "true" : "false");
        }
      });
      applyRoute();
    })();
  </script>
</body>
</html>
