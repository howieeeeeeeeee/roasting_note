</script>
  <script>
    (() => {
      "use strict";
      const data = JSON.parse(document.getElementById("tracker-data").textContent);
      const byId = new Map(data.records.map(record => [record.id, record]));
      const views = [
        ["next", "Next"],
        ["board", "Board"],
        ["directory", "Directory"],
        ["dependencies", "Dependencies"]
      ];
      const state = {
        view: "next",
        lastView: "next",
        selected: "",
        focus: "",
        query: "",
        epic: "all",
        kind: "all",
        status: "all",
        // Directory uses canonical persisted statuses. Empty means "All";
        // otherwise records match any selected value (OR semantics).
        directoryStatuses: [],
        area: "all",
        priority: "all",
        directoryGroups: ["decisions", "epics", "standalone"],
        sort: "created-desc"
      };
      const app = document.getElementById("app");
      const navigation = document.getElementById("navigation");
      const drawer = document.getElementById("drawer");
      const backdrop = document.getElementById("drawer-backdrop");
      const compactDrawer = window.matchMedia("(max-width: 1099px)");
      const priorityOrder = Object.fromEntries(
        data.project.priorities.map((priority, index) => [priority, index])
      );
      const fallbackPriority = data.project.priorities.length;
      const directoryStatusChoices = ["pending", "in_progress", "blocked", "resolved", "wont_fix", "finalized"];
      let renderedDrawerId = "";
      const escapeHtml = value => String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      })[char]);
      const label = value => String(value || "—").replaceAll("_", " ");
      const isActiveTicket = record => record.kind === "ticket" && ["pending", "in_progress", "blocked"].includes(record.status);
      const isComplete = record => record.kind === "ticket"
        ? ["resolved", "wont_fix"].includes(record.status)
        : record.status === "finalized";
      const epicOf = record => record.parent ? byId.get(record.parent) : null;
      const tone = record => {
        if (record.kind === "decision") return record.readiness === "waiting" ? "blocked" : "decision";
        return ({ in_progress: "progress", pending: "ready", blocked: "blocked", resolved: "resolved", wont_fix: "blocked" })[record.status] || "";
      };
      // "Ready" is a display/readiness label, not a persisted ticket status.
      // An unblocked, non-epic ticket stored as `pending` is shown as "Ready".
      const statusText = record => record.kind === "decision"
        ? record.readiness
        : record.status === "pending" && record.type !== "epic" ? "ready" : record.status;
      const recordDate = record => record.completed || record.created || "";
      const unique = key => [...new Set(data.records.map(record => record[key]).filter(Boolean))].sort();
      const optionList = (values, selected, allLabel) =>
        `<option value="all">${escapeHtml(allLabel)}</option>` +
        values.map(value => `<option value="${escapeHtml(value)}"${value === selected ? " selected" : ""}>${escapeHtml(label(value))}</option>`).join("");
      function getThemePreference() {
        try { return localStorage.getItem("issue-workbench-theme") || ""; }
        catch (_) { return ""; }
      }
      function setTheme(theme) {
        if (theme) document.documentElement.dataset.theme = theme;
        else delete document.documentElement.dataset.theme;
        const resolved = theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        const toggle = document.getElementById("theme-toggle");
        const nextLabel = resolved === "dark" ? "Switch to light mode" : "Switch to dark mode";
        toggle.innerHTML = resolved === "dark"
          ? '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>'
          : '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>';
        toggle.setAttribute("aria-label", nextLabel);
        toggle.title = nextLabel;
      }
      setTheme(getThemePreference());
      document.getElementById("theme-toggle").addEventListener("click", () => {
        const current = document.documentElement.dataset.theme ||
          (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        const next = current === "dark" ? "light" : "dark";
        try { localStorage.setItem("issue-workbench-theme", next); } catch (_) {}
        setTheme(next);
      });
      document.getElementById("project-description").textContent = data.project.description;
      document.getElementById("summary-line").textContent =
        `${data.summary.activeTickets} active · ${data.summary.blockedTickets} blocked · ${data.summary.readyDecisions} ready decisions`;
      function renderNavigation() {
        navigation.innerHTML = views.map(([id, text]) =>
          `<button class="nav-button" type="button" data-view="${id}"${state.view === id ? ' aria-current="page"' : ""}>${text}</button>`
        ).join("");
      }
      function relationshipChips(ids, prefix = "") {
        if (!ids.length) return "";
        return `<div class="chips">${ids.map(id =>
          `<button class="chip" type="button" data-record="${escapeHtml(id)}">${escapeHtml(prefix + id)}</button>`
        ).join("")}</div>`;
      }
      function progressLine(epic) {
        const children = (epic.children || []).map(id => byId.get(id));
        if (!children.length) return "";
        return `<div class="progress-line" aria-label="${children.length} child tickets">${children.map(child =>
          `<span class="${escapeHtml(child.status)}" title="${escapeHtml(child.id + ": " + label(child.status))}"></span>`
        ).join("")}</div>`;
      }
      function recordCard(record, className = "", interaction = "record") {
        const epic = epicOf(record);
        const epicTag = epic
          ? `<button class="epic-tag" type="button" data-epic="${escapeHtml(epic.id)}" title="${escapeHtml(epic.title)}">Epic ${escapeHtml(epic.id)}</button>`
          : "";
        const blocked = record.blockedBy.length
          ? `<div class="card-blockers"><span class="label">Needs</span>${relationshipChips(record.blockedBy)}</div>`
          : "";
        const impact = record.kind === "decision" && record.status === "pending"
          ? `<div class="impact-wrap"><div class="impact-stamp" aria-label="${record.unlocksNow.length} immediate unlocks and ${record.downstreamWork} downstream work items">
               <span class="stamp-cell"><span class="stamp-value">${record.unlocksNow.length}</span><span class="stamp-label">unlocks</span></span>
               <span class="stamp-cell"><span class="stamp-value">${record.downstreamWork}</span><span class="stamp-label">downstream</span></span>
             </div></div>`
          : "";
        return `<article class="record-card ${className}" data-tone="${tone(record)}">
          <div class="card-top">
            <div class="card-key"><span class="record-id">${escapeHtml(record.id)} · ${escapeHtml(label(record.type))}</span>${epicTag}</div>
            <span class="status ${tone(record)}">${escapeHtml(label(statusText(record)))}</span>
          </div>
          <button class="record-title" type="button" data-${interaction}="${escapeHtml(record.id)}">${escapeHtml(record.title)}</button>
          <div class="meta">${escapeHtml(record.priority ? record.priority + " · " : "")}${escapeHtml(record.area)} · ${escapeHtml(record.created)}</div>
          ${blocked}${impact}
        </article>`;
      }
      function section(title, note, records, emptyText) {
        return `<section class="section">
          <div class="section-heading"><div><h3>${escapeHtml(title)}</h3><p>${escapeHtml(note)}</p></div><span class="count">${records.length}</span></div>
          ${records.length ? `<div class="grid">${records.map(record => recordCard(record)).join("")}</div>` : `<div class="empty">${escapeHtml(emptyText)}</div>`}
        </section>`;
      }
      function impactPriority(decision) {
        const affected = decision.downstream.map(id => byId.get(id)).filter(item => item.kind === "ticket");
        return Math.min(
          fallbackPriority,
          ...affected.map(item => priorityOrder[item.priority] ?? fallbackPriority)
        );
      }
      function decisionSort(a, b) {
        return impactPriority(a) - impactPriority(b)
          || b.unlocksNow.length - a.unlocksNow.length
          || b.downstreamWork - a.downstreamWork
          || a.created.localeCompare(b.created)
          || a.id.localeCompare(b.id);
      }
      function viewHeading(title, description) {
        return `<div class="view-heading"><div><h2>${escapeHtml(title)}</h2><p>${escapeHtml(description)}</p></div><span class="snapshot">${escapeHtml(data.sourceDigest)}</span></div>`;
      }
      function renderNext() {
        const ongoing = data.records.filter(record => record.kind === "ticket" && record.status === "in_progress")
          .sort((a, b) => priorityOrder[a.priority] - priorityOrder[b.priority] || a.created.localeCompare(b.created));
        const readyDecisions = data.records.filter(record => record.readiness === "ready").sort(decisionSort);
        const waitingDecisions = data.records.filter(record => record.readiness === "waiting").sort(decisionSort);
        const readyWork = data.records.filter(record => record.kind === "ticket" && record.status === "pending" && record.type !== "epic")
          .sort((a, b) => priorityOrder[a.priority] - priorityOrder[b.priority] || a.created.localeCompare(b.created));
        const epics = data.records.filter(record => record.type === "epic" && isActiveTicket(record));
        app.innerHTML = viewHeading("Next", "Work and decisions that move the project.")
          + section("Continue", "Already in progress.", ongoing, "No work in progress.")
          + section("Decide", "Ready for review.", readyDecisions, "No decisions are ready.")
          + section("Waiting", "Needs evidence.", waitingDecisions, "No decisions are waiting.")
          + section("Ready", "Can start.", readyWork, "No tickets are ready.")
          + `<section class="section"><div class="section-heading"><div><h3>Epics</h3><p>Active project arcs.</p></div><span class="count">${epics.length}</span></div>
             <div class="grid">${epics.map(epic => `<button class="epic-button" type="button" data-epic="${epic.id}"><span class="record-id">${epic.id}</span><br><strong>${escapeHtml(epic.title)}</strong>${progressLine(epic)}</button>`).join("") || '<div class="empty">No active epics.</div>'}</div></section>`;
      }
      function directoryStatusFilter() {
        return `<fieldset class="directory-status-box">
          <legend class="visually-hidden">Filter directory by status</legend>
          <label class="directory-status-option"><input type="checkbox" data-directory-status-all${state.directoryStatuses.length ? "" : " checked"}>All statuses</label>
          ${directoryStatusChoices.map(value => `<label class="directory-status-option"><input type="checkbox" data-directory-status value="${value}"${state.directoryStatuses.includes(value) ? " checked" : ""}>${escapeHtml(label(value))}</label>`).join("")}
        </fieldset>`;
      }
      function filterBar(multiStatus = false) {
        const epics = data.records.filter(record => record.type === "epic");
        return `<div class="filter-bar">
          <label class="visually-hidden" for="record-search">Search records</label>
          <input id="record-search" data-filter="query" value="${escapeHtml(state.query)}" placeholder="Search tickets and decisions…">
          <select data-filter="kind" aria-label="Record kind">${optionList(["ticket", "decision"], state.kind, "All records")}</select>
          ${multiStatus ? "" : `<select data-filter="status" aria-label="Status">${optionList(["pending", "in_progress", "blocked", "resolved", "wont_fix", "ready", "waiting", "finalized"], state.status, "All statuses")}</select>`}
          <select data-filter="epic" aria-label="Epic"><option value="all">All epics</option>${epics.map(epic => `<option value="${epic.id}"${state.epic === epic.id ? " selected" : ""}>${escapeHtml(epic.id)}</option>`).join("")}</select>
          <select data-filter="area" aria-label="Area">${optionList(unique("area"), state.area, "All areas")}</select>
          <select data-filter="priority" aria-label="Priority">${optionList(data.project.priorities, state.priority, "All priorities")}</select>
          ${multiStatus ? directoryStatusFilter() : ""}
        </div>`;
      }
      function matches(record, statuses = state.status === "all" ? [] : [state.status]) {
        const haystack = [record.id, record.title, record.area, record.type, record.status, record.markdown, ...record.tags].join(" ").toLowerCase();
        const queryMatch = !state.query || haystack.includes(state.query.toLowerCase());
        const kindMatch = state.kind === "all" || record.kind === state.kind;
        const displayStatus = statusText(record);
        // Accept a list so Directory can OR-match multiple canonical statuses;
        // Board still passes its one selected status through the same predicate.
        const statusMatch = !statuses.length || statuses.some(value => record.status === value || displayStatus === value);
        const epicMatch = state.epic === "all" || record.id === state.epic || record.parent === state.epic;
        const areaMatch = state.area === "all" || record.area === state.area;
        const priorityMatch = state.priority === "all" || record.priority === state.priority;
        return queryMatch && kindMatch && statusMatch && epicMatch && areaMatch && priorityMatch;
      }
      function epicStrip() {
        const epics = data.records.filter(record => record.type === "epic" && isActiveTicket(record));
        return `<div class="epic-strip"><button class="epic-button" type="button" data-epic="all" aria-pressed="${state.epic === "all"}"><strong>All epics</strong><div class="meta">Show everything</div></button>${epics.map(epic =>
          `<button class="epic-button" type="button" data-epic="${epic.id}" aria-pressed="${state.epic === epic.id}"><span class="record-id">${epic.id}</span><br><strong>${escapeHtml(epic.title)}</strong>${progressLine(epic)}</button>`
        ).join("")}</div>`;
      }
      function renderBoard() {
        const selected = data.records.filter(record => matches(record));
        const columns = [
          ["Decisions", selected.filter(record => record.kind === "decision" && record.status === "pending")],
          ["In progress", selected.filter(record => record.kind === "ticket" && record.status === "in_progress")],
          ["Ready", selected.filter(record => record.kind === "ticket" && record.status === "pending" && record.type !== "epic")],
          ["Blocked", selected.filter(record => record.kind === "ticket" && record.status === "blocked")]
        ];
        app.innerHTML = viewHeading("Board", "Active work by status and epic.")
          + epicStrip() + filterBar()
          + `<div class="board">${columns.map(([title, records]) => `<section class="board-column"><div class="column-heading"><span>${title}</span><span>${records.length}</span></div><div class="column-stack">${records.map(record => recordCard(record)).join("") || '<div class="empty">No matching records.</div>'}</div></section>`).join("")}</div>`;
      }
      function sortRecords(records) {
        const copy = [...records];
        const field = state.sort.startsWith("completed") ? recordDate : record => record.created || "";
        const direction = state.sort.endsWith("asc") ? 1 : -1;
        return copy.sort((a, b) => direction * field(a).localeCompare(field(b)) || a.id.localeCompare(b.id));
      }
      function directorySort() {
        return `<select class="focus-select" data-filter="sort" aria-label="Sort directory">
          <option value="created-desc"${state.sort === "created-desc" ? " selected" : ""}>Created: newest</option>
          <option value="created-asc"${state.sort === "created-asc" ? " selected" : ""}>Created: oldest</option>
          <option value="completed-desc"${state.sort === "completed-desc" ? " selected" : ""}>Completed: newest</option>
          <option value="completed-asc"${state.sort === "completed-asc" ? " selected" : ""}>Completed: oldest</option>
        </select>`;
      }
      function directoryGroupSelect() {
        const choices = [
          ["decisions", "Human decisions"],
          ["epics", "Epics"],
          ["standalone", "Standalone"]
        ];
        return `<fieldset class="directory-group-box">
          <legend class="visually-hidden">Show directory groups</legend>
          ${choices.map(([value, text]) => `<label class="directory-group-option"><input type="checkbox" data-directory-group value="${value}"${state.directoryGroups.includes(value) ? " checked" : ""}>${text}</label>`).join("")}
        </fieldset>`;
      }
      function directorySection(key, title, note, count, content, emptyText) {
        if (!state.directoryGroups.includes(key)) return "";
        if (!count && state.directoryGroups.length > 1) return "";
        return `<section class="directory-section">
          <div class="section-heading"><div><h3>${escapeHtml(title)}</h3><p>${escapeHtml(note)}</p></div><span class="count">${count}</span></div>
          ${count ? content : `<div class="empty">${escapeHtml(emptyText)}</div>`}
        </section>`;
      }
      function renderDirectory() {
        const matchesById = new Set(data.records.filter(record => matches(record, state.directoryStatuses)).map(record => record.id));
        const decisions = sortRecords(data.records.filter(record =>
          record.kind === "decision" && matchesById.has(record.id)
        ));
        const epics = sortRecords(data.records.filter(record => record.type === "epic" && (
          matchesById.has(record.id) || (record.children || []).some(id => matchesById.has(id))
        )));
        const standalone = sortRecords(data.records.filter(record =>
          record.kind === "ticket"
          && record.type !== "epic"
          && !record.parent
          && matchesById.has(record.id)
        ));
        const epicContent = epics.map(epic => {
          const children = sortRecords((epic.children || []).map(id => byId.get(id)).filter(child => matchesById.has(child.id)));
          return `<details class="epic-group" open><summary><div class="epic-summary"><div><span class="record-id">${epic.id} · epic</span><br><strong>${escapeHtml(epic.title)}</strong></div><span class="status ${tone(epic)}">${escapeHtml(label(epic.status))}</span></div>${progressLine(epic)}</summary><div class="epic-children">${children.map(child => recordCard(child)).join("") || '<div class="empty">No child tickets match.</div>'}</div></details>`;
        }).join("");
        app.innerHTML = viewHeading("Directory", "All epics, tickets, and decisions.")
          + filterBar(true)
          + `<div class="directory-controls">${directoryGroupSelect()}${directorySort()}</div>`
          + `<div class="directory">
            ${directorySection("decisions", "Human decisions", "Choices and their readiness.", decisions.length, `<div class="grid">${decisions.map(record => recordCard(record)).join("")}</div>`, "No human decisions match.")}
            ${directorySection("epics", "Epics", "Project arcs and child tickets.", epics.length, epicContent, "No epics match.")}
            ${directorySection("standalone", "Standalone", "Tickets outside an epic.", standalone.length, `<div class="grid standalone-grid">${standalone.map(record => recordCard(record)).join("")}</div>`, "No standalone tickets match.")}
            ${state.directoryGroups.length > 1 && !decisions.length && !epics.length && !standalone.length ? '<div class="empty">No records match these filters.</div>' : ""}
            ${!state.directoryGroups.length ? '<div class="empty">Select at least one directory group.</div>' : ""}
          </div>`;
      }
      function relationColumn(title, ids, emptyText) {
        return `<section class="dependency-column"><h3>${escapeHtml(title)}</h3><div class="dependency-stack">${ids.map(id => recordCard(byId.get(id), "", "focus")).join("") || `<div class="empty">${escapeHtml(emptyText)}</div>`}</div></section>`;
      }
      function renderDependencies() {
        const active = data.records.filter(record => !isComplete(record));
        const dependencyChoices = data.records
          .filter(record => record.blockedBy.length || record.dependents.length)
          .sort((a, b) =>
            b.dependents.length - a.dependents.length
            || b.downstream.length - a.downstream.length
            || a.id.localeCompare(b.id)
          );
        const fallback = dependencyChoices[0] || active[0];
        const focus = byId.get(state.focus) || fallback;
        state.focus = focus ? focus.id : "";
        if (!focus) {
          app.innerHTML = viewHeading("Dependencies", "Blockers and downstream effects.") + '<div class="empty">No records.</div>';
          return;
        }
        if (!dependencyChoices.some(record => record.id === focus.id)) {
          dependencyChoices.unshift(focus);
        }
        const transitive = focus.downstream.filter(id => !focus.dependents.includes(id));
        app.innerHTML = viewHeading("Dependencies", "Blockers and downstream effects.")
          + `<label class="label" for="focus-record">Focus</label><select class="focus-select" id="focus-record" data-focus-select>${dependencyChoices.map(record => {
              const relation = record.dependents.length
                ? `blocks ${record.dependents.length}`
                : `blocked by ${record.blockedBy.length}`;
              return `<option value="${record.id}"${record.id === focus.id ? " selected" : ""}>${escapeHtml(record.id + " · " + relation + " · " + record.title)}</option>`;
            }).join("")}</select>`
          + `<p class="dependency-summary">${focus.dependents.length} directly blocked · ${focus.downstream.length} downstream · ${focus.blockedBy.length} blockers</p>`
          + `<div class="dependency-stage">
              ${relationColumn("Blocked by", focus.blockedBy, "No unresolved blockers.")}
              <div class="flow-arrow" aria-hidden="true">→</div>
              <section class="dependency-column"><h3>Selected</h3>${recordCard(focus, "focus-card")}${focus.decisions.length ? `<div class="provenance"><span class="label">Decisions</span>${relationshipChips(focus.decisions)}</div>` : ""}</section>
              <div class="flow-arrow" aria-hidden="true">→</div>
              ${relationColumn("Directly affects", focus.dependents, "No active record depends on this.")}
            </div>`
          + (transitive.length ? `<section class="section"><div class="section-heading"><div><h3>Further downstream</h3><p>Affected later.</p></div><span class="count">${transitive.length}</span></div><div class="grid">${transitive.map(id => recordCard(byId.get(id), "", "focus")).join("")}</div></section>` : "");
      }
      function renderView() {
        renderNavigation();
        ({ next: renderNext, board: renderBoard, directory: renderDirectory, dependencies: renderDependencies })[state.view]();
        wireControls();
        renderDrawer();
      }
      function normalizePath(path) {
        const parts = [];
        path.split("/").forEach(part => {
          if (!part || part === ".") return;
          if (part === "..") parts.pop();
          else parts.push(part);
        });
        return parts.join("/");
      }
      function wireMarkdownLinks(container, record) {
        const sourceDir = record.sourcePath.split("/").slice(0, -1).join("/");
        container.querySelectorAll("a[href]").forEach(anchor => {
          const href = anchor.getAttribute("href");
          if (/^(https?:|mailto:|#)/i.test(href)) {
            if (/^https?:/i.test(href)) anchor.rel = "noreferrer";
            return;
          }
          const normalized = normalizePath(`${sourceDir}/${href.split("#")[0]}`);
          const targetId = data.pathIndex[normalized];
          if (targetId) {
            anchor.href = `#record/${encodeURIComponent(targetId)}`;
            anchor.dataset.record = targetId;
          } else {
            anchor.href = normalized + (href.includes("#") ? "#" + href.split("#").slice(1).join("#") : "");
          }
        });
      }
      function renderDrawer() {
        const record = byId.get(state.selected);
        document.body.classList.toggle("detail-open", Boolean(record));
        if (!record) {
          drawer.classList.remove("open");
          backdrop.classList.remove("open");
          drawer.setAttribute("aria-modal", "false");
          drawer.innerHTML = "";
          renderedDrawerId = "";
          return;
        }
        const selectionChanged = renderedDrawerId !== record.id;
        const rendered = DOMPurify.sanitize(marked.parse(record.markdown, { gfm: true }), {
          USE_PROFILES: { html: true },
          FORBID_TAGS: ["style", "iframe", "object", "embed"]
        });
        const epic = epicOf(record);
        drawer.innerHTML = `<div class="drawer-header"><div><span class="record-id">${escapeHtml(record.id)} · ${escapeHtml(label(record.type))}</span></div><button class="close-button" type="button" data-close aria-label="Close details"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
          <div class="drawer-body"><span class="status ${tone(record)}">${escapeHtml(label(statusText(record)))}</span><h2 id="drawer-title">${escapeHtml(record.title)}</h2>
          <div class="drawer-meta">
            <div class="meta-box"><span class="label">Created</span><br>${escapeHtml(record.created || "—")}</div>
            <div class="meta-box"><span class="label">Completed</span><br>${escapeHtml(record.completed || "—")}</div>
            <div class="meta-box"><span class="label">Area / priority</span><br>${escapeHtml(record.area)}${record.priority ? " · " + escapeHtml(record.priority) : ""}</div>
            <div class="meta-box"><span class="label">Epic</span><br>${epic ? `<button class="epic-tag" type="button" data-epic="${epic.id}" title="${escapeHtml(epic.title)}">Epic ${escapeHtml(epic.id)}</button>` : "Standalone"}</div>
          </div>
          ${record.blockedBy.length ? `<div><span class="label">Blocked by</span>${relationshipChips(record.blockedBy)}</div>` : ""}
          ${record.dependents.length ? `<div><span class="label">Directly affects</span>${relationshipChips(record.dependents)}</div>` : ""}
          ${record.decisions.length ? `<div><span class="label">Decision provenance</span>${relationshipChips(record.decisions)}</div>` : ""}
          <p><a href="${escapeHtml(record.sourcePath)}">Source Markdown</a></p>
          <article class="markdown">${rendered}</article></div>`;
        wireMarkdownLinks(drawer.querySelector(".markdown"), record);
        drawer.classList.add("open");
        backdrop.classList.add("open");
        drawer.setAttribute("aria-modal", compactDrawer.matches ? "true" : "false");
        renderedDrawerId = record.id;
        if (selectionChanged) drawer.querySelector("[data-close]").focus();
      }
      function wireControls() {
        app.querySelectorAll("[data-filter]").forEach(control => {
          const event = control.tagName === "INPUT" ? "input" : "change";
          control.addEventListener(event, () => {
            state[control.dataset.filter] = control.value;
            renderView();
            const search = document.getElementById("record-search");
            if (search && control.tagName === "INPUT") {
              search.focus();
              search.setSelectionRange(search.value.length, search.value.length);
            }
          });
        });
        app.querySelectorAll("[data-directory-group]").forEach(control => {
          control.addEventListener("change", () => {
            state.directoryGroups = [...app.querySelectorAll("[data-directory-group]:checked")]
              .map(item => item.value);
            renderView();
          });
        });
        const allStatuses = app.querySelector("[data-directory-status-all]");
        if (allStatuses) {
          allStatuses.addEventListener("change", () => {
            state.directoryStatuses = [];
            renderView();
          });
        }
        app.querySelectorAll("[data-directory-status]").forEach(control => {
          control.addEventListener("change", () => {
            state.directoryStatuses = [...app.querySelectorAll("[data-directory-status]:checked")]
              .map(item => item.value);
            renderView();
          });
        });
        const focusSelect = app.querySelector("[data-focus-select]");
        if (focusSelect) focusSelect.addEventListener("change", () => navigate(`dependencies/${focusSelect.value}`));
      }
      function navigate(route) {
        location.hash = route;
      }
      function applyRoute() {
        const route = decodeURIComponent(location.hash.replace(/^#/, "")) || "next";
        if (route.startsWith("record/")) {
          state.selected = route.slice(7);
        } else {
          state.selected = "";
          const [view, focus = ""] = route.split("/");
          if (views.some(([id]) => id === view)) {
            state.view = view;
            state.lastView = view;
            if (view === "dependencies") state.focus = focus;
          }
        }
        renderView();
      }
      document.addEventListener("click", event => {
        const viewButton = event.target.closest("[data-view]");
        if (viewButton) return navigate(viewButton.dataset.view);
        const focusButton = event.target.closest("[data-focus]");
        if (focusButton) return navigate(`dependencies/${focusButton.dataset.focus}`);
        const recordButton = event.target.closest("[data-record]");
        if (recordButton) {
          event.preventDefault();
          return navigate(`record/${recordButton.dataset.record}`);
        }
        const epicButton = event.target.closest("[data-epic]");
        if (epicButton) {
          const epicId = epicButton.dataset.epic;
          // Epic clicks are contextual: Board/Directory filter in place.
          // Other views open the epic detail drawer; never force Directory.
          if (!["board", "directory"].includes(state.view)) {
            return navigate(`record/${epicId}`);
          }
          state.epic = epicId;
          if (state.selected) return navigate(state.lastView);
          renderView();
          return;
        }
        if (event.target.closest("[data-close]") || event.target === backdrop) {
          return navigate(state.lastView);
        }
      });
      document.addEventListener("keydown", event => {
        if (event.key === "Escape" && state.selected) navigate(state.lastView);
      });
      window.addEventListener("hashchange", applyRoute);
      compactDrawer.addEventListener("change", event => {
        if (drawer.classList.contains("open")) {
          drawer.setAttribute("aria-modal", event.matches ? "true" : "false");
        }
      });
      applyRoute();
    })();
  </script>
</body>
</html>
