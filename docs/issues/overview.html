    .shell {

    }

      grid-template-columns: minmax(0, 1fr) var(--detail-width);
    }
    .workspace {
      min-width: 0;

    }
    .topbar {

      top: 0;
      z-index: 10;

      font-weight: 800;

    }

    h1 {
      margin-bottom: 0;

    }

    main { padding: 28px clamp(18px, 3vw, 42px) 70px; }
    .summary {

    .toolbar {

    }

    .count {

      min-height: 30px;
      align-items: center;
      justify-content: center;

      border: 1px solid var(--line);
      border-radius: 999px;

      align-items: center;

      margin-bottom: 2px;
      font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
      font-size: 1.05rem;

    .section-heading p { margin-bottom: 0; color: var(--muted); font-size: .8rem; }

      text-align: left;

      border-radius: var(--radius);

    .record-card:hover { border-color: var(--coffee); }
    .card-key {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: start;
      margin-bottom: 14px;
    }
    .record-id {
      color: var(--accent);
      font-size: .74rem;
      font-weight: 800;

      margin-bottom: 12px;

      font-size: .8rem;
      font-weight: 800;

      background: var(--surface);
      border-radius: var(--radius);

      overflow: hidden;

      border-radius: 999px;

    .progress-line .active { background: var(--progress); }
    .progress-line .stuck { background: var(--blocked); }
    .epic-group {
      margin-bottom: 18px;
      padding: 14px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: var(--radius);

    .epic-summary { display: flex; justify-content: space-between; gap: 16px; }
    .epic-children { margin-top: 14px; }
    .dependency-row {
      display: grid;
      grid-template-columns: minmax(190px, 1fr) minmax(180px, 1fr) minmax(180px, 1fr);
      gap: 10px;
      padding: 12px 0;
      border-top: 1px solid var(--line);
    }
    .dependency-row:first-child { border-top: 0; }
    .dependency-title {
      padding: 0;
      text-align: left;
      background: transparent;
      border: 0;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      padding: 4px 7px;
      color: var(--coffee);
      background: transparent;
      border-color: var(--line);
      font-size: .7rem;
    }
    .empty {
      padding: 22px;
      color: var(--muted);
      text-align: center;

    .detail {

      background: var(--surface);
      border-left: 1px solid var(--line);

    body.detail-open .detail { display: block; }
    .detail-close {
      position: sticky;
      top: 0;
      float: right;
      z-index: 2;
      padding: 7px 10px;

      clear: both;
      padding-top: 18px;
      font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
      line-height: 1.15;

      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin: 18px 0;
    }
    .meta-box {
      padding: 10px;
      background: var(--surface-2);
      border-radius: 9px;
      font-size: .78rem;
    }
    .meta-box span { color: var(--muted); }
    .record-body {
      margin-top: 22px;
      padding-top: 18px;
      border-top: 1px solid var(--line);

    .record-body pre {
      margin: 0;

      overflow-wrap: anywhere;

      font: .82rem/1.65 ui-monospace, "SFMono-Regular", Consolas, monospace;
    }
    .source-link { display: inline-block; margin-top: 18px; }
    @container workspace (max-width: 860px) {
      .board { grid-template-columns: 1fr; }

      .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }

    @media (max-width: 620px) {
      .topbar { align-items: start; }
      .summary { grid-template-columns: 1fr 1fr; }
      .toolbar, .filters { display: grid; grid-template-columns: 1fr; }
      .views { display: grid; grid-template-columns: 1fr 1fr; }
      .views button { width: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }

  <script>
    const data = {"project":{"decisionPrefix":"HD","description":"Product, engineering, design, documentation, and hardware work for the RoastLogger application.","name":"RoastLogger","priorities":["high","medium","low"],"ticketPrefix":"RN","ticketTypes":["epic","bug","feature","improvement","refactor","todo"]},"records":[{"area":"charting","blockedBy":[],"completed":"2025-01-10","created":"2025-01-09","decisions":[],"dependents":[],"downstream":[],"downstreamWork":0,"id":"RN-0001","kind":"ticket","markdown":"# Chart Visualization Fixes\n\n## Description\n\nMultiple issues with the roast chart visualization on detail and edit pages.\n\n## Issues Fixed\n\n1. **Chart not visible on detail page**\n   - Power/Fan timeline bars missing from roast_detail.html\n   - Chart code was duplicated instead of shared\n\n2. **Power/Fan bars not showing segments**\n   - Bars were solid color instead of showing distinct segments when settings changed\n   - No labels (P4, F9) to indicate current setting\n\n3. **Event markers cut off**\n   - Event marker labels (FC, SC, etc.) were cut off at top of chart\n   - yAdjust was positioning labels outside visible area\n\n4. **Event markers appearing in wrong order**\n   - Clicking quick events showed markers in wrong positions\n   - Root cause: Using category X-axis (string labels) instead of linear (numeric)\n\n5. **RoR spikes making chart unreadable**\n   - RoR values of 100+ at roast start distorted the chart\n   - Solution: Filter to only plot RoR \u003c= 30\n\n6. **Dropdown menu not responding**\n   - Edit/Delete dropdown on roast detail page was non-functional\n   - Root cause: Malformed Jinja2 template (`{ {` instead of `{{`)\n\n## Resolution\n\n### Created Shared Chart Module\n- New file: `static/js/roast-chart.js`\n- Functions: `init()`, `initFromData()`, `addDataPoint()`, `addEventMarker()`\n- Used by: roast_live.html, roast_detail.html, roast_edit.html\n\n### Fixed Chart Configuration\n- Changed X-axis from category to linear type\n- Changed event marker yAdjust from -20 to 15\n- Reduced chart height from 440px to 370px\n- Added RoR filtering (only values \u003c= 30)\n\n### Fixed Template Syntax\n- Corrected `{ {` to `{{` in roast_detail.html reviewsData\n\n## Related Files\n\n- `static/js/roast-chart.js` (created)\n- `static/css/style.css`\n- `templates/roast_detail.html`\n- `templates/roast_edit.html`\n- `templates/roast_live.html`","parent":"","priority":"high","sourcePath":"resolved/RN-0001-chart-visualization-fixes.md","status":"resolved","tags":[],"title":"Chart Visualization Fixes","type":"bug","unlocksNow":[]},{"area":"testing","blockedBy":[],"completed":"2026-01-11","created":"2026-01-11","decisions":[],"dependents":[],"downstream":[],"downstreamWork":0,"id":"RN-0002","kind":"ticket","markdown":"# API Testing Framework\n\n## Description\n\nAdded API-level tests for backend operations to ensure data integrity and business logic correctness.\n\n## What Was Implemented\n\n### Test Framework Setup\n- Added pytest and pytest-flask to `pyproject.toml`\n- Created `tests/conftest.py` with fixtures for Flask client, database access, and test data\n- Created comprehensive test documentation in `tests/README.md`\n\n### Test Coverage (58 tests total)\n\n#### Bean Operations (`test_beans_api.py` - 14 tests)\n- Create bean with valid/invalid data\n- Edit bean details\n- Delete bean (soft delete verification)\n- Stock management (decrement on roast, restore on delete)\n- Unit price calculation\n- Form validation and data handling\n\n#### Roast Operations (`test_roasts_api.py` - 22 tests)\n- Create draft roast\n- Start roast (timestamp, stock deduction)\n- End roast\n- Add key timing events (FC, SC, Yellowing)\n- Add temperature curve data\n- Update roast details\n- Delete roast (soft delete + stock restoration)\n- Weight loss calculation\n- Sync state endpoint\n- Local CSV logging\n\n#### Review Operations (`test_reviews_api.py` - 14 tests)\n- Add review to roast (JSON and form)\n- Edit existing review\n- Delete review\n- Multiple reviews per roast\n- Extraction method handling\n- Score validation\n\n#### Temperature API (`test_temperature_api.py` - 8 tests)\n- Temperature endpoint response format\n- Error handling for unavailable sensor\n- Sensor URL settings API\n- RoR calculation logic\n\n### Test Data Management\n- All test data marked with `test_data: True` field\n- Tests run only against local database\n- Automatic cleanup after test session\n- Manual cleanup script: `python tests/cleanup_test_data.py`\n\n### Additional Improvements\n- Fixed Flask 3.0 compatibility issue with `request.get_json(silent=True)`\n- Added temperature sensor URL configuration via settings page\n- Updated CLAUDE.md with testing instructions for AI\n\n## Running Tests\n\n```bash\n# Install dependencies\nuv pip install pytest pytest-flask\n\n# Run all tests\nuv run pytest\n\n# Run with verbose output\nuv run pytest -v\n\n# Run specific test file\nuv run pytest tests/test_beans_api.py\n```\n\n## Files Added/Modified\n\n### Added\n- `tests/__init__.py`\n- `tests/conftest.py`\n- `tests/test_beans_api.py`\n- `tests/test_roasts_api.py`\n- `tests/test_reviews_api.py`\n- `tests/test_temperature_api.py`\n- `tests/cleanup_test_data.py`\n- `tests/README.md`\n\n### Modified\n- `pyproject.toml` - Added test dependencies and pytest config\n- `app.py` - Fixed `get_json(silent=True)` for Flask 3.0, added sensor URL settings\n- `templates/base.html` - Added sensor URL settings UI\n- `static/css/style.css` - Added sensor URL container styles\n- `CLAUDE.md` - Added testing instructions\n\n## Success Criteria Met\n\n- [x] Test coverage for all API endpoints\n- [x] Verify database CRUD operations work correctly\n- [x] Stock calculations tested (deduction/restoration)\n- [x] RoR calculation accuracy verified\n- [x] Data validation rules enforced\n- [x] Soft delete behavior confirmed\n- [x] Test data clearly labeled and easy to clean up\n- [x] Tests run only on local database\n- [x] Documentation added for running tests","parent":"","priority":"high","sourcePath":"resolved/RN-0002-api-testing-framework.md","status":"resolved","tags":[],"title":"API Testing Framework","type":"todo","unlocksNow":[]},{"area":"testing","blockedBy":[],"completed":"","created":"2026-01-11","decisions":[],"dependents":[],"downstream":[],"downstreamWork":0,"id":"RN-0003","kind":"ticket","markdown":"# UI/Interface Testing Framework\n\n## Description\n\nAdd end-to-end browser tests for critical user workflows to ensure the interface works correctly.\n\n## What This Tests\n\n- Full user workflows (clicking, typing, navigation)\n- Frontend JavaScript behavior\n- Chart rendering and interactions\n- Real user experience across pages\n- Integration between frontend and backend\n\n## Why This is Separate\n\n- More complex to set up (requires browser automation)\n- Slower to run than API tests\n- Should focus on critical user flows, not everything\n- Builds on top of API testing foundation\n\n## Critical Workflows to Test\n\n### 1. Live Roasting Session (Priority 1)\n\n**Most important workflow - test this first:**\n\n- Create new roast\n- Select bean and enter weight\n- Start roast (verify timer starts)\n- Monitor temperature display updates\n- Log key events (FC, SC) using quick buttons\n- Adjust fan/power settings\n- Verify chart updates in real-time\n- End roast\n- Verify redirect to edit page\n\n**Why this matters:**\n- This is the core feature of the app\n- Real-time updates must work reliably\n- Can't afford failures during actual roasting\n\n### 2. Bean Management\n\n- Add new bean\n- Edit bean details\n- Verify bean shows in bean list\n- Delete bean\n- Verify stock updates after roast\n\n### 3. Roast Review\n\n- View completed roast\n- Add review with score and notes\n- Edit review\n- Delete review\n- Verify chart displays correctly\n\n### 4. Chart Visualization\n\n- Temperature line renders correctly\n- RoR line displays\n- Event markers appear at right times\n- Power/Fan timeline bars show segments\n- Chart scales adjust properly\n\n## What We Need to Decide\n\n**Before implementing, clarify:**\n\n- Which tool to use? (Selenium, Playwright, Cypress)\n- How much coverage vs speed trade-off?\n- Run in CI/CD or manual only?\n- Test on multiple browsers or just one?\n\n## Manual Testing (For Now)\n\nUntil automated UI tests are ready, manually verify:\n\n- User interface layout and appearance\n- Chart visualization accuracy\n- Mobile responsiveness\n- Touch interactions on tablet\n- Edge cases in live roasting flow\n\n## Success Criteria\n\n- [ ] Live roasting workflow tested end-to-end\n- [ ] Critical user interactions verified (buttons, forms, navigation)\n- [ ] Chart rendering validated\n- [ ] Real-time updates confirmed working\n- [ ] Tests can run without manual intervention\n- [ ] Clear documentation for running UI tests\n- [ ] Failures are easy to diagnose (screenshots, logs)\n\n## Dependencies\n\n- **Requires:** API testing completed first\n- **Requires:** Decision on browser testing tool\n- **Requires:** Test data setup mechanism (from API tests)\n\n## Related Files\n\n- `templates/roast_live.html` - Live roasting interface\n- `templates/beans_list.html` - Bean management\n- `templates/roast_detail.html` - Roast viewing\n- `static/js/roast-chart.js` - Chart rendering","parent":"","priority":"medium","sourcePath":"pending/RN-0003-ui-interface-testing-framework.md","status":"pending","tags":[],"title":"UI/Interface Testing Framework","type":"todo","unlocksNow":[]},{"area":"live-roasting","blockedBy":[],"completed":"2026-01-11","created":"2026-01-11","decisions":[],"dependents":[],"downstream":[],"downstreamWork":0,"id":"RN-0004","kind":"ticket","markdown":"# Live Roast Data Collection Accuracy\n\n## Resolution Summary\n\nImplemented both solutions:\n\n1. **RoR Calculation Fixed** (`app.py:812-851`)\n   - Added configurable constants: `ROR_WINDOW_SECONDS = 20`, `ROR_TOLERANCE_SECONDS = 5`\n   - Now uses 20-second window (matching documentation)\n   - Finds *closest* reading within tolerance window (eliminates gaps)\n\n2. **Database Logging Increased** (`app.py:48`)\n   - Added `DB_LOG_INTERVAL_SECONDS = 1`\n   - Now logs every 1 second (consistent with CSV)\n\nAll 58 tests pass.\n\n---\n\n## Original Problems\n\n### 1. RoR Data Has Gaps During Roast\n\n**What's happening:**\n\n- RoR values are sometimes missing in the middle of roasts (not just at the start)\n- Code uses 30-second window but documentation says 20 seconds (mismatch)\n- RoR calculation looks for reading at exactly `target_time ± 2s` - too strict\n- If no reading found in that narrow window, RoR returns `None` (gap)\n\n**Current Code (`app.py` lines 805-846):**\n```python\n# Uses 30s window (should be 20s per docs)\ntarget_time = current_time - 30\n\n# Only accepts reading within ±2 seconds of target - too strict\nif reading['time'] \u003c= target_time + 2:\n    past_reading = reading\n```\n\n**Why this matters:**\n\n- Missing RoR data makes it hard to analyze what happened during the roast\n- Want to record accurate RoR values throughout the entire roast\n- Need reliable data for comparing and replicating roast profiles\n\n**Reference:** `docs/features/live-roasting.md` (lines 53-54) - Formula should use 20-second window\n\n### 2. Database Logging Interval May Be Too Coarse\n\n**What's happening:**\n\n- Temperature fetched every 1 second\n- CSV logs every 1 second  \n- Database logs only every 5 seconds\n- Mismatch between CSV and database data\n\n**Questions:**\n\n- Can we save to database every second as well? (and maybe we can drop the need for local csv)\n- Will the system handle the increased load without lag?\n- Can the frontend plot more data points efficiently?\n- Is there a performance impact we need to test?\n\n**Reference:** `docs/features/live-roasting.md` (lines 83-87)\n\n---\n\n## Proposed Solutions\n\n### Solution 1: Fix RoR Calculation\n\n**Changes Required:**\n\n1. **Add configurable constants at top of `app.py`:**\n   ```python\n   # RoR Calculation Settings\n   ROR_WINDOW_SECONDS = 20      # How far back to look for comparison temp\n   ROR_TOLERANCE_SECONDS = 2    # Acceptable deviation from target time\n   ```\n\n2. **Fix window mismatch:** Change from 30s to use `ROR_WINDOW_SECONDS` constant\n\n3. **Improve reading search:** Instead of requiring exact match within tolerance, find the *closest* reading within tolerance window, or use interpolation\n\n4. **Verify real time gap is used:** The code already correctly uses `(temp_diff / time_diff) * 60` ✓\n\n**Files to Modify:**\n- `app.py` - Add constants and update `calculate_ror()` function\n\n---\n\n### Solution 2: Increase Database Logging Frequency\n\n**Current State:**\n- MongoDB logs every 5 seconds (`client_time // 5`)\n- Local CSV logs every 1 second\n- Creates data mismatch\n\n**Proposed Options:**\n\n| Option | Interval | Pros | Cons |\n|--------|----------|------|------|\n| A. Log every 1s | 1 second | Consistent with CSV, could drop CSV | Higher DB load |\n| B. Log every 2s | 2 seconds | Good balance | Still some mismatch |\n| C. Batch logging | 5s batch of 5 readings | Same DB calls, complete data | Delayed persistence |\n\n**Recommended:** Option A (1s logging) - test performance first\n\n**Files to Modify:**\n- `app.py` - `api_roast_sync_state()` function - change interval logic (line 883)\n\n---\n\n## Success Criteria\n\n- ✅ RoR window and tolerance are configurable constants (`ROR_WINDOW_SECONDS`, `ROR_TOLERANCE_SECONDS`)\n- ✅ RoR uses 20-second window (matching documentation)\n- ✅ RoR calculation finds closest reading within tolerance (no gaps)\n- ✅ RoR uses actual time difference for calculation (already correct: `(temp_diff / time_diff) * 60`)\n- ✅ Evaluate 1-second database logging - if performance allows, implement it\n- ✅ Frontend chart handles increased data without lag\n- ✅ CSV and database data are consistent\n\n---\n\n## Implementation Phases\n\n### Phase 1: RoR Calculation Improvements\n1. Add configurable constants at top of `app.py`:\n   - `ROR_WINDOW_SECONDS = 20`\n   - `ROR_TOLERANCE_SECONDS = 2`\n2. Update `calculate_ror()` to use these constants instead of hardcoded values\n3. Improve reading search to find closest reading within tolerance window\n4. Optionally add interpolation for more accurate RoR\n\n### Phase 2: Database Logging Frequency\n1. Test 1-second DB logging performance\n2. If acceptable, update interval in `api_roast_sync_state()` (change `client_time // 5` to `client_time // 1`)\n3. Consider deprecating local CSV logging if DB has all data\n\n---\n\n## Related Documentation\n\n- `docs/features/live-roasting.md` - Current data logging behavior\n- `docs/features/temperature-sensor.md` - Temperature sensor details","parent":"","priority":"high","sourcePath":"resolved/RN-0004-live-roast-data-collection-accuracy.md","status":"resolved","tags":[],"title":"Live Roast Data Collection Accuracy","type":"improvement","unlocksNow":[]},{"area":"live-roasting","blockedBy":[],"completed":"2026-01-16","created":"2026-01-16","decisions":[],"dependents":[],"downstream":[],"downstreamWork":0,"id":"RN-0005","kind":"ticket","markdown":"# Live Roast Page - Fullscreen Mode\n\n## Description\n\nAdd a fullscreen mode toggle for the live roasting page to optimize the interface for roasting on iPad Air (Safari). The fullscreen mode should reorganize the page layout to maximize visibility of critical information during active roasting sessions, with separate optimized layouts for portrait and landscape orientations.\n\n## User Need\n\nWhen roasting with an iPad Air, the current page layout includes navigation and other elements that take up screen space. A dedicated fullscreen mode would:\n\n- Maximize space for the temperature chart\n- Make current readings more prominent and easier to glance at\n- Keep controls accessible but not intrusive\n- Provide a cleaner, distraction-free roasting interface\n\n## Requirements\n\n### Fullscreen Button\n\n- Add a button on the normal live roast page to enter fullscreen mode\n- Button should be clearly labeled (e.g., \"Fullscreen Mode\" or icon)\n- Clicking toggles the page into fullscreen layout\n\n### Portrait Mode Layout\n\nWhen in portrait orientation on iPad:\n\n1. **Top Section - Current Readings** (1)\n   - Display current time, temperature, and RoR\n   - Large, easy-to-read text\n   - Fixed position at top of screen\n\n2. **Middle Section - Data Visualization** (3)\n   - Place the Curve/Data tabs here\n   - Should take up most of the screen space\n   - Allow switching between chart view and data table\n\n3. **Bottom Section - Controls** (1)\n   - Control panel with fan/power controls and event buttons\n   - Fixed position at bottom of screen\n   - Keep all critical controls accessible\n\n### Landscape Mode Layout\n\nWhen in landscape orientation on iPad:\n\n1. **Overall Structure**\n   - Similar to current design but streamlined\n   - Only show the three essential sections:\n     - Current temperature readings\n     - Control panel\n     - Curve/Data tabs\n   - Remove navigation bar and other non-essential elements\n\n2. **Exit Button**\n   - Place \"Exit Fullscreen\" button in top-right corner\n   - Should be clearly visible but not intrusive\n   - Clicking returns to normal page layout\n\n### Target Device\n\n- Primary device: iPad Air\n- Primary browser: Safari, i will hide the toolbar of safari while using\n- Should work on both portrait and landscape orientations\n\n## Success Criteria\n\n- [x] Fullscreen button visible on normal live roast page\n- [x] Portrait mode displays all three sections in correct order (readings → chart → controls)\n- [x] Landscape mode shows streamlined three-section layout\n- [x] Exit fullscreen button appears in top-right corner (landscape mode)\n- [x] Current readings (time, temp, RoR) are clearly visible in both orientations\n- [x] All controls remain functional in fullscreen mode\n- [x] Chart updates in real-time while in fullscreen mode\n- [x] Easy to toggle between normal and fullscreen modes\n- [x] Layout adapts properly when rotating iPad between portrait and landscape\n- [x] No browser fullscreen API needed (pure layout changes)\n\n## User Workflow\n\n1. User opens live roast page on iPad\n2. User clicks \"Fullscreen Mode\" button\n3. Page reorganizes into optimized layout based on current orientation\n4. User can roast with better visibility and less clutter\n5. User clicks \"Exit Fullscreen\" to return to normal view\n\n## Related Files\n\n- `templates/roast_live.html` - Live roasting interface\n- `static/css/style.css` - Styling for fullscreen layouts\n- `static/js/roast-chart.js` - May need adjustments for layout changes\n\n## Resolution\n\nImplemented fullscreen mode with the following features:\n\n### HTML Changes (`roast_live.html`)\n- Added \"Fullscreen\" button with icon in page header\n- Added \"Exit Fullscreen\" button (fixed position, top-right)\n- Added fullscreen readings panel with large Time, Temp, and RoR displays\n- Added IDs to key sections for JavaScript manipulation\n\n### CSS Changes (`style.css`)\n- Added fullscreen mode styles (~400 lines)\n- Portrait mode: readings at top, chart in middle, controls fixed at bottom\n- Landscape mode: readings bar at top, controls in left sidebar, chart on right\n- Safe area insets for notched devices\n- iPad-specific responsive adjustments\n\n### JavaScript Changes\n- `toggleFullscreen()`: Shows/hides navbar, footer, setup section; triggers layout\n- `handleOrientationChange()`: Detects portrait/landscape and applies CSS classes\n- `syncFullscreenDisplays()`: Syncs timer, temp, RoR to fullscreen panel\n- Event listeners for resize and orientationchange\n\n### Implementation Notes\n- Pure CSS layout changes (no browser fullscreen API)\n- Chart automatically resizes when entering/exiting fullscreen\n- All controls remain functional in fullscreen mode\n- Smooth transitions between modes","parent":"","priority":"medium","sourcePath":"resolved/RN-0005-live-roast-fullscreen-mode.md","status":"resolved","tags":[],"title":"Live Roast Page - Fullscreen Mode","type":"feature","unlocksNow":[]},{"area":"live-roasting","blockedBy":[],"completed":"2026-01-18","created":"2026-01-18","decisions":[],"dependents":[],"downstream":[],"downstreamWork":0,"id":"RN-0006","kind":"ticket","markdown":"# Live Chart and Data Recording Issues\n\n(this is fixed poorly by Claude code)\n\n## Description\n\nMultiple issues discovered while using the live roasting page that affect data visualization, layout responsiveness, and data recording accuracy. These have been fixed.\n\n## Resolved Issues\n\n### 1. Fan/Power Bar Resolution Issue - FIXED\n\n**Problem:**\n\n- The fan and power timeline bars were rendered as separate canvas graphs\n- Visual quality/resolution was not ideal\n- They were fragile during resize\n\n**Solution:**\n\n- Added Fan and Power as proper Chart.js datasets with stepped, dashed band rendering\n- Uses a dedicated y-axis (`y-pf`) scaled 0-36 to keep bands within ~25% height at value 9\n- Fan and Power now display in the tooltip (legend remains hidden)\n- Resizes properly with the chart\n\n**Files Changed:**\n\n- `templates/roast_live.html` - Added Power and Fan datasets to chart config\n\n---\n\n### 2. Layout and Resize Issues - FIXED\n\n**Problems:**\n\n- Default layout under full screen mode was too wide\n- Fan and power controls were stacked vertically\n\n**Solution:**\n\n- Reduced default left panel width from 380px to 280px in fullscreen landscape mode\n- Restructured settings inputs: Temperature on its own row, Fan/Power on same row\n- Added new CSS classes: `.settings-group`, `.settings-row-temp`, `.settings-row-fp`\n\n**Files Changed:**\n\n- `templates/roast_live.html` - Restructured settings HTML\n- `static/css/style.css` - Added new layout styles, updated fullscreen styles\n\n---\n\n### 3. ROR \u003e 30 Not Filtered on Live Page - FIXED\n\n**Problem:**\n\n- ROR values exceeding 30°C/min were displayed on live chart\n- This caused misleading spikes, especially at the beginning\n\n**Solution:**\n\n- Added ROR filtering in `updateChartData()` function\n- Only includes ROR values \u003c= 30 in chart (matches detail page behavior)\n- Filtered values show as `null` (gaps in the line)\n\n**Files Changed:**\n\n- `templates/roast_live.html` - Added filter: `const filteredRor = (ror !== null \u0026\u0026 ror !== undefined \u0026\u0026 ror \u003c= 30) ? ror : null;`\n\n---\n---\n\n## Success Criteria - All Met\n\n- [x] Fan and power bars render using proper chart objects (not graph-like)\n- [x] Default layout has smaller left control panel\n- [x] Fan and power controls displayed on same row\n- [x] Temperature chart resizes responsively with layout changes\n- [x] ROR values \u003e 30°C/min are filtered from live page chart\n- [x] Live page ROR behavior matches completed roast detail page\n- [x] No negative time values in any recorded data points\n- [x] No abnormal spikes at beginning of chart from end-of-roast data\n- [x] \"Drop\" event automatically recorded when ending roast\n- [x] Drop event appears on chart with marker (like other events)\n- [x] Drop event includes accurate time and temperature\n\n## Related Files Modified\n\n- `static/js/roast-chart.js` - Added Drop event color\n- `templates/roast_live.html` - Chart datasets, settings layout, event colors\n- `static/css/style.css` - Layout and control styling\n- `app.py` - Backend data recording and roast end logic","parent":"","priority":"high","sourcePath":"resolved/RN-0006-live-chart-data-recording-issues.md","status":"resolved","tags":[],"title":"Live Chart and Data Recording Issues","type":"bug","unlocksNow":[]},{"area":"label-creator","blockedBy":[],"completed":"2026-04-24","created":"2026-04-20","decisions":[],"dependents":[],"downstream":[],"downstreamWork":0,"id":"RN-0007","kind":"ticket","markdown":"# Label Creator Redesign\n\n## Description\n\nRedesign the bean label creator UX to support more layout flexibility and better print consistency.\n\n## Details\n\n- Add 4 template layout options for labels\n- Add font presets to speed up text styling\n- Improve aspect ratio handling for predictable output\n\n## Resolution\n\nImported redesigned `label-creator.js` and `beans_detail.html` assets from the design handoff package and replaced the existing implementation.\n\n## Related Files\n\n- `static/js/label-creator.js`\n- `templates/beans_detail.html`","parent":"","priority":"medium","sourcePath":"resolved/RN-0007-label-creator-redesign.md","status":"resolved","tags":[],"title":"Label Creator Redesign","type":"improvement","unlocksNow":[]},{"area":"docs","blockedBy":[],"completed":"2026-04-24","created":"2026-04-20","decisions":[],"dependents":[],"downstream":[],"downstreamWork":0,"id":"RN-0008","kind":"ticket","markdown":"# Design Documentation Restructure\n\n## Description\n\nThe `docs/design/` folder contained only ad-hoc docs (`README.md`, `dark-mode.md`, `live-roasting-screen.md`). Significant design content was scattered across feature docs (notably `bean-label-creator.md` and `live-roasting.md`). Request: come up with a better doc structure within `docs/design/` and write the full set of design docs.\n\n## Resolution\n\nRestructured `docs/design/` into four subfolders and wrote the full documentation set:\n\n```text\ndocs/design/\n├── README.md                       Navigation + philosophy\n├── principles.md                   Five design principles\n├── foundations/                    Design tokens\n│   ├── color.md\n│   ├── typography.md\n│   ├── spacing-layout.md\n│   └── dark-mode.md                (moved from docs/design/dark-mode.md)\n├── components/                     Reusable UI components\n│   ├── buttons.md\n│   ├── instrument-displays.md\n│   ├── cards-surfaces.md\n│   └── forms.md\n├── screens/                        Screen-specific specs\n│   ├── live-roasting.md            (moved from docs/design/live-roasting-screen.md)\n│   ├── label-creator.md\n│   ├── roast-detail.md\n│   └── bean-inventory.md\n└── patterns/\n    └── label-templates.md          (4 templates × 5 font presets × 5 ratios)\n```\n\nTrimmed design content from `docs/features/bean-label-creator.md` and `docs/features/live-roasting.md` and linked back to the canonical design docs — feature docs now cover behaviour / API / data model only.\n\nUpdated top-level navigation in `docs/README.md` to include the `design/` section.\n\n## Related Files\n\n- `docs/design/**` (14 new docs + rewritten README)\n- `docs/features/bean-label-creator.md`\n- `docs/features/live-roasting.md`\n- `docs/README.md`\n- `docs/issues/README.md`","parent":"","priority":"medium","sourcePath":"resolved/RN-0008-design-documentation-restructure.md","status":"resolved","tags":[],"title":"Design Documentation Restructure","type":"todo","unlocksNow":[]},{"area":"live-roasting","blockedBy":[],"completed":"2026-04-24","created":"2026-04-24","decisions":[],"dependents":[],"downstream":[],"downstreamWork":0,"id":"RN-0009","kind":"ticket","markdown":"# Draft Roast Opens As Read-Only Detail Page\n\n## Description\n\nWhen a user creates a new roast, enters setup information, leaves for the dashboard, and then opens that roast again, the app shows the read-only roast detail experience instead of the live roast setup experience. The user can no longer start the roast or see the live roast curve from that path, so the draft roast feels like it has been treated as a completed roast.\n\n## Reproduction\n\n1. Click **Start New Roast** from the dashboard.\n2. On `/roast/live/\u003croast_id\u003e`, enter draft setup information such as roast name, bean, green weight, ambient temperature, or humidity.\n3. Leave the live roast page without clicking **Start Roast**.\n4. Return to the dashboard.\n5. Click the roast name or the view action for the draft roast.\n\n## Actual Behavior\n\n- The dashboard links the roast to `/roast/detail/\u003croast_id\u003e`.\n- The detail page is read-only and oriented around viewing completed roast data.\n- There is no obvious way to resume the draft on `/roast/live/\u003croast_id\u003e`.\n- Any setup values that are only stored client-side before **Start Roast** may be lost, except fields that have their own autosave behavior.\n\n## Expected Behavior\n\n- A roast with no `roast_start_time` and no `roast_end_time` should still be treated as a draft/pre-start roast.\n- Opening a draft from the dashboard should take the user back to `/roast/live/\u003croast_id\u003e` so they can continue setup and click **Start Roast**.\n- The UI should clearly distinguish draft, active, and completed roasts.\n- Setup information entered before starting should either persist immediately or the UI should make it clear that it has not been saved yet.\n\n## Investigation Notes\n\n- `roast_new()` creates a draft roast and redirects to the live route.\n- The live page decides whether to show the active setup/start/chart UI based on `not roast.roast_end_time`, so an unended draft can still render the live UI if loaded through `/roast/live/\u003croast_id\u003e`.\n- The dashboard currently links every roast name and view action to `roast_detail`, regardless of lifecycle state.\n- The detail page is documented and designed as a read-only view for completed roasts, so routing drafts there creates the \"finished roast page\" feeling.\n- The live setup form only autosaves the roast title on blur; bean, green weight, ambient temperature, and humidity are sent to the server when **Start Roast** is clicked.\n\n## Likely Root Cause\n\nThe app does not model roast lifecycle state explicitly in navigation. Dashboard links treat all roasts as detail-viewable records, even when a roast is still a draft. Separately, pre-start setup fields are not persisted before the start action, so leaving the live page before starting can discard setup edits.\n\n## Proposed Fix\n\n- Add lifecycle-aware dashboard links:\n  - Draft roast: no `roast_start_time` and no `roast_end_time` -\u003e link to `/roast/live/\u003croast_id\u003e` and label action as **Resume Setup**.\n  - Active roast: has `roast_start_time` and no `roast_end_time` -\u003e link to `/roast/live/\u003croast_id\u003e` and label action as **Resume Roast**.\n  - Completed roast: has `roast_end_time` -\u003e link to `/roast/detail/\u003croast_id\u003e` and label action as **View**.\n- Consider adding a status badge on the dashboard: `Draft`, `In Progress`, `Completed`.\n- Persist setup fields before start, either with an explicit **Save Setup** action or autosave for bean, green weight, ambient temperature, and humidity.\n- Add regression coverage for dashboard routing by roast lifecycle state.\n\n## Acceptance Criteria\n\n- [x] A draft roast opened from the dashboard returns to the live setup page and still shows **Start Roast**.\n- [x] An active roast opened from the dashboard returns to the live roast page and shows the running controls.\n- [x] A completed roast opened from the dashboard still opens the detail page.\n- [x] The dashboard makes the roast state visible enough that a draft does not look completed.\n- [x] Setup fields entered before starting are not silently lost, or the UI explicitly communicates when they are unsaved.\n\n## Resolution\n\n- Added lifecycle metadata for roast list rendering so draft and active roasts link back to `/roast/live/\u003croast_id\u003e`, while completed roasts continue to link to `/roast/detail/\u003croast_id\u003e`.\n- Added status badges for `Draft`, `In Progress`, and `Completed` in the dashboard and bean roast history.\n- Added `/api/roast/update_setup/\u003croast_id\u003e` so pre-start setup fields autosave without starting the roast or decrementing bean stock.\n- Updated live-roast reload behavior so an already-started roast resumes with **End Roast** and event controls enabled.\n- Fixed draft deletion so it does not restore bean stock that was never deducted.\n- Added regression tests for lifecycle routing, setup autosave, started-roast setup rejection, and draft deletion stock behavior.\n\n## Related Files\n\n- `app.py`\n- `templates/index.html`\n- `templates/beans_detail.html`\n- `templates/roast_live.html`\n- `templates/roast_detail.html`\n- `tests/test_roasts_api.py`","parent":"","priority":"high","sourcePath":"resolved/RN-0009-draft-roast-readonly-detail.md","status":"resolved","tags":[],"title":"Draft Roast Opens As Read-Only Detail Page","type":"bug","unlocksNow":[]},{"area":"live-roasting","blockedBy":[],"completed":"2026-05-02","created":"2026-04-24","decisions":[],"dependents":[],"downstream":[],"downstreamWork":0,"id":"RN-0010","kind":"ticket","markdown":"# Temperature Sensor Updates Stall During Live Roast\n\n## Description\n\nDuring a live roast, the temperature display is expected to refresh every second and make sensor failures obvious. In practice, the displayed temperature can appear stuck for more than 20 seconds, and the settings modal's **Test Connection** action sometimes fails several times before eventually connecting.\n\n## Details\n\n- The live roast frontend runs `syncState()` every 1 second with `setInterval(syncState, 1000)`.\n- `syncState()` only updates the temperature display when `/api/roast/sync_state/\u003croast_id\u003e` returns `success: true` and `temperature !== null`.\n- If a sensor response is null after a previous successful reading, the UI keeps showing the previous temperature instead of clearly showing stale/offline sensor state.\n- The settings modal's **Test Connection** action calls `/api/temp/current_fast`, which performs one fast sensor read; in real use it can require multiple manual retries before succeeding.\n- The backend has two sensor read paths today:\n  - `/api/temp/current_fast` uses one request with a 200ms timeout.\n  - `/api/temp/current` and DB-log intervals use three requests with 100ms timeouts and require at least two successful readings.\n- The ESP32 firmware exposes `/temp` and `/diagnostics`; hardware-side investigation is in scope if app-side diagnostics point to WiFi, sensor, firmware, or MAX31855 faults.\n- A quick local DB scan found 24 active/non-archived roasts and 9 roasts with `temp_curve` gaps greater than 20 seconds.\n- Example gaps from local DB:\n  - `Taaroo`: gaps of 34s, 39s, 43s, 39s, 34s.\n  - `Hulia`: gaps of 35s, 64s, 46s, 38s, 50s.\n  - `Guji`: gaps of 59s, 62s, 43s, 47s, 50s.\n  - Recent-looking examples also show gaps: `Bishan` 22s, `India` 23s/28s, `Passionfruit` 24s/34s, `Dark Guji Baku` 31s.\n- One roast (`Taaroo Washed`) contains an abnormal negative timestamp gap from `-17098` to `3`, which suggests at least some historical temp data may include stale or corrupted client time.\n- Database gaps only represent successful non-null readings today; null sensor reads are not persisted, so the DB cannot currently distinguish \"poll failed\" from \"poll never happened\".\n- The fix should allow frequent local logging or diagnostics because local DB usage is the common workflow, while still keeping stored payloads reasonably small.\n- Investigation should separate historical roasts from new roasts created after `DB_LOG_INTERVAL_SECONDS = 1`.\n- Suspected causes include intermittent null sensor reads, browser timer throttling or iPad sleep, local network drops, slow ESP32 responses, overlapping `syncState()` requests, and hardware/firmware instability.\n\n## Acceptance Criteria\n\n- [x] A failed or delayed temperature read during a live roast is visible as stale/offline state instead of silently leaving the last good temperature looking current.\n- [x] **Test Connection** no longer fails on a single transient sensor miss without context; it either retries internally or reports enough detail for the user to know whether to retry, check network, or inspect hardware.\n- [x] New diagnostic data can tell whether a \u003e20s display stall came from sensor nulls, missed frontend polls, overlapping frontend requests, backend fetch duration, DB logging cadence, or hardware/firmware faults.\n- [x] Diagnostic logging is frequent enough for local troubleshooting during active live roasts, but bounded so it does not create excessive DB payload size.\n- [x] The implementation verifies the ESP32 `/diagnostics` path or equivalent hardware-side signal when app-side checks suggest hardware instability.\n- [x] New roast data either avoids \u003e20s gaps during normal sensor operation or records enough diagnostics to explain them.\n- [x] Regression coverage or a manual QA checklist exists for sensor unavailable, delayed response, Test Connection retry, and hardware diagnostics cases.\n- [x] Relevant docs updated when implemented: `docs/features/live-roasting.md`, `docs/features/temperature-sensor.md`, `docs/design/screens/live-roasting.md`, `docs/hardware/thermo-sensor.md`, `docs/architecture/api-endpoints.md`, and `docs/architecture/data-models.md` if diagnostic payloads or persisted schema change.\n\n## Resolution Notes\n\nImplemented on `fix/rn-0010-temperature-stalls`.\n\n- Sensor reads now use structured retry metadata with 750ms per attempt.\n- Live roast sync uses up to 3 attempts and accepts 1 successful read for live\n  logging, while `/api/temp/current` still requires 2 successes for the\n  accurate endpoint.\n- The live UI prevents overlapping sync requests and shows `Live`, `Retrying`,\n  `Stale`, `Offline`, or `Sensor fault` under the temperature readout.\n- `lastTemp` is not reused once the sensor state is stale.\n- Test Connection now calls `/api/temp/test_connection`, retries internally, and\n  includes ESP32 `/diagnostics` details when reads fail.\n- Successful `temp_curve` entries store sensor attempt metadata; non-`ok`\n  attempts are stored in bounded `sensor_diagnostics` entries and in local CSV\n  diagnostics.\n\nVerification:\n\n- `uv run pytest tests/test_temperature_api.py tests/test_roasts_api.py::TestRoastSyncState -q` → 15 passed.\n- `uv run pytest` → 71 passed.\n- Live ESP32 `/temp` returned `22.75°C`; `/diagnostics` returned `status: OK`,\n  `error_code: 0`.\n- Two-minute live sync QA with temporary test data recorded 119 points with max\n  `temp_curve` gap of 2 seconds; statuses were 98 `ok` and 22 `retrying`.\n\n## Open Questions\n\n- What exact live-roast stale/offline UX should be used after repeated sensor misses? Answer: compact status text under the temperature tile, mirrored in fullscreen.\n- Should **Test Connection** auto-retry a fixed number of times, expose a manual retry with better status, or show a full diagnostic breakdown? Answer: auto-retry 3 times and include diagnostics when reads fail.\n- What is the acceptable maximum diagnostic payload per active roast when using the local DB? Answer: latest 300 anomaly entries per roast, plus local CSV diagnostics.\n- Should diagnostics be embedded in each roast document, stored in a separate collection, written to local CSV, or split between DB and CSV? Answer: embed bounded anomaly diagnostics on the roast and write detailed per-sync local CSV diagnostics.\n- Which hardware-side failure modes should be tested first: WiFi reconnects, ESP32 response latency, MAX31855 error codes, thermocouple wiring, or power stability? Answer: app-side checks verify ESP32 response latency and MAX31855 diagnostics first.\n\n## Related Files\n\n- `templates/roast_live.html`\n- `templates/base.html`\n- `app.py`\n- `docs/features/live-roasting.md`\n- `docs/features/temperature-sensor.md`\n- `docs/hardware/thermo-sensor.md`\n- `thermo/src/main.cpp`\n- `docs/architecture/api-endpoints.md`\n- `docs/architecture/data-models.md`\n- `docs/design/screens/live-roasting.md`\n- `tests/test_temperature_api.py`\n- `tests/test_roasts_api.py`","parent":"","priority":"high","sourcePath":"resolved/RN-0010-temperature-update-stalls.md","status":"resolved","tags":[],"title":"Temperature Sensor Updates Stall During Live Roast","type":"bug","unlocksNow":[]},{"area":"label-creator","blockedBy":[],"completed":"2026-04-25","created":"2026-04-25","decisions":[],"dependents":[],"downstream":[],"downstreamWork":0,"id":"RN-0011","kind":"ticket","markdown":"# Rotated (90°) PNG Download and Multi-Line Flavor Notes for Bean Labels\n\n## Description\n\nTwo improvements to the bean label creator:\n\n1. **Rotated PNG export.** When exporting a bean label as PNG, also offer a 90°-rotated version of the same render. Some printers and label sheets feed media sideways, so users currently have to rotate the file in another tool before printing.\n2. **Multi-line flavor notes.** The Flavor Notes field is a single-line input, which forces users to cram everything onto one line. Allow line breaks in the input and render each line stacked on the label.\n\n## Details\n\n- The current export path is `downloadLabelPNG()` in [templates/beans_detail.html:490](../../templates/beans_detail.html#L490), which calls `canvas.toDataURL('image/png')` on the canvas rendered by [static/js/label-creator.js](../../static/js/label-creator.js).\n- Add a way to download the same label rotated 90° clockwise (and ideally also -90° / counter-clockwise) without changing the on-screen preview or the underlying template aspect ratio.\n- Implementation sketch: render to the existing canvas, then draw onto an offscreen canvas of swapped dimensions (`width = src.height`, `height = src.width`) with a `translate` + `rotate(±π/2)` transform, and export that offscreen canvas via `toDataURL('image/png')`.\n- Preserve the current export resolution (`RENDER_SCALE = 4`) so print quality matches the non-rotated download.\n- Filename should make the orientation obvious, e.g. `\u003cbean\u003e_label_rotated.png` (or `_rot90` / `_rot-90` if both directions are offered).\n- UI: extend the existing \"Download PNG\" control in `templates/beans_detail.html` — either a second button (\"Download PNG (rotated)\") or a small dropdown next to the existing one. Match existing button styling; do not introduce a new component pattern.\n\n### Multi-line flavor notes\n\n- Replace the `\u003cinput type=\"text\" id=\"labelFlavorNotes\"\u003e` in `templates/beans_detail.html` with a `\u003ctextarea\u003e` (rows ≈ 3) so users can enter each note on its own line.\n- Update the canvas renderer in [static/js/label-creator.js](../../static/js/label-creator.js) so each non-blank line of `flavorNotes` is drawn on its own line for `nova`, `ink`, `washi`. For `strip`, prefer newline-split if present, otherwise keep the existing comma-split fallback so legacy single-line entries still stack correctly.\n- Persisted value in `beans.label.flavorNotes` keeps `\\n` characters — no schema change required.\n\n## Acceptance Criteria\n\n- [x] User can trigger a rotated PNG download from the label creator modal.\n- [x] Downloaded PNG is the label rotated 90° with no clipping, scaling artefacts, or quality loss vs. the standard export.\n- [x] On-screen preview and the standard \"Download PNG\" output are unchanged.\n- [x] Filename clearly indicates the rotated variant.\n- [x] Works across all four templates (`nova`, `ink`, `strip`, `washi`) and all supported aspect ratios.\n- [x] `docs/features/` and/or `docs/design/` entry for the label creator updated to mention the rotated export option.\n- [x] Flavor Notes input accepts and preserves line breaks.\n- [x] Each non-blank line renders on its own line on all four templates (`strip` keeps comma-split fallback for legacy entries).\n- [x] Persisted `beans.label.flavorNotes` round-trips line breaks across save/reopen.\n\n## Resolution\n\n**Rotated PNG export.** Added a second action button \"Download PNG (Rotated 90°)\" alongside the existing \"Download PNG\" in the label creator modal. `downloadLabelPNG(rotateDeg)` now optionally takes a rotation in degrees: when set, it draws the source canvas onto an offscreen canvas with swapped dimensions and a `translate` + `rotate` transform, then exports that. Render scale is preserved (no resampling), so output quality matches the standard export. Filename suffix is `_rot90.png` for the rotated variant.\n\n**Exact physical size.** Both downloads now run the PNG bytes through `injectPhysChunk()`, which inserts a PNG `pHYs` chunk encoding pixels-per-meter derived from the user's cm export size. This means the file inserts at exactly the requested cm dimensions in Word and other apps that honour `pHYs` — important for printing onto pre-formatted sticker sheets. The rotated variant correctly swaps the declared width / height so the rotated content prints at the same physical size, just landscape→portrait.\n\n**Multi-line flavor notes.** Replaced the single-line `\u003cinput\u003e` with a `\u003ctextarea rows=\"3\"\u003e`. Added `splitLines` and `txtMulti` helpers in `label-creator.js`; the Nova, Ink, and Washi templates now stack each non-blank line. Strip prefers newline-split and falls back to comma-split for legacy entries, so existing labels render unchanged.\n\n## Related Files\n\n- `static/js/label-creator.js`\n- `templates/beans_detail.html`","parent":"","priority":"medium","sourcePath":"resolved/RN-0011-label-png-rotated-download.md","status":"resolved","tags":[],"title":"Rotated (90°) PNG Download and Multi-Line Flavor Notes for Bean Labels","type":"feature","unlocksNow":[]},{"area":"label-creator","blockedBy":[],"completed":"2026-04-25","created":"2026-04-25","decisions":[],"dependents":[],"downstream":[],"downstreamWork":0,"id":"RN-0012","kind":"ticket","markdown":"# Remember Last-Used Label Template, Font, and Aspect Ratio\n\n## Description\n\nWhen a user opens the label creator for a bean that has no saved label, the modal currently falls back to hardcoded defaults (`nova` / `modern` / `5:4`). After spending effort to pick a template and font preset they like, users have to re-pick the same combination for every new bean.\n\nUse saved label data already in the database as the source of truth: when opening the modal for a bean with no label of its own, seed the template / font / aspect ratio from the **most recently updated bean** that does have a saved label. No per-browser state, survives across devices.\n\nThis change also fixes a latent bug: the existing `POST /api/beans/\u003cbean_id\u003e/label` handler silently dropped `fontPreset` and `aspectRatio` from the payload, so the per-bean save claimed in `docs/design/screens/label-creator.md` never actually round-tripped those two fields.\n\n## Details\n\n- **Backend bug fix.** Add `fontPreset` and `aspectRatio` to the persisted `label_data` in `app.py` so per-bean saves actually round-trip them. Default `templateId` aligned to `nova`. Default export size kept at 5 × 4 cm (the original DB schema; the redesign briefly drifted to 10 × 8 in client code).\n- **New endpoint** `GET /api/label/preferences` — returns `{ templateId, fontPreset, aspectRatio }` derived from the most recently updated non-archived bean that has a saved `label.templateId`. Falls back to `nova` / `modern` / `5:4` when no bean has a saved label yet. No new collection / schema; reads existing `bean.label` data.\n- **Frontend.** Drop the `localStorage` `roastlogger.labelPrefs` helpers. In `openLabelModal()`'s no-saved-label branch, render immediately with hardcoded fallbacks, then `fetch('/api/label/preferences')` and overwrite the dropdowns + re-render. Per-bean saved labels still win — that branch is unchanged.\n- Only template, font, and aspect ratio are remembered globally. `imageSrc`, `accentColor`, label text, export size remain strictly per-bean.\n- Affects `templates/beans_detail.html`, `app.py`, and label-related docs.\n\n## Acceptance Criteria\n\n- [x] Picking a template / font / aspect ratio in one bean's label modal becomes the default the next time the modal is opened for any bean **that has no saved label**.\n- [x] Beans with an existing `beans.label.templateId` (etc.) still load their saved values, not the global preference.\n- [x] Defaults survive a page reload, browser change, and device change (stored in DB, not browser state).\n- [x] On a fresh database with no saved labels, the modal still opens with `nova` / `modern` / `5:4`.\n- [x] `POST /api/beans/\u003cbean_id\u003e/label` persists `fontPreset` and `aspectRatio` (previously silently dropped).\n- [x] `docs/features/bean-label-creator.md`, `docs/design/screens/label-creator.md`, and `docs/architecture/api-endpoints.md` mention the new endpoint and remembered preference.\n\n## Resolution\n\nInitially shipped with `localStorage`-backed prefs; reworked per user preference to keep all storage in the DB.\n\n- **Backend.** `POST /api/beans/\u003cbean_id\u003e/label` now persists `fontPreset` and `aspectRatio` (these were previously silently dropped — latent bug). Defaults aligned to the redesigned UI. New `GET /api/label/preferences` endpoint returns the style triplet from the most recently updated non-archived bean that has a saved `label.templateId`, with `nova` / `modern` / `5:4` fallback.\n- **Frontend.** Removed all `localStorage` helpers. `openLabelModal()`'s unsaved-bean branch now applies hardcoded fallbacks first (so the modal renders immediately) then fetches `/api/label/preferences` and overwrites the three dropdowns + redraws. Style dropdowns no longer write a per-change pref — the next save propagates them via the bean's own `label`.\n\n## Related Files\n\n- `app.py`\n- `templates/beans_detail.html`\n- `docs/architecture/api-endpoints.md`\n- `docs/features/bean-label-creator.md`\n- `docs/design/screens/label-creator.md`","parent":"","priority":"medium","sourcePath":"resolved/RN-0012-label-template-font-preferences.md","status":"resolved","tags":[],"title":"Remember Last-Used Label Template, Font, and Aspect Ratio","type":"improvement","unlocksNow":[]},{"area":"label-creator","blockedBy":[],"completed":"2026-05-02","created":"2026-05-01","decisions":[],"dependents":[],"downstream":[],"downstreamWork":0,"id":"RN-0013","kind":"ticket","markdown":"# US-4 Sticker Sheet Creator for Bean Labels\n\n## Description\n\nAdd a sticker-sheet creation flow from the beans list page. The flow lets a user use the US-4 sheet template, select one or more images from their local disk, choose how many sticker slots each image should occupy, and download a US Letter-sized PDF with up to four 4\" × 5\" stickers placed exactly on the template.\n\nThis is separate from the current single-label PNG export: the output is a full-sheet print artefact that places selected images into fixed physical slots. Everything stays in the browser — no upload, no persistence.\n\n## Details\n\n### Entry point\n\n- Add a **Create Stickers** action on the beans list page near the out-of-stock filter in the header actions.\n- The action opens a new modal (separate from the existing label modal) so the single-label flow is never disturbed.\n\n### Template\n\n- Initial release ships **US-4 only**. The UI must still expose a template selector (preselected to US-4, disabled or single-option) so adding more templates later is purely additive.\n- US-4 spec:\n  - Sheet size: **8.5\" × 11\"** (US Letter)\n  - Sticker size: **4\" × 5\"** (portrait)\n  - Top / bottom margin: **0.5\"**\n  - Left / right margin: **0.17\"**\n  - Horizontal spacing: **0.16\"**\n  - Vertical spacing: **0\"**\n  - Layout: 2 columns × 2 rows, four sticker slots total.\n- US-4 slot origins, in inches from the top-left of the sheet:\n  - Top-left: `x=0.17`, `y=0.5`\n  - Top-right: `x=4.33`, `y=0.5`\n  - Bottom-left: `x=0.17`, `y=5.5`\n  - Bottom-right: `x=4.33`, `y=5.5`\n\n### Image selection\n\n- Use a native browser file picker (`\u003cinput type=\"file\" accept=\"image/*\" multiple\u003e`). Images are read in-browser only — never uploaded, never saved to the bean. Closing the modal discards them.\n- Each picked image is shown as a thumbnail with: filename, a per-image quantity input, and a remove button.\n- For each image, the user sets how many sticker slots it should fill. The UI warns when the total across all images is not exactly **4**, but export remains available once at least one image is selected.\n- Supported quantity patterns include `4`, `2 + 2`, `1 + 3`, `1 + 1 + 1 + 1`, and any combination summing to 4.\n\n### Slot placement\n\n- Slots are filled in row-major order (top-left → top-right → bottom-left → bottom-right) automatically. No manual per-slot assignment in v1.\n- When the same image fills multiple slots, each slot renders the image identically (same center-cover fit, same orientation).\n\n### Image fit and orientation\n\n- Default fit mode is **center-cover** — the image fills the entire 4\" × 5\" slot edge-to-edge with no blank bands.\n- **Auto-rotate to fit:** if the source image's orientation doesn't match the portrait slot, it is rotated 90° before fitting so it fills the slot naturally. This matches the existing rotated-PNG export behaviour. Most existing bean labels are landscape (5×4), so this auto-rotation is the common path.\n- No \"contain\" fallback in v1 — center-cover is the only fit mode.\n\n### Preview\n\n- The modal shows a **live full-sheet preview** sized proportionally to US Letter, with all four slots visible. The preview is the source of truth for what the PDF will contain.\n- The preview updates immediately on image add, quantity change, or remove.\n- No crop marks, slot outlines, or guides on the exported PDF. The preview may show faint slot outlines for editing only — the export must not.\n\n### Export\n\n- Single download action: **Download PDF**.\n- Output is a single-page US Letter PDF (8.5\" × 11\"). Each image is placed at its slot's exact physical coordinates so the sheet prints at 100% scale and aligns with US-4 sticker stock.\n- Generated entirely client-side using **jsPDF** (new static dependency loaded via `static/js/`). No new backend endpoint, no upload.\n- Filename: `us4_stickers.pdf`.\n- Embedded images should be downscaled appropriately for print (~300 DPI at 4×5 in ≈ 1200×1500 px) so the PDF stays a reasonable size.\n\n### Non-regression\n\n- The existing **Create Label** modal, saved label data, single PNG export (standard and rotated 90°), and `GET /api/label/preferences` flow must continue to work unchanged.\n\n## Acceptance Criteria\n\n- [x] Beans list page has a **Create Stickers** action next to the out-of-stock filter.\n- [x] Clicking it opens a new modal independent of the existing label modal.\n- [x] Template selector shows **US-4** preselected (disabled / single-option for now).\n- [x] User can select one or more images via the native file picker (`accept=\"image/*\"`, `multiple`). Files are read in-browser only — never uploaded, never persisted.\n- [x] Each selected image shows a thumbnail, a quantity input, and a remove control.\n- [x] UI warns when per-image quantities do not sum to exactly 4. Export remains available once at least one image is selected.\n- [x] Slots are filled row-major (top-left → top-right → bottom-left → bottom-right).\n- [x] Each image is auto-rotated to portrait if source orientation is landscape, then center-cover fitted to fill its 4\" × 5\" slot edge-to-edge (no blank bands).\n- [x] Manual crop adjustment was removed to keep the v1 flow lightweight.\n- [x] A live full-sheet preview renders all four slots accurately; updates immediately on image add, quantity change, or remove.\n- [x] **Download PDF** generates a single-page US Letter PDF named `us4_stickers.pdf` using jsPDF, client-side only.\n- [x] PDF prints at 100% scale and aligns with US-4 sticker paper. Slots are positioned at the exact inch coordinates listed in Details.\n- [x] No crop marks, slot outlines, or guides appear in the exported PDF.\n- [x] Existing Create Label modal, saved label data, single PNG export (standard + rotated), and `/api/label/preferences` continue to work unchanged.\n- [x] Docs updated when implemented:\n  - `docs/features/sticker-sheet.md` — new feature doc covering behaviour, template spec, jsPDF approach, no-persistence note (link from `docs/features/bean-label-creator.md` and `docs/features/README.md`).\n  - `docs/design/screens/sticker-sheet.md` — new screen doc for the modal layout and slot preview (link from `docs/design/screens/README.md` if present, plus `docs/README.md` navigation).\n  - `docs/design/patterns/sticker-templates.md` — new pattern doc for the US-4 template (sheet size, slot grid, margins, spacing) so additional templates can follow the same structure.\n  - `docs/architecture/tech-stack.md` — add jsPDF as a new client-side dependency.\n  - `docs/README.md` — top-level navigation entries for the new feature/design/pattern docs.\n\n## Open Questions\n\n- Should the **Create Stickers** entry be a second top-level header button, or grouped under a new dropdown/menu alongside **Create Label** to keep the header tidy as more print actions are added? no it should be at the ppage where we see all the beans\n- For users who pick the same image to fill all 4 slots, should manual crop adjustment apply identically to all 4 slots (current spec) or be adjustable per slot (more powerful, more UI)? Removed for v1 to keep the flow lightweight.\n- Maximum number of selectable images and per-image file size limit (to avoid sluggish in-browser PDF generation)? Suggested default: max 4 images, max 10 MB each — confirm or tighten. yes, do what you say\n- When the user re-opens **Create Stickers** within the same browser session, should the previous selection persist in memory, or always start empty? (Cross-session persistence is already ruled out.) yes, you can use the one in memory\n- Should the export support a \"draft\" mode that overlays slot outlines for proofing before printing on real sticker stock, distinct from the final clean export? no\n- Any accessibility requirements for manual crop adjustment (keyboard nudge, reset button per image)? No longer applicable in v1.\n\n## Related Files\n\n- `templates/beans_list.html`\n- `static/js/sticker-sheet.js`\n- `static/js/jspdf.umd.min.js`\n- `docs/features/bean-label-creator.md`\n- `docs/features/sticker-sheet.md` — new doc\n- `docs/design/screens/label-creator.md`\n- `docs/design/screens/sticker-sheet.md` — new doc\n- `docs/design/patterns/label-templates.md`\n- `docs/design/patterns/sticker-templates.md` — new doc\n- `docs/architecture/tech-stack.md`","parent":"","priority":"medium","sourcePath":"resolved/RN-0013-us-4-sticker-sheet-creator.md","status":"resolved","tags":[],"title":"US-4 Sticker Sheet Creator for Bean Labels","type":"feature","unlocksNow":[]},{"area":"bean-inventory","blockedBy":[],"completed":"2026-05-01","created":"2026-05-01","decisions":[],"dependents":[],"downstream":[],"downstreamWork":0,"id":"RN-0014","kind":"ticket","markdown":"# Add Short Flavor Note to Beans\n\n## Description\n\nAdd a dedicated short flavor note field to bean records so compact tasting copy can be shown in the bean inventory and reused by the label creator without replacing the longer bean notes/description field.\n\n## Details\n\n- Add a new bean data field for the short flavor note, separate from the existing longer `notes` field.\n- The add-bean and edit-bean forms must let users create and update the short flavor note.\n- The Beans tab should show the short flavor note as secondary text under or near the bean name in each row.\n- The existing longer bean `notes` field should remain available for detailed descriptions and should not be overwritten by this change.\n- The bean label creator's Auto-fill from Bean action should populate label `flavorNotes` from the new short flavor note field.\n- If a bean has no short flavor note, Auto-fill from Bean should leave label `flavorNotes` blank instead of falling back to the longer notes/description.\n- Existing saved per-bean label data should continue to take precedence when opening a label that has already been saved.\n\n## Acceptance Criteria\n\n- [x] New beans can be created with a short flavor note, and the value is persisted on the bean document.\n- [x] Existing beans can be edited to add, change, or clear the short flavor note.\n- [x] Short flavor notes can be edited interactively as removable tags in the add/edit bean form.\n- [x] The Beans tab displays the short flavor note as compact secondary text in the bean-name row when present.\n- [x] The Beans tab does not show the longer `notes` field as the preview once the short flavor note field exists.\n- [x] Label Auto-fill from Bean copies the bean short flavor note into label `flavorNotes`.\n- [x] Label Auto-fill leaves label `flavorNotes` blank when the bean short flavor note is empty.\n- [x] API/model tests cover create and edit persistence for the new field, including clearing it.\n- [x] Relevant docs updated when implemented: `docs/architecture/data-models.md`, `docs/architecture/api-endpoints.md`, `docs/features/bean-label-creator.md`, `docs/design/screens/bean-inventory.md`, `docs/design/screens/label-creator.md`.\n\n## Open Questions\n\n- Answered: stored field is `short_flavor_notes`, an array of strings.\n- Answered: no hard UI max length in this version.\n- Answered: bean detail shows short flavor notes as chips in addition to the Beans tab row preview.\n\n## Resolution\n\nImplemented `short_flavor_notes` as a bean-level array, exposed it in add/edit forms with an interactive removable-tag editor, displayed it as compact chips on bean list/detail screens, and used it for label auto-fill.\n\n## Related Files\n\n- `models/bean_helpers.py`\n- `templates/beans_form.html`\n- `templates/beans_list.html`\n- `templates/beans_detail.html`\n- `app.py`\n- `tests/test_beans_api.py`\n- `docs/architecture/data-models.md`\n- `docs/architecture/api-endpoints.md`\n- `docs/features/bean-label-creator.md`\n- `docs/design/screens/bean-inventory.md`\n- `docs/design/screens/label-creator.md`","parent":"","priority":"high","sourcePath":"resolved/RN-0014-short-flavor-note.md","status":"resolved","tags":[],"title":"Add Short Flavor Note to Beans","type":"feature","unlocksNow":[]},{"area":"database-sync","blockedBy":[],"completed":"2026-05-02","created":"2026-05-01","decisions":[],"dependents":[],"downstream":[],"downstreamWork":0,"id":"RN-0015","kind":"ticket","markdown":"# Make Database Sync Timestamp-Aware\n\n## Description\n\nThe Settings modal can already run Local -\u003e Online and Online -\u003e Local database sync, but the current backend sync replaces matching target documents without checking whether the target copy is newer. Make both sync directions safe for beans and roasts by comparing `updated_at` timestamps before overwriting target documents.\n\n## Details\n\n- Current behaviour: `sync_collection(source_col, target_col)` copies every non-archived source document and calls `replace_one()` for matching `_id` values, even when the target document may be newer.\n- Desired behaviour: during Local -\u003e Online sync, insert missing online beans/roasts, but only overwrite an existing online bean/roast when the online `updated_at` is older than the local document's `updated_at`.\n- Desired behaviour: during Online -\u003e Local sync, insert missing local beans/roasts, but only overwrite an existing local bean/roast when the local `updated_at` is older than the online document's `updated_at`.\n- When a bean or roast is actually copied to the target database, the implementation should preserve/update timestamp semantics consistently so future sync decisions are based on reliable `updated_at` values.\n- Sync results should report enough information for the Settings modal/operator to understand what happened: added, updated, skipped because target was newer/equal, and any records that could not be compared.\n- The flow should remain operable through the Settings modal's existing **Local -\u003e Online** and **Online -\u003e Local** buttons, and it should also be safe for an agent/operator to trigger either endpoint intentionally.\n\n## Acceptance Criteria\n\n- [x] Local -\u003e Online sync inserts local beans and roasts that do not exist online.\n- [x] Local -\u003e Online sync overwrites an existing online bean/roast only when the online `updated_at` is older than the local `updated_at`.\n- [x] Local -\u003e Online sync skips existing online beans/roasts when the online `updated_at` is newer than or equal to the local `updated_at`.\n- [x] Online -\u003e Local sync inserts online beans and roasts that do not exist locally.\n- [x] Online -\u003e Local sync overwrites an existing local bean/roast only when the local `updated_at` is older than the online `updated_at`.\n- [x] Online -\u003e Local sync skips existing local beans/roasts when the local `updated_at` is newer than or equal to the online `updated_at`.\n- [x] Sync responses include skipped/conflict counts in addition to added/updated counts.\n- [x] Missing or invalid `updated_at` values are handled explicitly and do not cause silent data loss.\n- [x] Tests cover older target, newer target, equal timestamp, missing target document, and missing timestamp cases for beans and roasts.\n- [x] Relevant docs updated when implemented: `docs/architecture/api-endpoints.md`, `docs/architecture/data-models.md`, and the database sync feature documentation (`docs/features/database-sync.md` if created, otherwise `docs/features/README.md`).\n\n## Open Questions\n\n- Answered: timestamp-aware comparison applies to both Local -\u003e Online and Online -\u003e Local sync.\n- Answered: when the source document is copied to the target, the target keeps the source `updated_at`; sync time is not written as `updated_at`.\n- Answered: when either existing side has no valid `updated_at`, sync skips the overwrite, increments `conflicts`, and reports the document id in `conflict_ids`.\n- Answered: archived documents continue to be ignored by sync.\n\n## Implementation Notes\n\n- `sync_collection()` now returns `added`, `updated`, `skipped`, `conflicts`, and `conflict_ids`.\n- Existing target documents are replaced only when both `updated_at` values are valid datetimes and the source timestamp is newer.\n- Missing target documents are still inserted, with missing `created_at` or `updated_at` values filled on the copied target document.\n- The Settings modal completion toast now reports skipped and conflict counts.\n\n## Related Files\n\n- `app.py`\n- `templates/base.html`\n- `tests/test_sync_api.py`\n- `docs/architecture/api-endpoints.md`\n- `docs/architecture/data-models.md`\n- `docs/features/database-sync.md`","parent":"","priority":"high","sourcePath":"resolved/RN-0015-timestamp-aware-db-sync.md","status":"resolved","tags":[],"title":"Make Database Sync Timestamp-Aware","type":"bug","unlocksNow":[]},{"area":"design-system","blockedBy":[],"completed":"2026-05-02","created":"2026-05-01","decisions":[],"dependents":[],"downstream":[],"downstreamWork":0,"id":"RN-0016","kind":"ticket","markdown":"# New Design System Rollout \u0026 Full UI Redesign\n\n## Description\n\nAdopt a new design system delivered as an Anthropic design bundle and apply it across every screen of RoastLogger in a single coordinated change. This ticket installs the design tokens, base components, and updated design docs that future work will follow, and restyles every existing template against the new system. After this lands, \"adding a new thing\" should mean composing tokens and component recipes from `docs/design/` rather than authoring ad-hoc CSS.\n\n## Details\n\n- **Source of truth — design bundle**: \u003chttps://api.anthropic.com/v1/design/h/AwN20px-BxgCZwbgYpD2ZA\u003e. The endpoint returns a gzipped tar (~894 KB) containing a README and design assets. Implementer must fetch, unpack, and read the README before any styling work.\n- **Scope**: full app redesign. All eight templates and the entirety of `static/css/style.css` (4,268 lines) are in scope. Rip-and-replace, not progressive.\n- **Anchor screens** (land + review against the system first, before the rest of the app):\n  1. Beans inventory — `templates/beans_list.html`, `templates/beans_detail.html`, `templates/beans_form.html`.\n  2. Roast detail / history — `templates/roast_detail.html`, `templates/index.html` (history table).\n- **Remaining screens** restyled in the same ticket once anchors are validated: `templates/base.html`, `templates/roast_live.html`, `templates/roast_edit.html`, plus the label-creator and sticker-sheet modals embedded in the bean templates.\n- **Design system installation** updates the existing `docs/design/` structure (do not create a parallel folder). Refresh:\n  - `docs/design/principles.md` if any of the five principles (tablet-first, chart dominance, glanceable readings, minimal chrome, dark-mode first-class) is changed or replaced.\n  - `docs/design/foundations/{color,typography,spacing-layout,dark-mode}.md` with new token values.\n  - `docs/design/components/{buttons,cards-surfaces,forms,instrument-displays}.md` with updated recipes.\n  - `docs/design/screens/*.md` with new layouts.\n  - `docs/design/patterns/*.md` if label/sticker patterns are touched.\n  - `docs/design/README.md` navigation if file structure changes.\n- **CSS approach**: rip and replace `static/css/style.css`. New component styles must consume `var(--*)` tokens — no hardcoded hex anywhere. No orphan rules referring to deleted classes.\n- **Dark mode parity**: every new token has paired light + dark values. Dark mode remains first-class, not a tacked-on theme.\n- **Live roasting constraints survive the redesign**: ≥54px touch targets on roasting-critical controls, chart dominance preserved, monospaced numerics for timer/temperature/RoR. If the new system clashes with any of these, raise it in Open Questions before merging — do not silently relax the principle.\n- **Forward-looking convention**: capture in `docs/design/README.md` that all new UI must (a) consume `var(--*)` tokens and (b) link to a component recipe under `docs/design/components/`. Ad-hoc styling is not allowed post-rollout.\n- **Out of scope**: backend behaviour, API contracts, data model, hardware integration, label / sticker template *content* (visual styling of those templates is in scope; the printable layouts they generate are not).\n- please note that i want to keep th ecurrent roast live interaction untouched, this is the key.\n\n## Implementation Notes\n\n- 2026-05-02 refinement pass: edit bean now uses the same `.form-section` design-system panels as edit roast, grouped by Bean Profile, Flavor Notes, and Inventory.\n- Shared form controls now use tokenized inset fields, a section accent rule, and `.form-group-title` for bean/roast names.\n- Beans table now uses a fixed `colgroup`, centered sortable metric columns, and horizontal overflow so Stock, Purchase Date, and Price/kg headers align with their values.\n- Bean and roast record names now use the `--font-display` title role (`Raleway`) in list rows, detail headers, and title inputs.\n- Follow-up: roast list/history tables no longer expose an Actions header/column. Row actions render only as a right-edge hover/focus overlay on a neutral row highlight, edit forms are left-aligned at a wider max width, and empty review panels use a compact Add Review button.\n- Follow-up: sticker sheet modal now uses reduced chrome and viewport-bounded preview sizing so the full sheet stays visible; the selected-image list handles overflow internally.\n- Follow-up: review card hover now uses a neutral grey contour instead of the dark primary outline.\n- Follow-up: review cards no longer use a left color strip; they use a plain neutral border at rest.\n\n## Acceptance Criteria\n\n- [ ] Design bundle fetched, unpacked, and its README summarized in the implementing branch's PR description.\n- [ ] New design tokens (color, typography, spacing, radii, shadows) live as CSS variables in `static/css/style.css` (or a dedicated tokens file imported from it), with full light + dark coverage.\n- [ ] `static/css/style.css` rewritten end-to-end with no orphan rules referring to deleted classes.\n- [ ] All eight templates restyled against the new system: `base.html`, `index.html`, `beans_list.html`, `beans_detail.html`, `beans_form.html`, `roast_detail.html`, `roast_edit.html`, `roast_live.html`.\n- [ ] Beans inventory and roast detail/history screens explicitly called out as the anchor reference for the new system in `docs/design/screens/`.\n- [ ] Live roasting screen re-verified against principles 1–4 (touch targets ≥54px, chart dominance, glanceable monospaced numerics, minimal chrome) under the new tokens.\n- [ ] Dark mode verified on every restyled screen.\n- [ ] All design docs updated: `docs/design/README.md`, `docs/design/principles.md`, every file under `foundations/`, `components/`, `screens/`, and any touched files under `patterns/`.\n- [ ] `docs/design/README.md` documents the post-rollout convention: new UI consumes `var(--*)` tokens and links to a component recipe — no ad-hoc styles.\n- [ ] `uv run pytest` passes.\n- [ ] Manually verified in a browser at tablet width (1024px) and desktop width (1440px), in both light and dark mode.\n- [ ] Relevant docs updated when implemented: `docs/design/README.md`, `docs/design/principles.md`, `docs/design/foundations/*.md`, `docs/design/components/*.md`, `docs/design/screens/*.md`, `docs/design/patterns/*.md` (if touched), and `docs/architecture/tech-stack.md` (only if a new CSS framework, font, or icon dependency is added).\n\n## Open Questions\n\n- What is the design system named in the bundle's README, and what palette / type scale / icon set does it ship? — answer:\n- Does the new system change any of the five existing design principles (especially \"tablet-first\" and \"dark-mode first-class\")? If a principle is replaced, `principles.md` must be rewritten, not appended to. — answer:\n- Should the existing warm-roastery palette (`#0E0D0B` base, `#C9A87A` accent) be preserved, replaced, or layered with a brand accent from the new system? — answer:\n- Are there new components in the bundle that don't map to existing recipes (`buttons`, `cards-surfaces`, `forms`, `instrument-displays`)? If yes, add new files under `docs/design/components/` rather than expanding existing ones. — a
